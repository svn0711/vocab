ave no one to go to for advice.","私には相談相手がいない。"],["I have no one to turn to for advice.","僕には相談相手がない。"]]],["nobody",0,6,1,"だれも…ない",[["Nobody likes to be made fun of in public.","誰だって人前でからかわれるのは嫌だろ。"],["Nobody was allowed to go out of the room.","誰も部屋から出ることを許されなかった。"]]],["noisy",0,2,1,"やかましい",[["I dislike living in such a noisy place.","こんなうるさい場所に住むのは嫌です。"],["I don't like noisy music, such as rock.","ロックのような、騒々しい音楽は好きじゃないんだ。"]]],["noon",0,0,1,"正午",[["I'll pick you up at the station at noon.","お昼、駅まで迎えに行くよ。"],["The train will arrive at the station before noon.","その列車は正午前に駅に着くでしょう。"]]],["normal",0,2,1,"正常な、通常の",[["I took my temperature, but it was normal.","体温を計ってみましたが、平熱でした。"],["Temperatures are higher than normal this winter.","今年の冬は、気温が平年より高めです。"]]],["north",0,2,1,"北の",[["We turned left at the corner and drove north.","私たちは角を左に曲がり、車を北へと走らせた。"],["The North Star is very easy to find.","北極星は、とても簡単に見つかります。"]]],["north",0,3,1,"北、北の、北に",[["Oil has been discovered under the North Sea.","北海の海底で石油が発見されている。"],["If you face north, the east is on your right.","北を向くと、東は右側になる。"]]],["north",0,0,1,"北、北に",[["The wind is blowing from the north.","風は北から吹いている。"],["The north wind blew continuously all day.","北風は一日中吹き続けた。"]]],["notice",0,0,1,"人目を引くこと、通告、通知、掲示",[["I had to make a speech on short notice.","私は急にスピーチをしなければならなくなった。"],["A lot of people are starting to notice it.","たくさんの人々がそのことに気づき始めてる。"]]],["noun",0,0,1,"名詞",[]],["novel",0,0,1,"小説",[["This novel isn't as good as his last one.","彼のこの小説は、前作より出来が悪い。"],["I stayed up late last night reading a novel.","昨夜は遅くまで小説を読んでたんだ。"]]],["nowadays",0,3,1,"今日では",[["Nowadays, almost every home has one or two televisions.","最近では、ほとんどの家庭にテレビが一台か二台ある。"],["It isn't easy to find a job nowadays.","今はね、仕事を見つけるのも楽じゃないよ。"]]],["oak",0,0,1,"オークの木",[["These oaks are over a hundred years old.","これらの樫の木は樹齢100年以上です。"],["This table is made of good oak.","このテーブルは良質のオーク材でできている。"]]],["occupation",0,0,1,"職業、占有すること",[["What is your occupation?","お仕事は何をされてるんですか？"]]],["off",0,3,1,"から、から離れたところで、に",[["It was so hot I took my coat off.","とても暑かったので上着を脱いだ。"],["I have to get off at the next stop.","次で降りなきゃ。"]]],["offer",0,0,1,"申し出",[["I had no choice but to accept the offer.","その申し出は受けるより仕方がなかった。"],["No one else will make you a better offer.","これ以上の申し出をする人は他にいない。"]]],["offer",0,1,1,"申し出る、企てる",[["I politely turned down his offer and hung up.","私は彼の提案を丁寧に断り、電話を切った。"],["I'll take any job you can offer me.","貰える仕事は何でもやります。"]]],["official",0,2,1,"の、公式の",[["This news is official.","この報道は公式のものだ。"],["His official title is Director-General of the Environment Agency.","彼の公式の肩書きは環境庁長官です。"]]],["oil",0,0,1,"油",[["We are not short of oil in this country.","この国の石油は不足していない。"],["He bought a lot of flour and oil.","彼はたくさんの小麦粉と油を買い込んだ。"]]],["olive oil",0,0,1,"",[["Do you like olive oil?","オリーブオイルは好きですか？"],["I'd rather use olive oil than butter.","バターを使うよりオリーブオイルの方がいいな。"]]],["Olympic",0,2,1,"オリンピック競技の",[["A lot of countries participated in the Olympic Games.","多くの国がオリンピックに参加した。"],["The Olympic Games are held every four years.","オリンピックは４年ごとに開かれる。"]]],["omelet",0,0,1,"オムレツ",[["You have to break an egg to make an omelet.","卵を割らなければオムレツは作れない。"],["Can you cook an omelet?","オムレツって作れる？"]]],["omelette",0,0,1,"オムレツ",[["You can't make an omelette without breaking eggs.","卵を割らなければオムレツは作れない。"],["Can you cook an omelette?","オムレツって作れる？"]]],["on",0,3,1,"の上に、に",[["I felt a drop of rain on my head.","頭に雨がポツリと当たった気がした。"],["I think Tom can do it on his own.","トムは一人でできると思うよ。"]]],["one",0,6,1,"1個の、ある、1つ",[["I have just one thing to ask of you.","一つお願いがあるんだ。"],["I have no one to turn to for advice.","僕には相談相手がない。"]]],["onion",0,0,1,"タマネギ",[["The only thing I can't eat are onions.","タマネギだけは食べれないの。"],["I grow tomatoes and onions in my garden.","庭でトマトと玉ねぎを栽培しています。"]]],["online",0,2,1,"オンラインの(端末が親コンピューターに直接つながっていること)",[["It may be faster if you apply online.","オンライン申請する方が早いかもね。"],["I buy all my clothes online.","服は全てネットで買います。"]]],["online",0,3,1,"オンラインの(端末が親コンピューターに直接つながっていること)",[["If you apply online, it might be faster.","オンライン申請する方が早いかもね。"],["Tom searched for a job online.","トムはインターネットで仕事を探した。"]]],["operate",0,1,1,"動く、効く、手術をする",[["Tom doesn't have enough experience to operate a train.","トムは列車を運転するには経験が足りない。"],["The doctor decided to operate at once.","医者はすぐ手術することにした。"]]],["opinion",0,0,1,"意見、評価、世論",[["I am of the opinion that he is right.","彼が正しいというのが、私の意見です。"],["I am of the opinion that she is right.","彼女は正しいというのが私の意見です。"]]],["opportunity",0,0,1,"機会",[["Don't let such a good opportunity go by.","こんな好機は逃すなよ。"],["Tom has had many opportunities to do that.","トムはそれをするためのたくさんの機会があった。"]]],["oppose",0,1,1,"反対する",[["You have no right to oppose our plan.","君には、私たちの計画に反対する権利はない。"],["More than half the residents are opposed to the plan.","住民の半数以上はその計画に反対だ。"]]],["opposite",0,2,1,"向こう側の、正反対の",[["Waking up is the opposite of going to sleep.","目覚める事は寝る事の反対です。"],["A man was fishing on the opposite bank.","ひとりの男が対岸で釣りをしていた。"]]],["opposite",0,4,1,"…向こう側の、正反対の、正反対の人",[["They live in the house opposite to ours.","彼らは向かいの家に住んでいる。"],["Tom sat opposite Mary at the table.","トムはメアリーの向かい側に座ってた。"]]],["order",0,1,1,"命令する、注文する",[["What should I do in order to save time?","時間を節約するのには何をすべきだろう？"],["I received an item that I did not order.","注文していない品物を受け取りました。"]]],["organise",0,1,1,"系統だてる、組織する",[["Tom let Mary take the credit for organizing the party.","トムはそのパーティーの企画をメアリーの手柄にした。"],["We hope to organize a tennis club.","私たちはテニス部を作りたいと思っている。"]]],["organised",0,2,1,"",[]],["organize",0,1,1,"系統だてる、組織する",[["Tom let Mary take the credit for organizing the party.","トムはそのパーティーの企画をメアリーの手柄にした。"],["We hope to organize a tennis club.","私たちはテニス部を作りたいと思っている。"]]],["organized",0,2,1,"組織された、(労働者が)組織化された",[["Always keep your workplace organized.","いつも仕事場をきちんと整理しておきなさい。"],["Who organized that meeting?","あの会議を企画したのは誰なの？"]]],["original",0,2,1,"独創的な、最初の",[["You seem to have lost sight of original objective.","あなたは最初の目標を見失っているようです。"],["What do you think of the original plan?","その原案をどう思いますか。"]]],["orphan",0,0,1,"孤児",[["A child whose parents are dead is called an orphan.","両親が亡くなった子供は孤児と呼ばれる。"],["An orphan at three, he was brought up by a distant relative.","３歳のとき孤児になったので、彼は遠い親戚に育てられた。"]]],["other",0,6,1,"別の、もう一方の、反対の",[["They seem to be in love with each other.","あの二人はどうもできているらしい。"],["We can't see the other side of the moon.","月の裏側は見えません。"]]],["ourselves",0,6,1,"私たち自身、私たち自身を、に",[["It's much cheaper for us to make it ourselves.","自分で作る方がはるかに安いよ。"],["It's so nice to be by ourselves.","夫婦水入らずが気楽でいい。"]]],["out of",1,4,1,"",[["I want you to get me out of here.","私をここから出してほしいの。"],["I just can't get it out of my head.","どうしても忘れられない。"]]],["outside",0,4,1,"…外側、外側の、外側に",[["I don't like to cook when it's hot outside.","外が暑い時に料理するのは好きではない。"],["It's OK to take a picture from the outside.","外からなら撮ってもかまいません。"]]],["oven",0,0,1,"天火、かまど、オーブン",[["How long should we leave it in the oven?","オーブンで何分？"],["I have left you your dinner in the oven.","あなたの夕飯はオーブンの中に入れてあります。"]]],["over",0,3,1,"の上に、を越えて、以上に",[["I have a fever and I ache all over.","熱があるので身体中が痛みます。"],["We had a chat over a cup of coffee.","私たちはコーヒーを飲みながらおしゃべりをした。"]]],["overseas",0,3,1,"海外の",[["Every month, I write letters to my friends overseas.","毎月海外の友達に手紙を書きます。"],["When you travel overseas, you usually need a passport.","海外旅行をするとき、普通はパスポートが必要になります。"]]],["overweight",0,2,1,"超過重量・太り過ぎ、重量超過の、太り過ぎの",[["My sister is thin, but I'm a little overweight.","姉はやせているが、私は少し太っている。"],["Tom was a little overweight when he was a kid.","トムは子供の頃、少し太り気味でした。"]]],["own",0,6,1,"自分自身の、自分自身のもの、所有する",[["I think Tom can do it on his own.","トムは一人でできると思うよ。"],["Did you come up with that on your own?","自分で考えたのかな？"]]],["pacific",0,2,1,"平和的な、平和を好む、穏やかな、平穏な",[["The Pacific Ocean is one of the five oceans.","太平洋は五大洋の一つです。"],["She succeeded in crossing the Pacific Ocean by boat.","彼女はボートでの太平洋横断に成功した。"]]],["pack",0,0,1,"包み、束",[["How much does a six-pack of beer cost?","ビール６缶パックは、おいくらですか？"],["My father smokes a pack of cigarettes a day.","父は一日に一箱は煙草を吸うんです。"]]],["pack",0,1,1,"包む、束ねる、詰める",[["How many packs of cigarettes do you smoke daily?","１日にタバコは何箱吸っていますか？"],["Pack your things and get out of here.","荷物をまとめてここから出て行け。"]]],["painter",0,0,1,"画家",[["I've wanted to be a painter for a long time.","ずっと前から絵描きになりたいって思ってるんだ。"],["I know that Tom is a painter.","トムが画家だって知ってるよ。"]]],["pal",0,0,1,"友達",[]],["pan",0,0,1,"平なべ",[["The handle of this pan is easy to hold.","このフライパンのとっては持ちやすい。"],["Did you put oil in the pan?","鍋に油入れた？"]]],["panic",0,0,1,"あわてふためき、恐慌",[["The fire caused a panic in the theater.","火事で劇場の中は大混乱になった。"],["Everybody started to panic.","みんなパ二くり出した。"]]],["park",0,1,1,"駐車する",[["At this time, no one was in the park.","この時間、公園には誰もいなかった。"],["There are a lot of ducks in the park.","公園にね、たくさんのアヒルがいるんだ。"]]],["part",0,0,1,"部分、一部、一部分",[["I want to have a part-time job, too.","私もアルバイトしたいなあ。"],["This part of the report may be left out.","レポートのこの部分は省略できますよ。"]]],["partly",0,3,1,"一部分",[["I'm sorry. I'm partly responsible for it.","ごめん、僕にも責任があるんだ。"],["I partly agree with you.","部分的には賛成だよ。"]]],["pass",0,0,1,"通り過ぎる、過ぎる",[["May I trouble you to pass me the salt?","すみませんが、お塩を取っていただけますか？"],["I studied hard so I could pass the exam.","試験に合格できるように一生懸命勉強しました。"]]],["pass",0,1,1,"通り過ぎる、過ぎる、通過する",[["May I trouble you to pass me the pepper?","すみませんが胡椒をとって下さいませんか。"],["He studied hard in order to pass the test.","彼は試験に合格するために一生懸命勉強した。"]]],["passage",0,0,1,"節、通過すること、旅",[["We found a secret passage into the building.","我々はその建物への秘密の通路を発見した。"],["I copied a passage from the book into my notebook.","その本の一節をノートに書き写した。"]]],["passenger",0,0,1,"乗客",[["There were very few passengers on the last bus.","最終バスには乗客がほとんどいなかった。"],["Most of the passengers on the bus were sleeping.","バスの乗客はほとんど寝ていた。"]]],["pasta",0,0,1,"パスタ(マカロニやスパゲティの類)",[["Can you keep an eye on the pasta?","パスタを見ててくれる？"],["It's been a while since I've had pasta.","パスタを食べるのは久しぶりだな。"]]],["path",0,0,1,"小道、通り道",[["The path is already completely covered with snow.","その小道はもう雪で真っ白です。"],["The path between the two houses was blocked by snow.","２軒の家の間の道は雪で閉ざされていた。"]]],["patient",0,0,1,"患者",[["Tom is a little more patient than I am.","トムの方が私より少し我慢強い。"],["Sister, don't let this patient out of your sight.","シスター、この患者から目を離さないでください。"]]],["PC",0,0,1,"Peace Corps 平和部隊",[["You need to restart your PC.","PCを再起動する必要があります。"]]],["pea",0,0,1,"エンドウ",[["Go buy some green peas — the frozen kind.","グリンピース買ってきて。冷凍のやつね。"],["I'm sick of eating peas.","グリンピースはもううんざりなんだ。"]]],["peaceful",0,2,1,"平和な、穏やかな",[["Sometimes I feel like living a more peaceful life.","もっと穏やかな生活をしたいと思うことが時々ある。"],["We spent a peaceful day in the countryside.","我々は田舎で穏やかな一日を過ごした。"]]],["pear",0,0,1,"西洋ナシ",[["Which do you like better, apples or pears?","林檎と梨、どっちが好き？"],["I got the pears for nothing.","タダで梨をもらっちゃった。"]]],["pen friend",0,0,1,"ペンパル、文通仲間(pen friend)",[]],["pence",0,0,1,"pennyの複数形",[]],["penfriend",0,0,1,"",[]],["pepper",0,0,1,"こしょう",[["May I trouble you to pass me the pepper?","すみませんが胡椒をとって下さいませんか。"],["Maybe it would be better not to add pepper.","コショウは入れない方がいいんじゃないかな？"]]],["perfect",0,2,1,"完全な、正確な",[["You don't have to be perfect all the time.","常に完璧でいる必要はないんだよ。"],["Except for a few mistakes, his composition is perfect.","２、３の誤りがあるのを除いては彼の作文は申し分ありません。"]]],["perfectly",0,3,1,"完全に",[["Don't shout like that. I can hear you perfectly.","そんなに叫ばなくても聞こえます。"],["The shirt you gave me fits perfectly.","くれたシャツ、ぴったりだったよ。"]]],["perform",0,1,1,"成し遂げる、果たす、上演する、演奏する",[["The wedding ceremony was performed in the morning.","結婚式は午前中に行われた。"],["Tom is by far the best singer performing at this club.","トムはこのクラブで抜群の歌手だ。"]]],["performance",0,0,1,"遂行、公演",[["The audience reacted in different ways to her performance.","観客は彼女の演奏にさまざまな反応を示した。"],["During the performance, I was so nervous that my legs were shaking.","本番は、緊張して足がガタガタ震えてました。"]]],["perfume",0,0,1,"香り、香水",[["I don't like the perfume Mary is wearing today.","メアリーが今日つけてる香水は、ちょっと......。"],["I don't like wearing cheap perfume.","安い香水をつけるのは、やだな。"]]],["perhaps",0,3,1,"おそらく",[["Perhaps that's the reason why Tom isn't here today.","多分、今日トムが来てないのはそのせいだ。"],["Perhaps Tom can help you find a job.","多分、トムが仕事を探すの手伝ってくれるよ。"]]],["permission",0,0,1,"許可",[["You must not park your car there without permission.","勝手にそこへ駐車したらいけないのよ。"],["You can't take pictures in the theater without permission.","許可なく劇場内で写真を撮ることはできません。"]]],["personality",0,0,1,"個性、人格",[["Mary resembles her mother in looks, but not in personality.","メアリーは母親と外見は似ているが性格は似ていない。"],["In both appearance and personality, Tom is exactly like his father.","トムは外見も性格も父親に生き写しだ。"]]],["petrol",0,0,1,"ガソリン",[]],["petrol station",0,0,1,"",[]],["photograph",0,0,1,"写真",[["Do you happen to have any photographs of Tom?","ひょっとしてトムの写真をお持ちではありませんか？"],["I want this photograph developed as soon as possible.","至急この写真を現像してほしいのですが。"]]],["photographer",0,0,1,"写真をとる人、(特にプロの)写真家",[["I know the photographer who took this picture.","私はこの写真をとった写真家と知り合いですよ。"],["Tom is a photographer.","トムはカメラマンだよ。"]]],["photography",0,0,1,"写真術",[["Do you have underwater photography equipment?","水中撮影機材はお持ちですか？"],["Are you interested in photography?","写真撮影に興味ある？"]]],["physical",0,2,1,"身体の、肉体の、物質の、自然[界]の",[["When was the last time you had a physical?","最後に健康診断を受けたのは、いつですか？"],["I want to do a little physical exercise.","少し体を動かしたいな。"]]],["physically",0,3,1,"物質的に;身体上;物理的に",[["I want to become both physically and mentally stronger.","体力的にも精神的にももっと強くなりたい。"],["He was there physically, but not mentally.","彼は心ここにあらずという感じだった。"]]],["pile",0,0,1,"積み重ね、多数",[["There's a pile of letters on the table.","テーブルには手紙の山がある。"]]],["pilgrim",0,0,1,"巡礼者",[]],["pill",0,0,1,"丸薬",[["I don't smoke or drink. I just do pills.","僕はタバコも酒もやりません。覚せい剤だけです。"],["I have to take two pills every six hours.","６時間ごとに２錠、飲まなきゃいけないんだ。"]]],["pilot",0,0,1,"水先案内人、パイロット",[["He made up his mind to be a pilot.","彼はパイロットになる決意をした。"],["I want to be a pilot in the future.","将来はパイロットになりたいです。"]]],["pink",0,0,1,"桃色、ピンク",[["Three hundred and fifteen pink rabbits marched along the highway.","315羽の桃色のうさぎが高速道路を行進した。"],["Who is the woman dressed in pink?","あのピンクの服を着た女性はだれですか。"]]],["pity",0,0,1,"あわれみ、残念、遺憾",[["It is a pity that he died so young.","彼がそんなに若くして亡くなったのは残念です。"],["It's a pity you don't know how to dance.","ダンスができないとは残念だ。"]]],["planet",0,0,1,"惑星",[["I wonder if life exists on other planets.","生命は他の惑星に存在しているのだろうか。"],["Is there life on other planets?","他の惑星には生命が存在するのですか。"]]],["plant",0,0,1,"植物、草",[["What did you plant in your garden this year?","今年は庭に何を植えたの？"],["Would you care for my plants while I'm away?","私の留守中、植木の世話をしてくれる？"]]],["plastic",0,2,1,"プラスチック",[["Could I have a plastic bag for those?","ビニール袋に入れてください。"],["These boxes are made out of plastic.","これらの箱はプラスチックでできています。"]]],["plate",0,0,1,"平皿、1皿、分",[["I've got too much on my plate right now.","今は手一杯なんだよ。"],["Sorry, I've got a lot on my plate right now.","ごめん、今すごく忙しいんだ。"]]],["playful",0,2,1,"(人・動物が)遊び好きな、ふざけたがる、(言葉・態度が)冗談の、ふざけた",[["Kittens are very playful.","子猫って、とってもお茶目だね。"],["She laughed and gave me a playful shove.","彼女は笑い、私をいたずらっぽく小突いた。"]]],["playground",0,0,1,"遊び場",[["The rain prevented the boys from playing baseball on the playground.","雨のため、少年たちはグラウンドで野球ができなかった。"],["It rained heavily, so the playground is muddy.","雨がひどく降ったのでグラウンドはぐしゃぐしゃだ。"]]],["pleasant",0,2,1,"人に喜びを与える",[["It is a very pleasant day today.","今日はとても気持ちの良い日だ。"],["This room is pleasant to work in.","この部屋は働くのに快適だ。"]]],["pleased",0,2,1,"喜んだ",[["I am pleased to help you if I can.","私に出来る事でしたら喜んでお手伝いします。"],["I am very pleased to hear the news.","その知らせを聞いてとてもうれしく思う。"]]],["pleasing",0,2,1,"楽しい",[]],["plenty",0,0,1,"たくさん、たっぷり",[["You have plenty of time to catch the train.","電車の時間までにはまだ余裕があるよ。"],["I make an effort to eat plenty of vegetables.","野菜を多くとるよう心がけている。"]]],["plural",0,0,1,"複数の",[["The plural of \"horse\" is \"horses.\"","\"horse\"の複数形は\"horses\"です。"]]],["plus",0,4,1,"…を加えて、を足して、…に加うるに、正の",[["The room charge is $100 a night plus tax.","料金は、税別で一泊１００ドルです。"],["The sum of two plus three plus four is nine.","２と３と４の合計は９だ。"]]],["point",0,1,1,"向ける、指し示す、示す",[["The plane was on the point of taking off.","飛行機はまさに離陸せんとしていた。"],["The point is whether Tom will come or not.","問題は、トムが来るかどうかです。"]]],["police",0,0,1,"警察、警察官",[["Did you advise him to go to the police?","警察へ行くように言ってくれたの？"],["The police got to the scene of the accident.","警察が事故現場に着いた。"]]],["police officer",0,0,1,"警官",[["The police officer asked me what my name was.","わたしは警官に名前を聞かれました。"],["The police officer gave me directions to the station.","おまわりさんが駅までの道を教えてくれました。"]]],["police station",0,0,1,"警察署",[["They advised me to go to the police station.","彼らは私に警察へ行くように助言した。"],["The fire station is next to the police station.","消防署は警察署の隣にあります。"]]],["policeman",0,0,1,"警官",[["He ran away at the sight of a policeman.","彼は警官を見て逃げた。"],["If you don't know the way, ask a policeman.","道がわからなければ警察官に尋ねなさい。"]]],["policewoman",0,0,1,"婦人警官",[]],["polite",0,2,1,"礼儀正しい、ていねいな",[["It's not polite to speak with your mouth full.","口に食べ物がいっぱい入ったままで話すのは、お行儀良くないな。"],["He took off his hat and made a polite bow.","彼は帽子を取って、丁寧にお辞儀した。"]]],["political",0,2,1,"国家の、政治の",[["He has many enemies in the political world.","彼は政界に敵が多い。"],["He assumed the leadership of the political party.","彼はその政党の主導権をにぎった。"]]],["pollute",0,1,1,"汚す、汚染する",[["The river is polluted by waste from houses and factories.","その川は家庭や工場からの廃棄物によって汚染されている。"],["This river is not polluted.","この川は汚染されていない。"]]],["popular",0,2,1,"一般人の、民衆の",[["This is a song that's popular right now.","これが今流行ってる曲よ。"],["She's the most popular girl in the class.","彼女はクラスで最も人気のある女の子だ。"]]],["population",0,0,1,"人口、全住民",[["The city has a population of about four million.","市の人口は、およそ４００万人です。"],["The population has doubled in the last five years.","人口は過去五年で二倍になった。"]]],["portrait",0,0,1,"肖像画",[["This is a portrait of my late father.","これは亡くなった父の肖像画です。"],["A portrait was hung on the wall.","壁には肖像画が飾ってあった。"]]],["position",0,0,1,"位置;場所、姿勢、立場、境遇",[["I'm not now in a position to help you.","私は今あなたを助けられる境遇ではない。"],["I'm not in a position to give you advice.","私はあなたに助言出来る立場にいない。"]]],["possible",0,2,1,"可能な",[["It was possible for him to do the work.","彼はその仕事ができた。"],["I tried to make it as cheap as possible.","できるだけ安くあげようとした。"]]],["possibly",0,3,1,"ひょっとしたら、ことによると、なんとかして",[["Possibly the factory will be closed down next week.","たぶん工場は来週閉鎖されるだろう。"],["Get up as early as you possibly can.","極力早く起きろよ。"]]],["post",0,1,1,"張る",[["How can I get to the nearest post office?","最寄りの郵便局へはどう行けばいいですか。"],["Please tell me the way to the post office.","郵便局へ行く道を教えて下さい。"]]],["post office",0,0,1,"郵便局",[["I want you to go to the post office.","君に郵便局へ行ってもらいたい。"],["This is a post office and that's a bank.","これが郵便局で、あれが銀行です。"]]],["pour",0,1,1,"注ぐ、つぐ、注ぎかける",[["Tom poured cold water over himself to wake himself up.","トムは目を覚ますため冷たい水を自分にかけた。"],["Please pour him a glass of beer.","彼にビールを一杯注いであげてください。"]]],["power",0,0,1,"能力、力",[["Two to the power of five equals thirty-two.","2の5乗は32です。"],["Three to the third power is twenty-seven.","３の３乗は２７である。"]]],["powerful",0,2,1,"強力な",[["The explosion was so powerful that the roof was blown off.","爆発がとてもすさまじかったので、屋根が吹っとんだ。"],["That flower has a powerful smell.","あの花はにおいが強いな。"]]],["precise",0,2,1,"正確な",[["I don't remember the precise date.","正確な日付は覚えてないんだ。"],["Above all, logic requires precise definitions.","とりわけ、論理学には正確な定義が要求される。"]]],["predict",0,1,1,"予報する、予言する",[["Everything is working out just as Tom predicted.","すべてがトムの予言通りに進んでいる。"],["It's hard to predict what the weather will be like tomorrow.","明日の天気がどうなるかを予想するのは難しい。"]]],["prediction",0,0,1,"予報(予言)すること、予報(予言)される事;(…という)予報、予言",[["All of Tom's predictions came true.","トムの予言はすべて当たった。"]]],["prefer",0,1,1,"のほうを好む、選ぶ",[["Do you prefer to go by train or bus?","電車とバス、どっちで行きたい？"],["When I travel, I prefer to travel by air.","旅行するときは私は飛行機の方を好みます。"]]],["prepare",0,1,1,"準備をする、用意をする、用意させる、心構えをさせる、準備する、用意する",[["I prepared a weak solution of sugar and water.","薄い砂糖水を作った。"],["Please fasten your seat belts and prepare for departure.","離陸に備え、シートベルトをお締めください。"]]],["pressure",0,0,1,"押すこと、押しつけること、圧力",[["When Tom takes naps, his blood pressure goes up.","トムは昼寝すると血圧が上がってしまいます。"],["Does anyone in your close family have high blood pressure?","近親者に高血圧の方はいらっしゃいますか？"]]],["pretend",0,1,1,"ふりをする、見せかける、取り繕う",[["There is no point in pretending to be sick.","仮病を使っても無駄ですよ。"],["Tom and Mary pretended to be husband and wife.","トムとメアリーは夫婦の振りをした。"]]],["pretty",0,3,1,"きれいな、かわいらしい、快い",[["Tom picked up some pretty shells on the beach.","トムは海岸できれいな貝殻を拾った。"],["I think it's pretty obvious that Tom likes Mary.","トムがメアリーを好きなのは明らかだと思うよ。"]]],["prevent",0,1,1,"起こらないようにする",[["The noise outside his window prevented him from sleeping.","窓の外の騒音のために、彼は眠ることができなかった。"],["The storm prevented many planes from leaving the airport.","嵐のせいで、多くの飛行機が飛行場を飛びたてなかった。"]]],["pride",0,0,1,"自尊心、得意、高慢",[["She prides herself on her skill in cooking.","彼女は料理の腕を自負している。"],["She always prides herself on her academic background.","彼女はいつも自分の学歴を自慢している。"]]],["principal",0,2,1,"第1の",[["The principal shook hands with each of the graduates.","校長は卒業生一人一人と握手をした。"],["He is the principal of the high school.","彼はその高校の校長です。"]]],["print",0,1,1,"印刷する、出版する、活字体で書く",[["This machine can print sixty pages a minute.","この機械は１分間に６０ページ印刷できる。"],["This book will be printed next year.","この本は来年出版の予定です。"]]],["printer",0,0,1,"印刷する人(機械);印刷屋、(コンピューターの)文字打ち出し機 プリンター",[["Do you plan to buy a new printer?","新しいプリンターを買う予定はないですか？"],["The printer ran out of ink.","プリンターのインクが切れた。"]]],["private",0,2,1,"私的な、私有の、内密の",[["Tom thinks he's being shadowed by a private detective.","トムは探偵に尾行されていると思っている。"],["May I talk with you in private about the matter?","二人だけでお話ししたいのですが。"]]],["pro",0,0,1,"職業選手",[["I like pro wrestling.","プロレスが好きなんだ。"]]],["probably",0,3,1,"たぶん、おそらく",[["Tom is probably a little heavier than I am.","トムは多分僕より少し重い。"],["Mary is probably going to tell Tom she's tired.","メアリーはきっとトムに「眠い」って言うだろうね。"]]],["produce",0,1,1,"産出する、生産する、製造する",[["He produced a rabbit out of his hat by magic.","彼は手品を使って帽子からウサギをとりだした。"],["The factory produces thousands of bottles every month.","その工場は毎月何千本もの瓶を製造している。"]]],["product",0,0,1,"産物",[["Foreign products arrived on the market in large quantities.","外国製品がどかっと市場に出回った。"],["The company deals in a variety of products.","その会社は様々な商品を扱っている。"]]],["production",0,0,1,"生み出すこと、生産、生産高",[["The factory had to cut back its production.","工場は生産を縮小せざるをえなかった。"],["I estimate the production costs to be 36 percent of the budget.","製造費は予算の３６パーセントと見積もっている。"]]],["professional",0,2,1,"専門職の、本職の",[["Tom used to be a professional dog trainer.","トムはかつて、プロのドッグトレーナーだった。"],["Tom used to dream of playing professional baseball.","トムはかつてプロ野球の選手になることを夢見ていた。"]]],["progressive",0,2,1,"進歩的な",[]],["promise",0,0,1,"約束",[["He is the last man to break his promise.","彼は決して約束をやぶらない人だ。"],["I'll tell you if you promise not to tell.","言わないって約束するなら、教えてあげるよ。"]]],["pronounce",0,1,1,"発音する、宣言する",[["Do you know how to pronounce this word?","この単語って、どう発音するか分かる？"],["I'm not sure how to pronounce this word.","この単語の発音に確信はないです。"]]],["pronunciation",0,0,1,"発音",[["Please correct me if I make any mistakes in pronunciation.","どうか発音で誤りがあったら直してください。"],["I'm sorry my pronunciation isn't very good.","発音悪くてごめん。"]]],["proper",0,2,1,"適切な",[["I want to have a proper house and garden.","私はちゃんとした庭付きの家が欲しい。"],["That isn't a proper thing to say.","それは語弊がある。"]]],["provide",0,1,1,"供給する、規定する、備える",[["I will accept the work, provided you help me.","あなたが私を助けてくださるならば、その仕事を引き受けます。"],["We provided the flood victims with food and clothing.","私たちは洪水の被災者に食べ物と衣類を提供した。"]]],["psychologist",0,0,1,"心理学者",[]],["public",0,0,1,"一般の人々",[["Nobody likes to be made fun of in public.","誰だって人前でからかわれるのは嫌だろ。"],["I am not accustomed to making speeches in public.","私は公衆の面前で演説するのに慣れてない。"]]],["publish",0,1,1,"出版する",[["When is your new book going to be published?","新しい本はいつ出版されるんですか？"],["He published the book about the history of coins.","彼はコインの歴史に関する本を出した。"]]],["pull",0,1,1,"引く、引っ張る、ぐいと引っ張る",[["The car pulled up in front of the bank.","その車は銀行の前で止まった。"],["Tom pulled an MP3 player out of his bag.","トムは鞄からMP3プレイヤーを取り出した。"]]],["punctuation",0,0,1,"句読法",[]],["purple",0,2,1,"紫色の",[["I like the gray sweater more than the purple one.","紫色のセーターより灰色のセーターの方が好きです。"],["The color is purple rather than pink.","その色はピンクというより紫だ。"]]],["purpose",0,0,1,"目的、用途",[["I have to attain my purpose at all costs.","何としてでも目標を達成しないといけないんです。"],["Do you think he made that mistake on purpose?","あのミスを彼がわざとやったと思ってるの？"]]],["pursue",0,1,1,"追う、従う",[["The dog pursued a rabbit into the forest.","犬はうさぎを追って森の中に入った。"],["The police are pursuing an escaped prisoner.","警察は脱獄した犯人を追跡している。"]]],["quality",0,0,1,"特質、特性、本質",[["The price is low, but the quality isn't very good.","それは値段は安いが、その反面品質がよくない。"],["They attract customers by offering high-quality goods.","彼らは高品質の商品を提供する事によって顧客を引き付けている。"]]],["queen",0,0,1,"女王、王妃(queen consort)",[["Three ships were given to him by the queen.","３隻の船が女王から彼に与えられた。"],["The queen shook hands with each player after the game.","女王は試合後に選手の一人一人と握手をした。"]]],["quick",0,2,1,"速い、瞬間の、理解の早い",[["We had a quick lunch at a cafe.","私達はカフェで軽いランチを食べた。"],["I was quick tempered when I was young.","若い頃はすぐ頭に血が上ってたな。"]]],["quietly",0,3,1,"静かに、穏やかに",[["You speak so quietly I can barely hear you.","あなたの声小さすぎて、ほとんど聞こえてないよ。"],["She sat next to him and listened quietly.","彼女は彼の隣に座り、静かに聴いた。"]]],["quit",0,1,1,"やめる、中止する、断念する",[["I am certain that he will quit his job.","彼が仕事を辞めるのは確かだと思う。"],["I hated working at the factory, so I quit.","工場で働くのが嫌でさ、辞めたんだ。"]]],["quite",0,3,1,"全く、かなり",[["It is quite natural for her to get angry.","彼女が怒るのも当然だ。"],["It's quite clear to me that is the truth.","それが事実だということはぼくにははっきりわかっている。"]]],["quiz",0,0,1,"小テスト、クイズ",[["We will have a math quiz tomorrow.","明日数学の小テストがある。"],["We had a quiz today.","今日、小テストがありました。"]]],["racket",0,0,1,"ラケット",[["You have the same racket as I have.","君は僕と同じラケットを持っている。"],["I left my tennis racket on the train.","電車にテニスラケットを忘れてきた。"]]],["raincoat",0,0,1,"レインコート",[["A button has come off my raincoat.","レインコートのボタンが取れちゃった。"],["Why are you wearing a raincoat? It's not raining, is it?","なんでカッパ着てんの？ 雨降ってないじゃん。"]]],["raise",0,1,1,"上げる、を上げる、高める",[["She raised the boy to be a fine person.","彼女はその少年を立派な人に育て上げた。"],["I raise a variety of roses in the garden.","私は庭でバラを育てている。"]]],["range",0,0,1,"幅、範囲",[["Tom has a wide range of interests.","トムは多趣味だ。"],["We discussed a wide range of topics.","私たちは、さまざまなテーマについて話し合った。"]]],["rap",0,0,1,"コツン、トン、とたたくこと",[["He gave a rap on the door.","彼は戸をトントンとたたいた。"]]],["rate",0,0,1,"割合、率、速度",[["The birth rate and death rate were nearly equal.","出生率と死亡率は、ほぼ等しかった。"],["Please find some hotel where the rates are moderate.","料金の手ごろなホテルを見つけて下さい。"]]],["rather",0,3,1,"いくぶん、それどころか",[["Would you rather go by train or by bus?","電車とバス、どっちで行きたい？"],["I would rather stay at home than go out.","出かけるよりも家にいたいんだ。"]]],["rating",0,0,1,"(品質・技量などによる)格づけ、評価、(個人・会社の経済的な)信用度",[]],["raw",0,2,1,"生の、料理されていない、原料のままの",[["Tom knows that Mary doesn't like raw eggs.","トムはメアリーが生卵を嫌いなのを知っている。"],["Eating raw chicken can give you food poisoning.","生の鶏肉を食べると食中毒を起こすことがあります。"]]],["ray",0,0,1,"光線",[["I have to go and have an X-ray tomorrow.","明日、レントゲンを撮りに行かなきゃいけないんだ。"],["The X-ray showed two broken fingers.","レントゲン写真は二本の骨折した指を映し出していた。"]]],["reach",0,1,1,"着く、到着する、届く",[["The woman reached for the knife on the table.","女はテーブルのナイフに手を伸ばした。"],["At last, they reached the top of the mountain.","ついに彼らはその山の頂上に到達した。"]]],["realise",0,1,1,"完全に理解する、実現する",[["He doesn't realise that he's tone deaf.","あいつ、自分が音痴だってこと知らないんだよ。"]]],["realize",0,1,1,"完全に理解する、実現する",[["I never realized how much I would miss you.","あなたがいないとどんなに寂しくなるか、私は全く気付かなかった。"],["I didn't realize that you were feeling so bad.","あなたがそんなに気分が悪いなんて気づかなかった。"]]],["receipt",0,0,1,"領収書(証)",[["Be sure to get a receipt.","必ず領収書をもらいなさい。"],["Do you still have the receipt?","レシートはまだお持ちですか？"]]],["receive",0,1,1,"受け取る",[["I received an item that I did not order.","注文していない品物を受け取りました。"],["It is more blessed to give than to receive.","与えられるより与える方がいっそう恵まれている。"]]],["recent",0,2,1,"少し前に起こった、つい最近あった",[["I'm really not up on recent TV shows.","最近のテレビ番組のことは知らないんだ。"],["Do you have a recent photo of yourself?","最近の写真はありますか？"]]],["recently",0,3,1,"近ごろ",[["Recently, I meet with my teacher once a week.","最近毎週１回、先生とお会いします。"],["When I saw her recently, she looked very happy.","最近彼女にあったとき、とても幸せそうだった。"]]],["receptionist",0,0,1,"(ホテル・病院・事務所などの)受付係",[]],["record",0,1,1,"記録する",[["She set the world record for the high jump.","彼女は走り高跳びの世界記録を樹立した。"],["I don't think that Tom has a criminal record.","トムに前科はないと思うよ。"]]],["recycle",0,1,1,"を再利用する",[]],["red",0,0,1,"赤、赤色",[["Which color do you like more, blue or red?","青と赤ではあなたはどちらの方が好きですか。"],["Give me two red roses and three white ones.","赤いバラを２本と白いバラを３本ください。"]]],["refer",0,1,1,"差し向ける、委託する、話を及ぼす",[["Mary didn't refer to the accident she had seen.","メアリーは自分が見た事故について触れなかった。"],["He even referred to the origin of life.","彼は生命の起源にまで説き及んだ。"]]],["reflect",0,1,1,"反射する、映す",[["I've been reflecting on what you said to me.","君に言われたことを、ずっと考えていたんだ。"],["It is time to reflect on your past.","自分の過去をじっくり振り返ってみてもよいころだ。"]]],["refrigerator",0,0,1,"冷蔵庫",[["Tom forgot to put the milk in the refrigerator.","トムったら、冷蔵庫に牛乳を入れ忘れたのよ。"],["Tom took the orange juice out of the refrigerator.","トムは冷蔵庫からオレンジジュースを出した。"]]],["regret",0,1,1,"後悔する",[["I just want you to know I regret it.","後悔してるってことだけはわかって欲しい。"],["It was my decision and I don't regret it.","自分が決めたことだし、後悔はない。"]]],["regular",0,2,1,"いつもの、規則正しい、正規の",[["We conduct safety inspections here on a regular basis.","ここでは定期的に安全点検を実施します。"],["Fill her up with regular. I'll be paying in cash.","レギュラー満タン、現金で。"]]],["regularly",0,3,1,"規則正しく、一様に;正式に;定期的に",[["I regularly go to bed at nine.","いつも９時には寝ます。"],["Are you taking any medicine regularly?","何か薬を常用していますか。"]]],["relax",0,1,1,"ゆるめる、ゆるむ",[["Today, I just want to stay home and relax.","今日は家で、ダラダラしてたい。"],["Some people are killing time relaxing on park benches.","何人かの人々が公園のベンチでくつろぎながら時間をつぶしている。"]]],["relaxed",0,2,1,"",[["The locals around here really live at a relaxed pace.","こっちの人 n't grow.","蒔かぬ種は生えぬ。"],["Cover the seeds with a bit of soil.","種の上に少し土をかぶせなさい。"]]],["seek",0,1,1,"…を捜し求める、捜す;捜し出す、…しようと努力する",[["Do you want to play hide-and-go-seek?","かくれんぼしようか？"],["I don't know how to play hide-and-seek.","かくれんぼのルールが分からない。"]]],["seem",0,1,1,"見える",[["Tom may not be as rich as he seems.","トムは見た目ほど裕福ではないのかもしれない。"],["It seems to me that we should go now.","私たちはもう行ったほうがいいでしょう。"]]],["semester",0,0,1,"(米国・ドイツなどの大学の二学期制の)一学期、前(後)期(通例15‐18週)",[["My grades have improved since first semester.","１学期に比べて成績がよくなった。"],["The semester exams are finally over.","やっと期末試験が終わった。"]]],["send",0,1,1,"送る、行かせる",[["I asked Tom to send the book to us.","本をこちらに送ってもらえるように、トムにお願いしました。"],["I want you to send this parcel at once.","この小包をすぐ送ってもらいたい。"]]],["senior",0,2,1,"年上の",[["She gave her seat to a senior citizen.","彼女は老人に席を譲った。"],["This village has a lot of senior citizens.","この村にはお年寄りの方が大勢います。"]]],["senior",0,0,1,"年長者",[["There are many senior citizens in this area.","この地区は高齢者が多い。"],["Are you a senior high school student?","高校生ですか？"]]],["sense",0,0,1,"感覚、感じ、理解",[["I didn't know Tom had a sense of humor.","トムにユーモアのセンスがあるとは知らなかったよ。"],["I had enough sense to get out of there.","気を利かせて外へ出た。"]]],["separate",0,2,1,"分離する、分割する",[["I'll show you how to separate gold from sand.","砂から金を分離採集する方法をお見せしましょう。"],["You can't separate language from culture.","言葉と文化を切り離すことはできないんだよ。"]]],["seriously",0,3,1,"真剣に、重大に",[["Are you seriously thinking about buying that old car?","あの古い車を本気で買おうと思っているんですか？"],["Are you seriously thinking of giving Tom your computer?","マジで、トムにパソコン譲ろうと思ってる？"]]],["serve",0,1,1,"仕える、勤める、服する",[["During the war, he served in the army.","戦時中、彼は陸軍に所属していた。"],["Please give me a large serving of rice.","ご飯は大盛りでお願いします。"]]],["set",0,0,1,"一組、一群、仲間",[["We set out on our journey full of hope.","私たちは期待に胸をふくらませて旅立った。"],["The problem was where to set up the tent.","問題はどこにテントを張るかだった。"]]],["several",0,7,1,"いくつかの",[["A combination of several mistakes led to the accident.","いくつかのミスが重なってその事故が起こった。"],["The temperature has been below freezing for several days.","この数日間、ずっと氷点下の気温が続いている。"]]],["several",0,6,1,"いくつかの",[["Several students were absent from school because of colds.","数人の生徒が風邪で学校を休んだ。"],["I'm going to be here for several days.","ここには数日いるつもりだよ。"]]],["sew",0,1,1,"縫う",[["She stayed up late to finish sewing your dress.","彼女はあなたのドレスを縫い上げるために夜遅くまで起きてたんだよ。"],["Would you sew a button on my shirt?","ワイシャツにボタンをつけて。"]]],["shade",0,0,1,"陰",[["It was cool in the shade of the trees.","木陰は涼しかった。"],["We had a rest in the shade.","私達は日陰で一休みした。"]]],["shadow",0,0,1,"影",[["I wonder if Mary is wearing eye shadow.","メアリーはアイシャドウつけてるのかな？"],["He is afraid of his own shadow.","彼はびくびくしている。"]]],["shall",0,9,1,"でしょう、でしょうか、してしまっているでしょう",[["Shall I help you look for your keys?","鍵を探すの、手伝いましょうか？"],["Shall I ask her to send the book to us?","彼女にその本を送ってくれと頼みましょうか。"]]],["shampoo",0,0,1,"洗髪剤、シャンプー、髪を洗うこと",[["I got shampoo in my eyes and it hurts.","シャンプーが目に入ってヒリヒリする！"],["I don't shampoo my hair in the morning.","朝シャンはしません。"]]],["shape",0,0,1,"形を作る",[["I'll try to shape my ideas into a book.","私は自分の考えをまとめて本にしてみるつもりだ。"],["The earth is similar to an orange in shape.","地球は形がオレンジに似ている。"]]],["share",0,0,1,"分け前、分担、株",[["This is a great opportunity to increase our market share.","これは、市場シェアを拡大するすばらしいチャンスです。"],["May I share this table with you?","相席させていただいてよろしいですか。"]]],["shell",0,0,1,"貝がら、堅い外皮",[["Tom picked up some pretty shells on the beach.","トムは海岸できれいな貝殻を拾った。"],["I came out of my shell in college.","大学生の時に心を開きました。"]]],["shine",0,1,1,"光る、輝く、光を向ける、みがいて光らせる",[["The game will be held rain or shine.","試合は晴雨を問わず行われます。"],["The game will be played rain or shine.","試合は雨天決行です。"]]],["shock",0,0,1,"衝撃、打撃",[["The news that he died was a shock to me.","彼が死んだと言うニュースは私にはショックだった。"],["For Tom, getting fired was an unexpected shock.","トムにとって、解雇は予想外のショックだった。"]]],["shoot",0,1,1,"撃つ、射撃する",[["She was wounded by a shot in the leg.","彼女は足を撃たれて負傷した。"],["Tom claims he shot Mary in self-defense.","トムは正当防衛でメアリーを射ったと主張した。"]] m is better than gold or silver.","富は一生の宝、知は万代の宝。"]]],["similar",0,2,1,"似ている",[["This is very similar to the one I have.","これ、私が持っているのにすごくよく似てる。"],["The earth is similar to an orange in shape.","地球は形がオレンジに似ている。"]]],["simple",0,2,1,"簡単な、単純な、飾り気のない",[["If it's a simple tune, I can sight-sing it.","簡単な曲なら初見で歌えます。"],["I can't tell her now. It's not that simple anymore.","もう彼女には言えないよ。そんなに単純なことではなくなってきたからね。"]]],["simply",0,3,1,"簡単に、飾り気なく、単に",[["I work simply because I like to work.","私はただ単に働くのが好きだから働くのである。"],["She left me simply because I had a small income.","ただ収入が少ないというだけの理由で、彼女は私から去っていった。"]]],["since",0,4,1,"…以後、ずっと、ので",[["I have known him since he was a baby.","私は彼が赤ちゃんの時から知っている。"],["Since I had a cold, I stayed at home.","カゼを引いたので、家にいました。"]]],["singing",0,0,1,"歌、歌唱、声楽、歌うこと;歌声",[["I sometimes hear my father singing in the shower.","シャワールームから時々父の歌声が聞こえてくる。"],["I sometimes hear my father singing in the bathroom.","時々、父がお風呂場で歌っているのが聞こえてくるんです。"]]],["single",0,2,1,"の、一人用の、独身の",[["Not a single person was on the street.","通りには、人っ子一人いなかった。"],["Do you really think that Tom is single?","本当にトムは独身だと思う？"]]],["singular",0,2,1,"非凡な、奇妙な、単数の",[]],["singular",0,0,1,"非凡な、奇妙な",[]],["sink",0,0,1,"量、程度など、流し",[["I thought you were going to fix the sink.","あなたが流し台の修理をしてくれるのだと思っていました。"],["Tom always leaves dirty dishes in the sink.","トムはいつもシンクに汚れたお皿を置きっぱなしにするんだよ。"]]],["sitting room",0,0,1,"居間",[]],["situation",0,0,1,"立場、事態、位置",[["What would you do in a situation like this?","このような状況に立たされたら、あなたはどうしますか？"],["I will explain the situation to you later on.","事情は後で説明する。"]]],["skate",0,0,1,"アイススケート靴、滑り金具、エッジ",[["The ice is too thin to skate on.","氷が薄すぎてスケートができません。"],["It is safe to skate on this lake.","この湖でスケートをしても安全だ。"]]],["skateboarding",0,0,1,"",[]],["skating",0,0,1,"",[["To me, skiing is far more interesting than skating.","私には、スケートよりもスキーのほうがずっと面白いです。"],["I would often go skating on the lake.","よく湖へスケートに行ったものだ。"]]],["ski",0,0,1,"スキー",[["I have to buy a new pair of skis.","新しいスキー板を買わなくてはいけない。"],["I want to buy a pair of ski boots.","スキーブーツを買いたい。"]]],["skiing",0,0,1,"スキー",[["How many times a year do you go skiing?","一年にどのくらいスキーに行きますか？"],["I used to often go skiing in the winter.","私はよく冬にスキーに出かけたものだった。"]]],["slave",0,0,1,"奴隷、とりこ",[["I refuse to be treated like a slave by you.","お前に隷従する気なんかないからな。"],["My boss is a slave driver.","僕のボスは人使いが荒いんだ。"]]],["sleepless",0,2,1,"眠れない、不眠症の、常に活動している、休みない",[["Tom spent a sleepless night thinking of Mary.","トムはメアリーのことを考えて眠れない夜を過ごした。"],["The affair cost me many sleepless nights.","この件で、私は何日も眠れぬ夜を過ごす羽目になった。"]]],["sleepy",0,2,1,"眠い",[["I feel sleepy when I listen to soft music.","ゆったりした音楽を聞くと眠くなっちゃうんだ。"],["It is no use studying when you are sleepy.","眠いときに勉強しても無駄だ。"]]],["slice",0,0,1,"一枚",[["There are two slices of pizza for each person.","ピザは一人二切れずつだからね。"],["How many slices of pizza did you eat?","ピザ何切れ食べた？"]]],["slide",0,0,1,"滑る、つるりと滑る",[["Look out for rock slides.","岩崩れに気をつけて。"]]],["slim",0,2,1,"(体格などが)ほっそりとした、細い、(量・程度などが)わずかの、少しの(slig",[["My uncle is slim, but my aunt is fat.","叔父はすらっとしているが、叔母は太っている。"],["Chances of promotion are slim in this firm.","この会社では昇進の見込みがない。"]]],["slowly",0,3,1,"遅く、ゆっくり",[["I think you should speak a bit more slowly.","もうちょっとゆっくり話した方がいいんじゃない？"],["Could you please speak a little bit more slowly?","もう少しゆっくり話していただけませんか。"]]],["smoke",0,1,1,"煙を出す、たばこを吸う、吸う",[["I don't smoke or drink. I just do pills.","僕はタバコも酒もやりません。覚せい剤だけです。"],["Give up smoking if you want to live long.","長生きしたいんだったら、タバコをやめなよ。"]]],["smooth",0,2,1,"滑らかな、平らな",[["The sea was as smooth as glass.","海は鏡のようになめらかだった。"],["The train came to a smooth stop.","列車は滑らかに停止した。"]]],["smoothly",0,3,1,"(またsmooth)滑らかに、円滑に;平隠に",[["The work progressed smoothly.","仕事はすらすらと運んだ。"],["She smoothly and elegantly poured the water into the glass.","滞りのない、優雅な仕草でグラスに水を注ぎ込んだ。"]]],["snack",0,0,1,"軽食",[["Tom went to the kitchen to get a snack.","トムならおやつをもらいに台所に行ったよ。"],["My doctor told me not to snack between meals.","お医者さんに、間食はしないようにって、言われちゃった。"]]],["snow",0,1,1,"雪が降る",[["We had a good deal of snow last winter.","去年の冬は雪が多かった。"],["We have to clear the snow off the roof.","屋根の雪おろしをしなくてはいけないな。"]]],["snowboarding",0,0,1,"",[["I want to learn snowboarding.","スノーボードを習いたい。"],["Tom became interested in snowboarding when he was about twelve.","トムは、１２歳頃にスノーボードに興味を持つようになった。"]]],["so",0,3,1,"そういうふうに、そのように、そのようで",[["It was so hot I took my coat off.","とても暑かったので上着を脱いだ。"],["He was sick, so he did not go out.","彼は病気だった、それで外出しなかった。"]]],["soap",0,0,1,"石けん",[["Have you ever washed your face with body soap?","ボディーソープで顔洗ったことある？"],["Tom washed his hands with soap and water.","トムは石鹸と水で手を洗いました。"]]],["society",0,0,1,"社会、会",[["The influence of TV on society is great.","テレビが社会に与える影響は大きい。"],["The impact of science on society is great.","社会に対する科学の影響は大きい。"]]],["sock",0,0,1,"短い靴下",[["Tom had one of his socks on inside out.","トムは片方の靴下を裏返しにはいていた。"],["You have your right sock on wrong side out.","右の靴下が裏返しだよ。"]]],["soda",0,0,1,"ソーダ",[["Add salt and baking soda to the water.","塩と重曹を水に加えてください。"],["Tom drinks a lot of soda.","トムは炭酸をよく飲む。"]]],["soft",0,2,1,"柔らかい",[["I feel sleepy when I listen to soft music.","ゆったりした音楽を聞くと眠くなっちゃうんだ。"],["He addressed the audience in a soft tone.","彼は聴衆に静かな口調で演説した。"]]],["soft drink",0,0,1,"(アルコール分を含まない)清涼飲料;(特に)炭酸飲料",[["Do you have any soft drinks?","ソフトドリンクはありますか。"]]],["softly",0,3,1,"柔らかに",[["The mother laid her baby on the bed softly.","母親は赤ちゃんをベッドにそっと寝かせた。"]]],["software",0,0,1,"ソフトウェア(コンピューターに関係するプログラム・手順・規則などの文書類の総称)",[["That software was released six months ago.","そのソフトは半年前にリリースされたよ。"],["How can I update this software?","このソフト、どうやったらアップデートできるの？"]]],["soldier",0,0,1,"軍人、下士官、兵士",[["There are soldiers guarding the area around the clock.","そこは、日中問わず兵士が警備に当たっている。"],["They supplied the soldiers with enough food and water.","彼等は兵士たちに十分な食料と水を補給した。"]]],["solution",0,0,1,"解くこと、解答、溶液",[["I can't think of any solution to this problem.","この問題への解決策が全く思いつかない。"],["I prepared a weak solution of sugar and water.","薄い砂糖水を作った。"]]],["somebody",0,6,1,"だれか",[["I'm glad it was somebody else who got it.","対岸の火事で良かった。"],["If he doesn't accept the job, somebody else will.","彼がその仕事を引き受けなければ、誰か別の人が引き受けるだろう。"]]],["someday",0,3,1,"いつか",[["I want to go to a foreign country someday.","いつか外国へ行きたいなぁ。"],["I want to play tennis with you someday.","私はいつかあなたとテニスをしたい。"]]],["somewhere",0,3,1,"どこかに",[["Is there somewhere nearby I can park my car?","この近くに車とめれるところってある？"],["I thought that we were going to go somewhere.","私たちはどこかに行くものだと思っていました。"]]],["sound",0,0,1,"音、音響、安定した",[["I love the sound of rain on the roof.","私は屋根に当たる雨の音が好きだ。"],["I don't like the sound of my own voice.","自分の声が好きじゃないのよね。"]]],["sound",0,1,1,"音を出す、聞こえる、思える",[["Tom didn't sound as if he was in trouble.","トムが困ったことになっているようには思えなかった。"],["I fell sound asleep because I was very tired.","私はとても疲れていたのでぐっすり眠ってしまった。"]]],["source",0,0,1,"水源、地、元",[["He got all his information from secondary sources.","彼は情報をすべて又聞きで得た。"],["This is the source of the confusion.","これが混乱の元です。"]]],["south",0,2,1,"南の",[["In the fall, many birds head for the south.","秋にはたくさんの鳥が南に向かう。"],["The South Pole is a lot colder than the North Pole.","南極は北極よりもずっと寒い。"]]],["south",0,3,1,"南、南の、南の方へ(に)",[["The military engaged the enemy five kilometers south of the capital.","首都の５km南で、兵士たちは敵と戦闘を行った。"],["My house faces to the south.","私の家は南向きです。"]]],["south",0,0,1,"南、南の方へ(に)",[["My house looks to the south.","私の家は南向きです。"],["Birds fly south in the winter.","鳥は冬になると南へ飛んでいきます。"]]],["space",0,0,1,"空間、宇宙、間隔",[["I wonder what it's like to travel through space.","宇宙旅行するってどんなものだろう。"],["There isn't enough space here for forty people.","４０人に十分なスペースはここにはない。"]]],["spaceship",0,0,1,"宇宙船",[["Tom always wondered what it was like inside a spaceship.","宇宙船の中はどうなっているのかと、トムはずっと不思議に思っていた。"],["The spaceship made a perfect landing.","宇宙船は完璧な着陸をした。"]]],["spaghetti",0,0,1,"スパゲッティ(マカロニより細く、中が空になっていない)",[["You have some spaghetti sauce on your face.","顔にスパゲッティーのソースがついているよ。"],["Don't call it spaghetti. Call it pasta.","スパゲティじゃなくパスタって呼んでね。"]]],["speaker",0,0,1,"話す人",[["A crowd of people gathered around the speaker.","話し手の周りには人だかりがしていた。"],["The speaker requested that the audience remain silent.","演説者は聴衆に黙っているように要求した。"]]],["specific",0,2,1,"特定の、明確な、特有の",[["That's a very specific question.","それはとても具体的な質問です。"]]],["speed",0,0,1,"速いこと、速度",[["I was amazed at the speed of the car.","あの車のスピードには度肝を抜かれたよ。"],["The police car was driving at fairly high speed.","パトカーがかなりの速度で走っていた。"]]],["spell",0,1,1,"つづる、つづりである",[["I get dizzy spells when I stand up.","立ちくらみがします。"],["I can't remember how to spell her name.","彼女の名前のつづりが思い出せないんだ。"]]],["spill",0,1,1,"こぼす、こぼれる",[["I spilled some fruit juice on my new shirt.","新しいシャツにフルーツジュースを少しこぼしてしまった。"],["Who spilled the milk on the floor?","誰が、床に牛乳をこぼしたの？"]]],["splash",0,1,1,"はねかける、まく",[["Tom jumped into the water with a splash.","トムはざぶんと水に飛び込んだ。"],["Tom went splashing through the shallows.","トムが浅瀬をぽちゃぽちゃと歩いて行った。"]]],["split",0,2,1,"縦に割る、分配する",[["I hear that Tom and Mary have split up.","トムとメアリーが離婚したんだって。"],["I didn't want to split up with Mary.","メアリーとは別れたくなかった。"]]],["spoon",0,0,1,"スプーン",[["She stirred her tea with a little gold spoon.","彼女はちいさな金のスプーンで紅茶をかき回した。"],["Tom stirred the soup with a spoon.","トムはスプーンでスープをかき混ぜた。"]]],["sports center",0,0,1,"",[]],["sports centre",0,0,1,"",[]],["spread",0,0,1,"薄く塗る、広がる",[["The waitress spread a white cloth over the table.","ウエートレスはテーブルの上に白いテーブルクロスをかけた。"],["I spread the big map on the table.","私は机の上に大きな地図を広げた。"]]],["square",0,2,1,"正方形の、平方の",[["We were back to square one.","振り出しに戻ってしまった。"],["A square has four equal sides.","正方形は４つの同じ長さの辺をもつ。"]]],["square",0,0,1,"正方形、広場、2乗",[["Tom drew two squares on the blackboard.","トムは黒板に正方形を2つ描いた。"],["We learned at school that the square root of nine is three.","僕らは９の平方根は３だと学校で習った。"]]],["stadium",0,0,1,"競技場",[["There were lots of people in the stadium.","スタジアムには大勢の人がいた。"],["How long does it take to get to the stadium?","スタジアムまでどれくらいかかりますか？"]]],["staff",0,0,1,"つえ、職員",[["The fire broke out after the staff went home.","そ ",[["The storm had a bad impact on the crops.","嵐は作物に多大な影響を与えた。"],["It seems that there will be a storm soon.","近いうちに嵐になりそうだ。"]]],["stove",0,0,1,"ストーブ、料理用レンジ",[["Are you sure you turned off the stove?","本当にストーブを消した？"],["The coal in the stove is burning.","ストーブの中の石炭が燃えている。"]]],["straight",0,2,1,"まっすぐな",[["Did you go straight home after school yesterday?","昨日学校の後って、まっすぐ家に帰った？"],["He's too tall to stand up straight in this room.","彼は背が高すぎて、この部屋ではまっすぐに立てない。"]]],["stranger",0,0,1,"見知らぬ人、よそから来た人",[["A stranger asked me the way to the school.","知らない人が、学校へ行く道を聞いてきたの。"],["A stranger spoke to me on the crowded bus.","見知らぬ人が混み合ったバスの中で私に話しかけた。"]]],["strategy",0,0,1,"兵法、用兵学、戦略、戦術",[]],["strength",0,0,1,"力、耐久力",[["You must eat properly to keep up your strength.","体力を維持するにはちゃんと食べなければいけません。"],["I don't have the strength to keep trying.","私にはやり続けるだけの強さがない。"]]],["strike",0,0,1,"ストライキ、ストライク",[["\"Will they go on strike again?\" \"I'm afraid so.\"","「あの人たちは、またストをやるんだろうか」「どうもそうらしいね」"],["Workers at the company went on a strike.","その会社の労働者はストを決行した。"]]],["string",0,0,1,"ひも、一つなぎ、一続き",[["Give me a knife to cut this string with.","このひもを切るナイフをちょうだい。"],["I broke a string on my guitar.","ギターの弦が切れた。"]]],["strongly",0,3,1,"強く",[["He is a tall and strongly built man.","彼は背が高く骨組みのがっちりした人だ。"],["I recommend it strongly.","超おすすめだよ。"]]],["structure",0,0,1,"(建物・橋などの)建造物、(…の)構造、組成、組織",[["I studied the structure of Ainu families.","アイヌ人の家族構成を研究しました。"]]],["study",0,0,1,"勉強、綿密な調査、書斎",[["He doesn't study as hard as he used to.","彼は前ほど勉強しない。"],["I've decided to study as hard as I can.","もっと一生懸命勉強しようと心に決めました。"]]],["stuff",0,0,1,"材料、物",[["I don't see how you can eat that stuff.","よくもまあ、あんなものが食べられるね。"],["Why do we need to learn this stuff anyway?","一体どうして私たちがこれを学ぶ必要があるんですか？"]]],["style",0,0,1,"流行[型]、様式",[["A cafeteria is a self-service style restaurant.","カフェテリアは料理を自分で取るセルフサービスのレストランです。"],["I like home-style cooking.","家庭的な料理が好きです。"]]],["succeed",0,1,1,"成功する、継承する",[["I hope you will succeed in winning the prize.","賞が取れるといいですね。"],["Do you, by any chance, think you will succeed?","ひょっとして君は自分が成功すると思っているのかね。"]]],["success",0,0,1,"成功、好結果、上首尾、成功した人(物、事)、成功者; うまく行くこと",[["He thinks that his success is due to luck.","彼は自分の成功を幸運のおかげだと考えている。"],["I was delighted at the news of her success.","私は彼女が成功したという知らせを聞いて喜んだ。"]]],["successfully",0,3,1,"首尾よく、うまく、みごとに、成功して",[["She successfully got him to tell the truth.","彼女はうまく彼から真実を聞きだした。"]]],["such",0,7,1,"こんな、そんな、とても",[["You don't need to go in such a hurry.","そんなに急いで行く必要はない。"],["A wise man would not say such a thing.","賢い人ならそんなこと言わないでしょう。"]]],["such",0,6,1,"こんな、そんな、とても",[["I can't get by on such a small income.","こんなわずかな収入ではとてもやっていけない。"],["No one will bother to do such a thing.","誰もわざわざそんなことしないよ。"]]],["sudden",0,2,1,"突然の",[["All of a sudden all the lights went out.","突然、すべての明かりが消えた。"],["All of a sudden, all the lights went out.","突然明かりが全て消えてしまった。"]]],["suggest",0,1,1,"それとなく示す",[["He suggested I go with him to the party.","パーティーに一緒に行こうと、彼に誘われました。"],["He suggested that I accompany him to the party.","彼は私にパーティーに同行してはどうかと言った。"]]],["suit",0,0,1,"スーツ、訴訟、適する",[["I must buy a new suit for my son.","息子に新しい背広を買ってやらなければならない。"],["I have to take my suit to the cleaners.","スーツをクリーニングに出さなきゃ。"]]],["suit",0,1,1,"似合う",[["I bought a suit with two pairs of pants.","ツーパンツスーツを買った。"],["I'm looking for a gym suit for my sister.","妹の体操服を探してるんです。"]]],["suitable",0,2,1,"適当な、ふさわしい",[["The job is not suitable for young girls.","その仕事は若い女性には適当ではない。"],["T-shirts and jeans are not suitable for this occasion.","Tシャツやジーンズは、この場にふさわしくありません。"]]],["suitcase",0,0,1,"スーツケース、(長方形で平たい)小型旅行かばん",[["I had him take my suitcase to the room.","私は彼にスーツケースをその部屋に運んでもらった。"],["I need a suitcase. Will you lend me one?","スーツケースがいるの。あなたの貸してくれない？"]]],["summary",0,0,1,"要約、用約した",[["Please send in your summary by Tuesday.","要約を火曜日までに提出しなさい。"]]],["sunflower",0,0,1,"ヒマワリ",[["Be careful when carrying sunflower oil.","ひまわり油を運ぶ際は、注意してください。"],["Did you buy sunflower seeds?","ひまわりの種買ったの？"]]],["sunglasses",0,0,1,"サングラス",[["Tom used to wear sunglasses all the time.","トムってさ、いつもサングラスをかけてたんだよ。"],["I wore sunglasses to protect my eyes from the sun.","私は太陽から目を保護するため、サングラスをかけていた。"]]],["sunlight",0,0,1,"日光(sunshine)",[["Store in a cool place, away from direct sunlight.","直射日光の当たる場所は避け、涼しい場所で保管してください。"],["This room doesn't get a lot of sunlight.","この部屋はあまり日が当たらないんだ。"]]],["superlative",0,0,1,"(程度・質が)最高の、この上ない、(形容詞・副詞の)最上級の",[]],["superstar",0,0,1,"(芸能・スポーツでの)スーパースター、超花形選手",[]],["supper",0,0,1,"夕食",[["I have my supper at a quarter past seven.","夕飯は７時１５分に食べてます。"],["I want to eat curry rice for supper tonight.","今夜はカレーが食べたいな。"]]],["support",0,0,1,"支えること、扶養する人",[["I worked hard in order to support my family.","私は家族を養うために懸命に働いた。"],["He worked hard in order to support his family.","彼は自分の家族を養うために一生懸命働いた。"]]],["sure",0,3,1,"確信して、確実な、確固とした",[["I'm sure you can do that if you try.","君は挑戦したら出来ると僕は確信してる。"],["Are you sure it was Tom who did that?","本当にあれやったのはトムだったの？"]]],["surf",0,1,1,"(海岸・岩に砕ける)寄せ波、岸打つ波、(砕ける波の)白いあわ",[["When was the last time you went surfing?","最後にサーフィンに行ったのって、いつ？"],["Surfing is a lot of fun.","サーフィンはすごく楽しい。"]]],["surfing",0,0,1,"波乗り、サーフィン",[["When was the last time you went surfing?","最後にサーフィンに行ったのって、いつ？"],["Surfing is a lot of fun.","サーフィンはすごく楽しい。"]]],["surname",0,0,1,"姓、名字(family name、 last name)、あだ名(nicknam",[]],["surprised",0,2,1,"驚いた、びっくりした",[["I was surprised at the news of his death.","彼が死んだと言うニュースを聞いて驚いた。"],["He was surprised to hear a cry from within.","彼は中から聞こえてくる叫び声にびっくりした。"]]],["surprising",0,2,1,"驚くべき",[["It is surprising that he should not know this.","彼がこのことを知らないとは驚きだ。"],["It is surprising that your wife should object.","奥さんが反対するとは意外だな。"]]],["survive",0,1,1,"…の後まで生きる、 …より長生きする; 助かる; 耐える・生き残る; 残存する",[["She was the only one to survive the crash.","彼女はその墜落事故の唯一の生存者であった。"],["Only one little boy survived the traffic accident.","１人の少年だけが交通事故から一命をとりとめた。"]]],["swallow",0,1,1,"飲み込む",[["I can't swallow these tablets without a drink of water.","水なしじゃ、こういう錠剤は飲み込めないよ。"],["We can see more and more swallows.","さらに多くのツバメを見ることができます。"]]],["sweat",0,1,1,"汗をかく",[["Beating the other team was no sweat at all.","相手チームをやっつけるのは朝飯前だった。"],["It's so warm in this room that I'm sweating.","この部屋はとても暑いので汗をかいています。"]]],["sweater",0,0,1,"セーター",[["I was cold, so I put on a sweater.","寒かったから、セーターを着たんだよ。"],["I think this sweater will look good on you.","このセーターは君に似合うと思う。"]]],["sweet",0,0,1,"砂糖菓子",[["I don't know how to make sweet and sour pork.","酢豚の作り方は知らないな。"],["My tea is a little too sweet.","私の紅茶、ちょっと甘すぎるわ。"]]],["sweetheart",0,0,1,"恋人、愛人、(呼び掛けで)ねえ、あなた(君)",[]],["swimming costume",0,0,1,"水泳着、水着",[]],["swimsuit",0,0,1,"水泳着、水着",[["I need a new swimsuit.","新しい水着がいるの。"],["My swimsuit is very tight.","水着がめっちゃきつい。"]]],["symbol",0,0,1,"象徴、記号",[["An expensive car is a status symbol.","高級車は地位の象徴である。"],["The color white is a symbol of purity.","白は純潔の象徴である。"]]],["symphony",0,0,1,"交響楽",[["Today's performance of the ABC Symphony Orchestra fell short of my expectations.","今日のＡＢＣ交響楽団の演奏は期待はずれだった。"]]],["system",0,0,1,"体系、制度",[["The new tax system comes into effect next year.","新しい税制は、来年から実施される。"],["The transportation system in that city is quite good.","その町の交通機関は大変よい。"]]],["table tennis",0,0,1,"卓球、ピンポン",[["Tom can play both tennis and table tennis well.","トムはテニスも卓球もうまい。"],["Ping pong is also called table tennis.","ピンポンは卓球とも呼ばれている。"]]],["tablespoon",0,0,1,"食卓用スプーン",[]],["talent",0,0,1,"才能",[["He lacks the talent to be an actor.","彼には俳優になる才能がない。"],["He has a talent for music.","彼には音楽の才能がある。"]]],["tap",0,0,1,"軽く打つこと",[["It's better not to drink the tap water.","水道水は飲まないほうがいいよ。"],["Tom felt someone tap him on the shoulder.","トムは誰かに肩を叩かれた気がした。"]]],["tape",0,0,1,"テープ",[["There was a tape recorder on the table.","テープレコーダーはテーブルの上に置いてあった。"],["I paid 40,000 yen for this tape recorder.","このテープレコーダーに４万円払ったんだよ。"]]],["target",0,0,1,"標的",[["I aimed my gun at the target.","僕は的に向けて銃のねらいを定めた。"],["The arrow fell short of the target.","矢は的に届かなかった。"]]],["task",0,0,1,"仕事",[["I was given the task of cleaning the office.","私は事務所を掃除する仕事を与えられた。"],["How soon will you be able to finish the task?","いつまでにその仕事を終わらせることができますか。"]]],["tear",0,0,1,"裂く、破って作る",[["Tom was watching TV with tears in his eyes.","トムは涙ながらにテレビを見ていた。"],["Even the hard-hearted can be moved to tears.","鬼の目にも涙。"]]],["teenage",0,2,1,"(数字が ‐teen で終わる)13歳から19歳までの、10代の(に特有な)",[["Tom loved writing poems when he was a teenager.","トムはね、１０代の頃詩を書くのが好きだったんだよ。"]]],["teenager",0,0,1,"ティーンエージャー(13歳から19歳までの少年・少女)",[["Tom loved writing poems when he was a teenager.","トムはね、１０代の頃詩を書くのが好きだったんだよ。"],["The report revealed that many teenagers are alcoholics.","その報告書から１０代の多くの子供がアルコール中毒にかかっていることが分かった。"]]],["telephone",0,1,1,"電話をかける",[["Give me a telephone call when you get back.","お帰りになったら電話を下さい。"],["I was having a bath when the telephone rang.","私の入浴中に電話が鳴った。"]]],["temperature",0,0,1,"温度、体温",[["I have a cold and a temperature of 38 degrees.","かぜで熱が三十八度あります。"],["The temperature has been below freezing for several days.","この数日間、ずっと氷点下の気温が続いている。"]]],["terrify",0,1,1,"恐れさせる",[["Tom is obviously terrified.","トムは見るからに怖がっている。"]]],["terrorist",0,2,1,"テロリスト、暴力主義者、恐怖政治家、暴力政治の;暴力主義者の",[]],["text",0,0,1,"原文、本文",[["Tom and Mary exchange more than 200 text messages every day.","トムとメアリーは毎日200通以上の携帯メールをやり取りしている。"],["I just got a text from Tom.","ちょうどトムからメッセージが届いたよ。"]]],["text",0,1,1,"原文、本文",[["I've just received a text from Tom.","トムからのメッセージを受け取ったばかりだよ。"],["I don't remember sending that text message.","そんなショートメール、送った覚えないけど。"]]],["text message",0,0,1,"",[["Tom and Mary exchange more than 200 text messages every day.","トムとメアリーは毎日200通以上の携帯メールをやり取りしている。"],["I don't remember sending that text message.","そんなショートメール、送った覚えないけど。"]]],["textbook",0,0,1,"教科書",[["I gave him three textbooks in exchange for his help.","手伝ってもらった代わりに彼にテキストブックを３冊あげた。"],["This textbook is too hard for me.","この教科書はボクにとっては難しいよ。"]]],["theirs",0,6,1,"彼らのもの、彼らの",[["Are you a friend of theirs?","あいつらの友達なのか？"],["Some have come to meet their friends and others to see theirs off.","友人を迎えに来た人もいれば、見送りに来た人もいる。"]]],["themselves",0,6,1,"彼ら自身、彼ら自身を(に)",[["Tom and Mary ate the whole cake by themselves.","トムとメアリーが二人でケーキ全部食べちゃった。"],["These days many old people live by themselves.","最近一人暮しの老人が多い。"]]],["therefore",0,3,1,"それゆえ",[]],["thief",0,0,1,"泥棒",[["I only got a short glimpse of the thief.","私は、その泥棒をほんのちらっと見ただけです。"],["The thief was marched off to the police station.","泥棒は警察署に連行された。"]]],["third",0,2,1,"第3番目の",[["I am in charge of the third-year class.","私は３年生を受け持っている。"],["This is the third longest river in the world.","これは世界で３番目に長い川です。"]]],["thirsty",0,2,1,"のどの渇いた、渇望(熱望)している",[["He was very thirsty and asked for some water.","彼は、とても喉が渇いてるから水をくれと言った。"],["They were very tired, hungry, and thirsty that night.","その夜、彼らは非常に疲れ、空腹で、喉がかわいていました。"]]],["though",0,5,1,"…にもかかわらず、たとえ…でも、もっとも…ではあるが",[["He came even though I told him not to.","私が来るなと言ったのにかかわらず、彼はやってきた。"],["He dozed off even though he didn't want to.","彼はついうとうととした。"]]],["thought",0,0,1,"考えること、考え、思想",[["I thought I told you to go to bed.","寝るように言ったはずだけど。"],["I thought I might not make it in time.","間に合わないかと思ったよ。"]]],["thousand",0,8,1,"1000の",[["I have a deposit of a thousand dollars here.","私はこちらの銀行に１０００ドルの預金がある。"],["Five thousand dollars is a large sum of money.","５千ドルというのは、多額なお金だ。"]]],["throw",0,1,1,"投げる、投げつける",[["He threw a piece of meat to a dog.","彼は一切れの肉を犬に投げ与えた。"],["This is still too good to be thrown away.","これはまだ捨てるには惜しい。"]]],["thunderstorm",0,0,1,"大雷雨、雷を伴ったあらし",[["The weather report said that there will be thunderstorms tomorrow evening.","天気予報は明日の晩は雷雨になると言っていた。"],["Communications have been cut off for two hours because of a thunderstorm.","２時間ほど前から雷雨のため連絡が断たれている。"]]],["tidy",0,2,1,"きちんとした",[["I want to keep my room as tidy as possible.","自分の部屋は出来るだけきちんとしておきたい。"],["You need to keep your room tidy.","部屋をきちんとしておかなくてはならない。"]]],["tidy",0,1,1,"きちんとした",[["Keep your room as tidy as possible.","自分の部屋は出来るだけきちんとしておきなさい。"],["You must keep your room tidy.","部屋をきちんとしておかなくてはならない。"]]],["tie",0,0,1,"つながり、ネクタイ、同点",[["Hold still a moment while I fix your tie.","ネクタイを締める間、ちょっとじっとしてね。"],["I used to wear ties, but I don't anymore.","前はネクタイをしてたんだけど、今はもうしないね。"]]],["tights",0,0,1,"(軽業師・舞踊家・婦人・少女などが履く)タイツ",[]],["till",0,4,1,"…まで[ずっと]、…まで[…ない]",[["I didn't miss my watch till I got home.","家に帰るまで、時計をなくしてしまったことにきづかなかった。"],["My father used to drink till late at night.","私の父は、昔はよく夜遅くまで酒を飲んでいたものでした。"]]],["timetable",0,0,1,"時間表、時間割り;(鉄道の)時刻表、(…のために)…の計画表(時間割り)を作る;",[["May I have a timetable?","時刻表をいただけますか。"],["Do you have a timetable?","時刻表をお持ちですか。"]]],["tip",0,0,1,"先、先端に付ける物(部分)、チップ",[["His name is on the tip of my tongue.","彼の名前、喉まで出かかってるんだけど。"],["The word is on the tip of my tongue.","言葉は、喉まで出かかってるんだ。"]]],["title",0,0,1,"題名、肩書き、所有権",[["I don't remember the title of that movie.","その映画のタイトルは覚えてないんだ。"],["The book doesn't have a title, yet.","その本、まだタイトルがついてないんだ。"]]],["toast",0,0,1,"トースト、をきつね色に焦がす",[["I thought Tom would want butter on his toast.","トムはトーストにはバターを塗るんだと思ってたよ。"],["I always have coffee and toast for breakfast.","朝食はコーヒーとパンに決めている。"]]],["toe",0,0,1,"足の指、つま先",[["There is no feeling in my toes at all.","足の指の感覚が全くない。"],["I have a pain in my little toe.","足の小指が痛むんだ。"]]],["tone",0,0,1,"音、言い方、書き方、正常な状態",[["I don't want to sing, because I'm tone-deaf.","私は音痴だから歌いたくない。"],["He addressed the audience in a soft tone.","彼は聴衆に静かな口調で演説した。"]]],["tonight",0,0,1,"今晩、今夜[は]",[["Would you like to go to a movie tonight?","今夜映画を見に行かないか。"],["Are you going to go to the party tonight?","今夜はパーティーに行く予定なんですか？"]]],["toothache",0,0,1,"歯痛",[["I have a toothache, so I can't eat anything.","歯が痛いので、何も食べられません。"],["A toothache deprived me of sleep.","歯が痛くて眠れなかった。"]]],["toothbrush",0,0,1,"歯ブラシ",[["The one who uses this toothbrush isn't my mother.","この歯ブラシを使っているのは母ではない。"],["How long have you been using this toothbrush?","この歯ブラシ、いつから使ってるの？"]]],["tour",0,0,1,"観光旅行、小旅行",[["Can I buy tickets on the day of the tour?","チケットは、当日でも買えますか？"],["How much would you want to pay for the tour?","予算はどのくらいでしょうか。"]]],["tour guide",0,0,1,"",[["Can I hire a tour guide?","観光ガイドは雇えますか。"],["I'll be your tour guide.","私が、ツアーガイドになってあげるよ。"]]],["tourist",0,0,1,"[観光]旅行者、観光客、観光旅行[用]の",[["They approached the tourists and asked them for money.","彼らは旅行者に近づき、金をねだった。"],["The tourist asked for lodging for the night.","旅行者は一夜の宿を求めた。"]]],["toward",0,4,1,"…のほうへ、…のほうに、…近く",[["A boxer and an actor are coming toward us.","ボクサーと俳優がこっちに向かってくる。"],["I saw many people hurrying toward the ball park.","大勢の人が野球場へ急いでいるのが見えた。"]]],["towards",0,4,1,"toward",[["Both parties took a step towards a solution.","両者は解決に向かって一歩踏み出した。"],["A boy came running towards me.","少年が私に向かって駆けてきた。"]]],["track",0,0,1,"通った跡、足跡、小道",[["My business has at last gotten on the right track.","私の事業もようやく軌道に乗りました。"],["I saw bear tracks in the snow.","雪にクマの足跡があったんだよ。"]]],["trade",0,0,1,"商業、職業",[["They held a special session on trade problems.","彼等は貿易問題について臨時の会合を開いた。"],["My father is engaged in foreign trade.","父は貿易業に従事している。"]]],["tradition",0,0,1,"しきたり、伝統",[["He turned his back on the old tradition.","彼は古い伝統に背を向けた。"],["This tradition has been passed down from generation to generation.","この伝統は代々受け継がれている。"]]],["traditional",0,2,1,"伝説の、慣習の、伝統に従った、伝統的な",[["It was a very traditional ceremony.","それはとても伝統的な儀式だった。"],["Tom believes in traditional gender roles.","トムは男尊女卑思想の持ち主だ。"]]],["traffic",0,0,1,"往来、交通",[["There is a lot of traffic in this area.","この辺は、交通量が多いです。"],["There is a lot of traffic on that street.","あの通りは交通量が多いよ。"]]],["traffic light",0,0,1,"(交差点の)交通信号灯",[["Because the traffic light turned red, he stopped his car.","信号が赤に変わったので、彼は車を止めた。"],["Turn left at the second traffic light.","2つ目の信号を左に曲がってください。"]]],["train",0,1,1,"教え込む",[["I got my foot caught in a train door.","電車の扉に足を挟まれたんだよ。"],["I was just in time for the last train.","僕は終電にぎりぎりのところで間に合った。"]]],["training",0,0,1,"訓練",[["I prepared for the game by training hard.","私は懸命にトレーニングして試合に備えた。"],["The training session is scheduled to begin at 4 p.m.","研修会は午後4時開始予定です。"]]],["tram",0,0,1,"(また tramcar)=streetcar、(鉱山用の)四輪運搬車、トロッコ",[]],["trap",0,0,1,"わな",[["The enemy is caught like a mouse in a trap.","敵はもう袋のネズミだ。"],["It could be a trap. Don't let your guard down.","罠かもしれん、油断するな。"]]],["travel",0,0,1,"旅行する",[["I blew my whole bonus on shopping and travel.","ボーナス全部を買い物と旅行に使ってしまった。"],["Camels are often used to travel in the desert.","ラクダは砂漠を旅するのに屡々用いられている。"]]],["traveler",0,0,1,"旅行者",[["He put the traveler up for the night.","彼はその夜、旅人を泊めた。"],["The traveler stopped to ask me the way.","旅人は立ち止まって私に道を聞いた。"]]],["traveller",0,0,1,"旅行者",[]],["treasure",0,0,1,"宝物",[["Tom finally figured out where the treasure was hidden.","トムは宝物の隠し場所をついに探し当てた。"],["The treasure lay hidden for a long time.","その財宝は長い間隠されていた。"]]],["trick",0,0,1,"芸当、たくらみ、いたずら",[["Tom is too old to go trick-or-treating.","トムはお菓子をねだりに行くには大きすぎるよ。"],["You can't fool me with a trick like that.","そんな手で私の目をごまかそうとしても無駄だ。"]]],["trouble",0,0,1,"苦難、苦労の種、骨折り",[["May I trouble you to pass me the salt?","すみませんが、お塩を取っていただけますか？"],["I do not want to cause you any trouble.","あなたに迷惑をかけたくありません。"]]],["truly",0,3,1,"偽りなく",[["I have truly learned many things from Tom.","トムには本当にたくさんのことを教えてもらった。"],["I can take care of yours truly.","自分のことは自分でできる。"]]],["trust",0,1,1,"信用する、期待する、任せる",[["I had to trust the captain with my life.","私は船長に命を託さなければならなかった。"],["The only person that I trust here is Tom.","ここで信頼してるのはトムだけなんだ。"]]],["truth",0,0,1,"真実性、真理",[["I wish you had told me the truth then.","あの時本当のことを言ってくれたらよかったのに。"],["To tell you the truth, I don't love him.","実を言うとね、彼のこと好きじゃないの。"]]],["try",0,1,1,"努力する、試す、裁く",[["I try not to eat too much junk food.","ジャンクフードは食べ過ぎないようにしてるよ。"],["I'm sure you can do that if you try.","君は挑戦したら出来ると僕は確信してる。"]]],["tune",0,0,1,"曲",[["I can't remember the tune of that song.","私はあの歌のメロディーが思い出せない。"],["If it's a simple tune, I can sight-sing it.","簡単な曲なら初見で歌えます。"]]],["twice",0,3,1,"2回、2倍[に]",[["My brother eats twice as much as I do.","兄は私の２倍は食べる。"],["This watch is twice as expensive as that one.","この時計、あの時計の倍の値段なんだよ。"]]],["uncertain",0,2,1,"確信が持てない、確かでない、変わりやすい",[["It is uncertain whether he is coming or not.","彼が来るかどうかは、はっきりしない。"],["It was uncertain whether he would marry her.","彼が彼女と結婚するかどうかは確かではなかった。"]]],["uncomfortable",0,2,1,"心地よくない",[["I feel uncomfortable in this kind of situation.","こういう時って気まずいよな。"],["I felt uncomfortable and wanted to leave, but I stayed.","居心地が悪くて帰りたかったけど、そのまま残ったよ。"]]],["understand",0,1,1,"理解する、精通している",[["I don't understand why I have to do this.","なぜこれをしなければならないのかわからない。"],["I can't understand what he wants me to do.","彼が私に何をしてほしいのかわからない。"]]],["underwater",0,2,1,"水面下の、水中の、水面下に(を)、水中で(を)",[["Do you have an underwater camera?","水中カメラって、持ってる？"],["Do you have underwater photography equipment?","水中撮影機材はお持ちですか？"]]],["uneasy",0,2,1,"心の落ち着かない、落ち着きのない、ぎごちない",[["I am uneasy about the future of this country.","この国の将来が心配です。"],["I understand that you feel uneasy, but don't worry.","まあ不安だろうけど、そんな心配しなさんな。"]]],["unfair",0,2,1,"不公平な、不当な、かたよった、(商取引などが)公正でない、不正の",[["You should have refused such an unfair proposal.","そんな不当な提案は、拒否すべきだったのに。"],["I think that that's a little unfair.","それはちょっと不公平だと思うよ。"]]],["unforgettable",0,2,1,"忘れられない、いつまでも記憶に残る",[["An unforgettable event occurred.","忘れられない出来事が起こった。"],["This is the unforgettable place where we met each other for the first time.","ここは、私たちが初めて出会った忘れられない場所だ。"]]],["unfortunately",0,3,1,"不幸にも",[["Unfortunately, I don't have so much money on me.","残念ながら、あまり持ち合わせがないのです。"],["Unfortunately, I don't have any money with me today.","今日はあいにくお金を持っていない。"]]],["unhappy",0,2,1,"悲しい",[["Although I may be unhappy, I won't commit suicide.","僕は不幸かも知れないけれど自殺はしない。"],["Maybe I'm unhappy, but I don't intend to kill myself.","私は不幸かもしれないが、自殺するつもりはない。"]]],["unhealthy",0,2,1,"(人が)健康でない、病弱の;健康でないことを示す、(場所・気候などが)健康によく",[["You should give up smoking since it's unhealthy.","健康に悪いから、タバコはやめた方がいいよ。"],["She is quite pretty, but looks unhealthy.","彼女はなかなかきれいだが不健康そうだ。"]]],["uniform",0,2,1,"不変の、同一の",[["When was the last time you wore a uniform?","最後に制服を着たのって、いつ？"],["Do you have a school uniform?","制服はあるの？"]]],["uniform",0,0,1,"制服",[["We have to wear school uniforms at school.","学校では制服を着なきゃいけないの。"],["Our school did away with uniforms last year.","私たちの学校は昨年制服を廃止した。"]]],["unimportant",0,2,1,"重要でない",[]],["unit",0,0,1,"構成単位、単元、単位",[["Would you please send the remaining five units right away?","残りの５個を至急お送りください。"],["A pound is a unit of weight.","ポンドは重さの単位である。"]]],["university",0,0,1,"[総合]大学",[["I belong to a tennis club in my university.","大学ではテニスクラブに入っています。"],["His parents told him to get into a university.","彼の両親は彼に大学へ行くように言った。"]]],["unknown",0,2,1,"知られていない、未確認の",[["At present, the cause of the disease is unknown.","現在その病気の原因は不明である。"],["The cause of the fire is unknown.","火事の原因は不明である。"]]],["unlike",0,2,1,"似ていない",[["It is unlike him to be late.","遅刻するなんて彼らしくない。"],["It's unlike him to get so angry.","あんなに怒るなんて彼らしくない。"]]],["unnecessary",0,2,1,"必要のない",[["We made it cheaper by eliminating unnecessary functions.","ムダな機能を省いて安くしました。"],["It would be nice if Tom didn't keep making unnecessary remarks.","トムがまた余計なこと言わなければいいんだけど。"]]],["unpleasant",0,2,1,"不愉快な",[["This fruit has an unpleasant smell.","この果物はいやなにおいがする。"],["He is an unpleasant fellow.","彼は嫌な奴だ。"]]],["unusual",0,2,1,"普通でない",[["It's unusual for him to get up early.","彼が早起きするなんて珍しい。"],["If you ask me, she's a little unusual.","私に言わせれば、彼女は少し変わっている。"]]],["up",0,3,1,"上へ、上に、起こして",[["I made up my mind to be a doctor.","私は医者になる決心をした。"],["I make it a rule to get up early.","私は早く起きることにしている。"]]],["upon",0,4,1,"…の上に",[["Once upon a time, there lived a cruel king.","かつて残忍な王様がいた。"],["I took it upon myself to telephone the police.","私は思い切って警察に電話した。"]]],["upset",0,2,1,"ひっくり返す、だめにする",[["Don't get an upset stomach by eating too much.","食べ過ぎておなかを壊すなよ。"],["I had an upset stomach after dinner last night.","昨日、夕飯食べた後、胃の調子がおかしかったんだ。"]]],["upstairs",0,3,1,"階上へ(で)、2階へ(で)、階上の、2階の",[["Why don't you go upstairs and take a nap?","二階でお昼寝しておいで。"],["I ran upstairs two steps at a time.","一段飛ばしで階段を駆け上った。"]]],["use",0,0,1,"使用、役に立つこと",[["Is it OK if I use your car today?","今日、あなたの車使ってもいい？"],["I have a car, but I rarely use it.","車は持ってるけど、ほとんど使わないんだ。"]]],["used",0,2,1,"使い古しの",[["I'm not as rich as I used to be.","以前ほど金持ちではない。"],["I am not the person I used to be.","今の私は昔の私ではない。"]]],["useful",0,2,1,"役に立つ",[["I tried it and found it very useful.","試しに使ってみたけど、なかなか便利だ。"],["His advice would be very useful to you.","彼の忠告は君に大変役に立つだろう。"]]],["usual",0,2,1,"いつもの",[["I went to bed a little later than usual.","私はいつもより少し遅く寝た。"],["I met the usual people at the usual place.","いつもの場所で、いつものメンバーに会ってきたよ。"]]],["valley",0,0,1,"谷",[["The valley was dotted with farm houses.","谷には農家が点在していた。"],["If it snows on the mountain, it's cold in the valley.","山に雪が降ると谷は寒くなります。"]]],["value",0,0,1,"価値、価格",[["It is of great value.","それは大変価値がある。"],["The value of the coins depended on the weight of the metal used.","硬貨の価値は使われた金属の重さによって決まった。"]]],["verb",0,0,1,"動詞",[["I don't like learning irregular verbs.","不規則動詞の勉強は好きではない。"],["This verb is difficult to conjugate.","この動詞の活用は難しいです。"]]],["video game",0,0,1,"",[["I played video games after I finished my homework.","宿題を済ませてからテレビゲームをしました。"],["Whenever you visit him, you will find him playing video games.","たとえいつ訪問しても、彼はファミコンをやっているだろう。"]]],["view",0,0,1,"見ること、視界、ながめ",[["We each have our own view of the world.","人それぞれに世界観あります。"],["I now view life differently than I used to.","以前とは人生観も変わった。"]]],["village",0,0,1,"村の人々",[["In the middle of the village is a church.","村の真ん中には、教会があります。"],["It seemed that no one was in the village.","その村には誰もいないようだった。"]]],["violent",0,2,1,"激しい",[["Have you ever been the victim of a violent crime?","暴力犯罪の被害に遭ったことはありますか？"],["We have to be prepared to cope with violent storms.","激しい嵐に対処する準備をしておくべきだ。"]]],["violin",0,0,1,"バイオリン",[["How did you learn how to play the violin?","どうやってバイオリンが弾けるようになったのですか。"],["By the way, do you play the violin?","ところで、君はバイオリンを弾きますか。"]]],["visitor",0,0,1,"訪問者",[["She wrote a book about the visitors.","彼女は訪れた人々について本を書いた。"],["She's a frequent visitor to this country.","彼女はよくこの国を訪れます。"]]],["vocabulary",0,0,1,"語彙",[["You should spend a little time each day reviewing vocabulary.","毎日少しの時間を使って語彙の復習をするべきです。"],["I want to build up my vocabulary.","語彙力を増強したい。"]]],["voice",0,0,1,"声、発言権",[["He cried out for help in a loud voice.","彼は助けを求めて大声で叫んだ。"],["I don't like the sound of my own voice.","自分の声が好きじゃないのよね。"]]],["walking",0,0,1,"歩くこと、歩行、歩き方",[["Do you get short of breath easily when walking?","歩くと息切れしやすいですか？"],["I can see some people walking across the street.","何人かが通りを渡ってくるのがわかる。"]]],["wallet",0,0,1,"紙入れ",[["I have a picture of Tom in my wallet.","財布の中にトムの写真を入れてるんだ。"],["I lost my wallet on the way to school.","通学中に財布をなくしました。"]]],["wander",0,1,1,"あてもなく歩き回る、それる",[["Maybe I'll just wander off on my own.","ぶらりと一人旅でもしてくるかな。"],["I was bored, so I wandered around town.","暇だったので街をぶらぶらした。"]]],["washing machine",0,0,1,"洗濯機",[["We need to buy a new washing machine.","新しい洗濯機買わなきゃな。"],["Tell me how to use the washing machine.","洗濯機の使い方を教えてください。"]]],["washing-up",0,0,1,"食事のあと片づけ、食器洗い",[["If you cook, I'll do the washing-up.","ごはん作ってくれるんだったら、私がお皿を洗うよ。"]]],["wave",0,0,1,"波、波のような動き",[["Nothing was to be heard except the sound of the waves.","波の音の他は何一つ聞こえなかった。"],["A cold wave hit this district.","この地方を寒波が襲った。"]]],["weak",0,2,1,"弱い",[["I prepared a weak solution of sugar and water.","薄い砂糖水を作った。"],["I didn't know he had a weak heart.","私は彼が心臓が弱いとは知らなかった。"]]],["wealth",0,0,1,"富、豊富",[["Tom has great wealth, but he is not happy.","トムはお金は持っている。だがそれほど幸せというわけではない。"],["It takes luck and hard work to achieve wealth.","裕福になるためには幸運と大変な努力が必要だ。"]]],["web",0,0,1,"巣",[["That company just put up a web page.","あの会社は、ホームページを開設したばかりなんだ。"],["I'm interested in creating my own web pages.","私は自分のホームページを作ることが趣味です。"]]],["web page",0,0,1,"",[["That company just put up a web page.","あの会社は、ホームページを開設したばかりなんだ。"],["I'm interested in creating my own web pages.","私は自分のホームページを作ることが趣味です。"]]],["website",0,0,1,"",[["The website is visited over 30 million times a day.","そ e been assigned the large classroom.","私たちは大きな教室を割り当てられた。"]]],["assignment",0,0,2,"割り当てられた仕事(持ち場、任務);(学校の)宿題、(仕事などに)任命する(され",[["I have a lot of assignments to do today.","今日しなければならない宿題がたくさんある。"],["The assignment took me longer than I had expected.","その宿題は思ったより時間がかかった。"]]],["assist",0,1,2,"手伝う",[["She assisted her mother in caring for the baby.","彼女は母親が赤ん坊の世話をするのを手伝った。"],["She assisted her brother with his homework.","彼女は弟の宿題を手伝ってやった。"]]],["assistance",0,0,2,"助力",[["Can I be of any assistance to you?","何か手伝えることがありますか。"],["Call me if you need my assistance.","助けが必要だったら呼んでくれ。"]]],["assistant",0,0,2,"助手",[["Tom is my assistant.","トムは私の助手です。"],["Tom is Mary's assistant.","トムはメアリーの助手なんです。"]]],["associate",0,1,2,"仲間に加える、仲間になる",[["I have been associated with him for ten years.","私は彼と１０年間つきあっている。"],["What do you associate with summer?","夏といえば何を連想しますか。"]]],["assume",0,1,2,"当然のことと思う、引き受ける、負う",[["He assumed that the train would be on time.","電車は時間通りに来るものだと彼は考えていた。"],["Tom assumed that the train would be on time.","トムは列車が時間通りに来るものと思っていた。"]]],["astronomer",0,0,2,"天文学者",[]],["athletic",0,2,2,"運動競技の",[["The athletic meet was put off until next week.","運動会は来週まで延期された。"],["The athletic meet was postponed due to rain.","運動会は雨のため延期された。"]]],["Atlantic",0,2,2,"大西洋の",[["We flew across the Atlantic.","大西洋を飛行機で横断した。"],["The Panama Canal connects the Atlantic with the Pacific.","パナマ運河は大西洋と太平洋をつないでいる。"]]],["atmosphere",0,0,2,"大気、空気、雰囲気",[["There was a tense atmosphere in the room.","部屋には張り詰めた空気が漂っていた。"],["There is no atmosphere on the moon.","月に大気はない。"]]],["atomic",0,2,2,"原子の",[["We should never use an atomic bomb again.","私たちは原子爆弾を二度と使うべきではない。"],["We live in the atomic age.","現代は原子力の時代だ。"]]],["attach",0,1,2,"つける、取りつける",[["I forgot to attach a stamp to the envelope.","私は封筒に切手をはるのを忘れた。"],["You need to attach your photo to the application form.","あなたの写真を申込書に添付することが必要だ。"]]],["attachment",0,0,2,"(…に)付くこと、付着、付属;(…の)付属品、付属装置;留め金、締め具、(人・物",[]],["attain",0,1,2,"達成する、達する",[["I have to attain my purpose
