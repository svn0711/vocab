I will ignore it.","電話がまた鳴っても、無視するつもりだ。"],["I'm used to being ignored by my parents.","両親に相手にされないのには慣れている。"]]],["illegally",0,3,2,"",[["A lot of bicycles are illegally parked in front of the station.","駅前には多くの自転車が違法に止められています。"]]],["illness",0,0,2,"病気",[["A sudden illness forced her to cancel her appointment.","急病により、彼女は約束の取り消しを余儀なくされた。"],["Her mother is not aware of her illness.","母親は彼女の病気に気づいていない。"]]],["illuminate",0,1,2,"照らす、照明で飾る",[["The room was illuminated with red lights.","その部屋は赤い光で照らされていた。"]]],["imaginary",0,2,2,"の",[["All the characters in this book are imaginary.","この本に登場する人物は、すべて架空のものです。"],["Tom is my imaginary friend.","トムは僕のイマジナリーフレンドなんだ。"]]],["imitate",0,1,2,"見習う、まねをする、模写(模造)する",[["This bird can imitate the human voice.","この鳥は人の声を真似できるんだ。"],["A parrot can imitate human speech.","オウムは人の声を真似ることができる。"]]],["immediate",0,2,2,"即座の",[["There are no food stores in the immediate area.","この近所には食品店はない。"],["We received an immediate answer to our letter.","手紙の返事はすぐに届いた。"]]],["immediately",0,3,2,"ただちに",[["I would like you to leave immediately if possible.","できればすぐに出発してもらいたいのですが。"],["Such a proposal would only be turned down immediately.","そんな提案をしたとしてもすぐにはねつけられるだけだろう。"]]],["immigrate",0,1,2,"(外国から…へ)移住する、入植する",[]],["immigration",0,0,2,"(外国からの)移住、入植、入植者、移民国",[]],["impair",0,1,2,"を損なう、を弱める",[]],["impression",0,0,2,"印象、感銘、感じ",[["I have the impression that I already know you.","君には会ったことがある気がする。"],["I have the impression that he knows the secret.","彼がその秘密を知っているような気がする。"]]],["impressive",0,2,2,"印象的な",[["Unless it's something fairly impressive, I won't remember it.","よっぽど印象に残る事じゃないと覚えてないんだよね。"],["That's quite an impressive list.","それはとても立派なリストです。"]]],["improper",0,2,2,"ふさわしくない",[]],["improvement",0,0,2,"改良",[["Many improvements have been made since this century began.","今世紀が始まって以来、多くの進歩があった。"],["We've made numerous improvements to our house since we bought it.","家を購入してからいろいろ手直しをしてきた。"]]],["incident",0,0,2,"でき事",[["We must not make too much of this incident.","この事件を過大視してはならない。"],["The old man told us about the amusing incident.","老人は我々にその愉快な事件について話した。"]]],["including",0,4,2,"…を含んで、入れて",[["How much is it including insurance and tax?","保険、税金を含めて、合計金額はいくらになりますか。"],["Everyone laughed, including Tom.","トムを含め、みんなが笑った。"]]],["income",0,0,2,"収入",[["I can't get by on such a small income.","こんなわずかな収入ではとてもやっていけない。"],["She was used to living on a small income.","彼女は少ない収入で暮らすことに慣れていた。"]]],["inconvenient",0,2,2,"不便な",[]],["incorrect",0,2,2,"不正確な",[["Both of the answers are incorrect.","その答えはどちらも正しくありません。"],["Cross out the incorrect words.","間違っている単語を、線で消しなさい。"]]],["increase",0,0,2,"増加",[["This is a great opportunity to increase our market share.","これは、市場シェアを拡大するすばらしいチャンスです。"],["There was a steady increase in population.","人口はどんどん増加していた。"]]],["increasingly",0,3,2,"ますます、だんだん(more and more)",[["Modern finance is becoming increasingly complicated and sophisticated.","現代の金融は一段と複雑かつ高度になってきている。"]]],["incredible",0,2,2,"信じられない",[["At this hour, there is incredible traffic.","この時間帯は交通量が非常に多い。"],["Tom is an incredible athlete.","トムは信じられないほどのアスリートだ。"]]],["incredibly",0,3,2,"信じられないほど",[["Tom is incredibly bad at drawing.","トムはびっくりするくらいに絵が下手だ。"],["That was an incredibly difficult exam.","すごい難しい試験でした。"]]],["indefinite article",0,0,2,"不定冠詞(a、 an)",[]],["independent",0,2,2,"頼らない、関係(関連)がない",[["I advised him to be independent of his parents.","私は彼に、親に頼らないように忠告した。"],["I want to be more independent.","私はもっと自立したいと思っている。"]]],["indirect",0,2,2,"真っすぐでない、間接的な",[]],["indirectly",0,3,2,"間接に、遠回しに",[]],["individual",0,2,2,"個々の、個人的な、独特の",[]],["indoors",0,3,2,"室内に、で、屋内に",[["It was raining hard, so we played indoors.","雨がひどく降ってきた、それで私たちは屋内で遊んだ。"],["The best bet on a rainy day is to remain indoors.","雨の日は外に出ないに限る。"]]],["industrial",0,2,2,"の",[["It's an industrial city.","工業都市です。"],["Industrial areas tend to be on the outskirts of cities.","工業地帯は、往々にして都市郊外にあります。"]]],["industry",0,0,2,"産業",[["What is the main industry in this town?","この町の主な産業は何ですか。"],["Detroit is famous for its car industry.","デトロイトは自動車産業で有名だ。"]]],["inevitable",0,2,2,"避けがたい",[["It was inevitable that they would meet.","彼らが会うことは避けられなかった。"],["As a matter of fact, bankruptcy is inevitable.","実際のところ、倒産は避けられない。"]]],["infection",0,0,2,"(病気の)伝染;感染、伝染病",[["Do you have a history of ear infections?","中耳炎になったことはありますか？"],["I think I have a gum infection.","歯茎が炎症を起こしているようなのですが。"]]],["infinitive",0,0,2,"不定詞",[]],["inform",0,1,2,"知らせる",[["He informed me about the changes in the plan.","彼は私に計画の変更を知らせてきた。"],["Please inform me of any change in his condition.","彼の容態が少しでも変わったら知らせてください。"]]],["informative",0,2,2,"知識(情報)を与える、有益な",[]],["ingredient",0,0,2,"(混合物の)成分、原料、構成要素",[["Tom makes his bread with only 3 ingredients: flour, water and salt.","トムは、３つの材料（小麦粉・水・塩）だけでパンを作ります。"],["Add the rest of the ingredients.","残りの材料を加えてください。"]]],["inhabitant",0,0,2,"住人",[["More than 70 percent of the inhabitants are in favor of the program.","住民の７０パーセント以上がその計画に賛成しています。"],["The inhabitants of the island are friendly.","その島の住民は友好的だ。"]]],["inhale",0,1,2,"を吸い込む、息(たばこの煙)を吸い込む",[["Stop inhaling your food. You should eat more slowly.","そんなガツガツ食べないで、もうちょっとゆっくり食べようよ。"]]],["initial",0,0,2,"かしら文字",[["Your initial order is subject to a special discount of 5%.","初めてのご注文の場合には、５％の特別値引きをいたします。"],["The couple carved their initials in an oak tree.","恋人たちは自分たちの頭文字をかしの木に刻んだ。"]]],["initially",0,3,2,"",[["How did you meet Tom initially?","トムとはどうやって知り合ったの？"]]],["inject",0,1,2,"(…に)を注射する、注入する;(…を)…に注射する、(話などに)…を導入する、さ",[]],["injury",0,0,2,"負傷、損害",[["He suffered internal injuries in the car accident.","彼は交通事故で内臓にけがをした。"],["I stretch before exercising to prevent injury.","怪我を防ぐために、運動前にはストレッチをしています。"]]],["ink",0,0,2,"インク",[["I need some paper, pencils, ink and so on.","紙・鉛筆・インクとか要るんですが。"],["Do I have to write in ink?","インクで書かなければだめですか。"]]],["innermost",0,2,2,"いちばん奥の、最も深い、心の奥底の",[]],["innocent",0,2,2,"無罪の",[["At first, they were all convinced he was innocent.","最初に、彼らは彼が無罪であることを確信していた。"],["I bet my bottom dollar he is innocent.","１００パーあいつは無実だよ。"]]],["innovator",0,0,2,"革新者",[]],["inquiry",0,0,2,"質問、調査",[["Thank you for your inquiry.","お問い合わせいただきありがとうございます。"],["For further inquiries, please feel free to contact us toll-free at 0120-00-0000.","さらに質問がございましたら、どうぞご遠慮なくフリーダイヤル０１２０—００—００００までお電話下さい。"]]],["insane",0,2,2,"狂気の、正気でない、精神異常者のための",[["He behaves as if he were insane.","彼はまるで狂っているかのように振舞っている。"],["The man must be insane.","その男は頭がおかしいに違いない。"]]],["inscribe",0,1,2,"(物・心などに)を記す、彫る、刻む、書く、(言葉・文字などを)に記す、彫る、刻む",[]],["inscription",0,0,2,"銘、碑文",[]],["insight",0,0,2,"洞察[力]",[]],["insist",0,1,2,"強く要求する、主張する",[["She insisted that he should go to the hospital.","彼女は、彼は病院に行くべきだと言い張った。"],["My father insisted on our waiting for the train.","父は皆で電車を待とうといった。"]]],["inspection",0,0,2,"検査、点検;視察",[["We conduct safety inspections here on a regular basis.","ここでは定期的に安全点検を実施します。"],["I hope this makes it through baggage inspection.","荷物検査で引っかからなければいいけど。"]]],["inspire",0,1,2,"鼓舞する、呼び起こす",[["What inspired you to write this song?","この曲を書こうと思ったきっかけは何だったの？"],["His speech inspired all the boys.","彼の話は少年たちみんなを元気づけた。"]]],["instal",0,1,2,"",[["I installed a new program on my computer yesterday.","昨日ね、パソコンに新しいプログラムをインストールしたんだ。"],["What kind of equipment is installed in the classrooms?","教室にはどんな備品が取り付けられたのですか。"]]],["install",0,1,2,"取り付ける、就任させる",[["I installed a new program on my computer yesterday.","昨日ね、パソコンに新しいプログラムをインストールしたんだ。"],["What kind of equipment is installed in the classrooms?","教室にはどんな備品が取り付けられたのですか。"]]],["instance",0,0,2,"例",[]],["instead of",1,4,2,"",[["I would like you to go instead of me.","私の代わりに行ってもらいたいのですが。"],["Tom puts honey in his tea instead of sugar.","トムは、砂糖のかわりにハチミツを紅茶にいれます。"]]],["institute",0,0,2,"教育、学術、機関",[["The research institute was established in the late 1960s.","その研究所が設立されたのは１９６０年代後半です。"]]],["instruction",0,0,2,"教育、命令",[["All you have to do is follow the instructions.","君は指示に従ってさえいればいいのです。"],["You can't go wrong if you read the instructions carefully.","指示を注意深く読めば、間違うことはありません。"]]],["instructor",0,0,2,"教師、指導者、(大学の)専任講師(assistant professorの下位の",[["My driving instructor says I should be more patient.","教習所の教師にそう焦るなと言われています。"],["Tom is a ski instructor, isn't he?","トムってスキーのインストラクターなんだよね？"]]],["insurance",0,0,2,"保険、 保険契約、保険金、 保険料",[["He took a job with an insurance company.","彼は保険会社に就職した。"],["How much is it including insurance and tax?","保険、税金を含めて、合計金額はいくらになりますか。"]]],["intend",0,1,2,"意図する",[["I had intended to go, but I forgot to.","行くつもりだったのに、忘れてたんだ。"],["I intend to stay at a five-star hotel.","５つ星ホテルに泊まるつもりなんだ。"]]],["intense",0,2,2,"激しい",[["There was an intense pain in my head.","頭に激しい痛みがあった。"],["He had an intense hatred of his teacher.","彼は先生に対して激しい憎悪を抱いていた。"]]],["intensive",0,2,2,"集中的な",[]],["intention",0,0,2,"意図",[["I have absolutely no intention of paying ten dollars.","１０ドルを払うつもりは全くない。"],["I have no intention of asking him.","あの人に頼む気はないよ。"]]],["intentionally",0,3,2,"",[["Are you saying you intentionally hide your good looks?","自分のかっこ良さをわざと隠すということ？"],["Are you intentionally trying to confuse me?","わざと私を混乱させようとしてるの？"]]],["interact",0,1,2,"(…と)相互に作用する、影響し合う",[["Tom seems to be unable to interact normally with other people.","トムは、他の人と普通に付き合うことができないようです。"]]],["interaction",0,0,2,"(…との)相互作用",[["Tom has trouble with social interactions.","トムは社会的交流が苦手だ。"],["It's the dynamic interaction between the characters that makes this novel so great.","登場人物の躍動的な関わり合いこそがこの小説をかくも偉大なものとしている。"]]],["interest",0,1,2,"興味を持たせる",[["I am interested in getting a hat like this.","ぼくはこういう帽子が買いたいなと思っています。"],["I am not as interested in literature as you.","私は君ほど文学に興味はない。"]]],["intermediate",0,2,2,"(程度・距離・時間などにおいて)中間の、中間にある(起こる)",[]],["intermission",0,0,2,"(でき事・活動などの)合い間、活動停止期間、(演劇・映画・音楽会などの)休憩時間",[["When is the intermission?","休憩はいつごろですか。"]]],["internal",0,2,2,"内側の、国内の",[["The stomach is one of the internal organs.","胃は内臓の一つである。"],["He suffered internal injuries in the car accident.","彼は交通事故で内臓にけがをした。"]]],["internationally",0,3,2,"",[]],["interrupt",0,1,2,"さえぎる、中断する、じゃまする",[["I was annoyed with him for interrupting me.","彼がわたしの邪魔をするのでイライラした。"],["Forgive me for interrupting you the other day.","先日はお邪魔しました。"]]],["interval",0,0,2,"合い間",[["Buses are running at 20-minute intervals.","バスは２０分間隔で運行されている。"]]],["interview",0,1,2,"会見",[["The interview is scheduled for 10:00 a.m. tomorrow.","インタビューはあす朝10時からの予定です。"],["Were you nervous during the job interview?","就職面接のとき、緊張した？"]]],["interviewee",0,0,2,"",[]],["introduction",0,0,2,"紹介すること、序論",[["I skipped the introduction.","イントロは飛ばした。"]]],["invasion",0,0,2,"(敵軍の)侵入、侵略、(人・物の)殺到;(災害などの)襲来",[]],["invest",0,1,2,"投資する",[["The government should invest more money in agriculture.","政府は農業にもっと投資するべきだ。"],["He invested his money in stocks.","彼は自分のお金を株に投資した。"]]],["investigation",0,0,2,"調査",[["We conducted our investigation with the greatest care.","私たちはきわめて慎重に調査を行なった。"],["The investigation may take several months.","調査には数ヶ月かかるかもしれません。"]]],["invitation",0,0,2,"招待状",[["She accepted my invitation to have dinner with me.","彼女は夕食を一緒にという私の招待を受け入れてくれた。"],["I had to decline the invitation because I was sick.","体調不良だったため、招待は断らざるを得なかった。"]]],["involuntarily",0,3,2,"いやいやながら;無意識に",[]],["involve",0,1,2,"伴う、巻き込む",[["I don't want to be involved in that matter.","その件には関わりたくないんだ。"],["I don't want to get involved in that business.","そんなことに係わり合いたくない。"]]],["involved",0,2,2,"(思想・議論などが)複雑な、(文章・事態などが)込み入った、関係がある;(…と)",[["I don't want to be involved in that matter.","その件には関わりたくないんだ。"],["I don't want to get involved in that business.","そんなことに係わり合いたくない。"]]],["iron",0,0,2,"鉄、アイロン",[["I burned my fingers on a hot iron.","アイロンで指をやけどしちゃったんだ。"],["I burned my hand with an iron.","アイロンで手をやけどしました。"]]],["iron",0,1,2,"鉄、アイロン",[["I have to iron my shirt.","シャツにアイロンをかけなければなりません。"],["I need to iron this shirt.","このシャツにアイロンをかけないとなぁ。"]]],["ironing",0,0,2,"アイロンかけ、アイロンかけをした(をする)衣類",[["She was ironing her dress.","彼女は服にアイロンをかけてたよ。"],["Tom is ironing his shirts.","トムはシャツにアイロンをかけている。"]]],["irregular",0,2,2,"不規則な",[["The surface of the moon is irregular.","月の表面はでこぼこだ。"],["I don't like learning irregular verbs.","不規則動詞の勉強は好きではない。"]]],["irritate",0,1,2,"怒らせる、いらだたせる",[["I wonder if Tom is irritated.","トムってイラついてるのかな。"],["He was irritated by the sound.","彼はその音にいらいらしていた。"]]],["isle",0,0,2,"島(island)",[]],["isolation",0,0,2,"孤立;隔離、分離",[]],["ivory",0,0,2,"象牙",[]],["jade",0,0,2,"やせ馬・駄馬・女・…を疲れ果てさせる・疲れ果てる、玉(ぎょく)、ひすい",[]],["jail",0,0,2,"刑務所、牢獄、拘置所、入獄、拘置",[["I don't want to end up in jail.","刑務所には行きたくない。"],["Is it true that Tom is in jail?","トムが刑務所に入ってるって、本当なの？"]]],["jar",0,0,2,"つぼ",[["There are some cookies in the jar.","瓶の中にいくつかクッキーが入っている。"],["I wanted some salt, but there was none in the jar.","塩が欲しかったが、ビンの中には少しもなかった。"]]],["jazz",0,0,2,"ジャズ",[["I can't figure out why you don't like jazz.","きみがなぜジャズを嫌いか私にはわからない。"],["He knows everything that there is to know about jazz.","彼はジャズについて知らなけばならないことは全部知っている。"]]],["jealous",0,2,2,"しっと深い",[["She was jealous when he talked to another girl.","彼女は彼が他の女の子に話し掛けると嫉妬した。"],["I'm jealous that you have a good boss.","いい上司で羨ましいですね。"]]],["jewel",0,0,2,"宝石",[["The stolen jewels must be recovered at any cost.","盗まれた宝石はどんなことがあっても取り戻さなければならない。"],["She was robbed of her jewels last night.","彼女は昨夜、宝石を盗まれた。"]]],["jog",0,1,2,"…を軽く揺り動かす;…をちょっと押す(突く)、を呼び起こす、刺激する",[["I make it a rule to jog every morning.","私は毎朝走ることにしている。"],["I got warm from jogging for an hour.","１時間ジョギングしたら体が温かくなった。"]]],["jogging",0,0,2,"ジョギング(健康法としての軽いランニング)",[["I got warm from jogging for an hour.","１時間ジョギングしたら体が温かくなった。"],["Tom goes jogging in the park every morning.","トムは毎朝公園でジョギングをしている。"]]],["joint",0,2,2,"共同の",[["My husband and I have a joint bank account.","夫と私は共同の銀行口座を持っています。"],["They agreed on a joint statement.","彼らは共同声明に同意した。"]]],["joke",0,1,2,"冗談、笑い話",[["I told you that was just a joke.","あれは冗談だって言ったじゃん。"],["Sorry, I only meant it as a joke.","ごめん、軽い冗談のつもりだったんだけど。"]]],["journal",0,0,2,"日誌、新聞",[["Do you keep a journal?","日記をつけてるの？"],["Don't read my journal.","私の日記を読まないで。"]]],["journalist",0,0,2,"ジャーナリスト",[["I've made up my mind to become a journalist.","私はジャーナリストにな 私は人前で笑われるのが我慢できない。"]]],["public transport",0,0,2,"",[]],["publicly",0,3,2,"公に、公然と;おおっぴらに、公的に、公衆によって",[]],["publisher",0,0,2,"(書籍などの)出版業者、出版社;新聞発行者",[]],["pullover",0,0,2,"プルオーバー(頭からかぶるセーターなど)",[]],["pump",0,0,2,"ポンプ",[["The function of the heart is to pump blood.","心臓の働きは血液を送り出す事である。"],["The pump didn't work properly.","ポンプはちゃんと動かなかった。"]]],["punish",0,1,2,"罰する",[["Tom was punished because he didn't tell the truth.","トムは真実を話さなかったから、罰せられました。"],["The teacher punished her students for using bad words.","その教師は悪い言葉を使ったことで生徒たちを罰した。"]]],["punishment",0,0,2,"罰を[を受けること]、処罰、刑罰",[["He deserves the punishment.","彼はその罰を受けるに値する。"],["I'm firmly opposed to corporal punishment.","私は体罰には断固反対です。"]]],["pupil",0,0,2,"生徒",[["The teacher handles his pupils well.","あの先生は生徒の扱い方がうまい。"]]],["puppy",0,0,2,"子犬",[["I had a puppy when I was a boy.","子供の頃、小犬を飼っていた。"],["I've had this dog since he was a puppy.","僕はこの犬が子犬のころから飼っている。"]]],["pure",0,2,2,"混じりけのない、汚れていない",[["The air is pure around here.","この辺りは空気がきれいだよ。"],["These days, the motives for marriage are not necessarily pure.","近頃では、結婚の動機は必ずしも純粋とは限らない。"]]],["purify",0,1,2,"(…を除いて)…を清める、きれいにする、浄化する;(…から)…を除いてきれいにす",[]],["purse",0,0,2,"ハンドバッグ、さいふ",[["I lost my purse on my way to school.","学校に行く途中で財布を無くしたの。"],["I must have lost my purse in the supermarket.","スーパーで財布を無くしたに違いない。"]]],["push",0,0,2,"押す",[["We had to push our way through the crowd.","混んでいたので人をかき分けて行かねばならなかった。"],["If you push the button, the door will open.","ボタンを押せばドアが開きます。"]]],["puzzle",0,0,2,"悩ませる物、事、人",[["I can't figure out how to solve the puzzle.","そのパズルの解き方がわからないんだ。"],["This puzzle is too hard for me.","このパズルは私には難しすぎるわ。"]]],["quake",0,0,2,"(衝突・地震などで)揺れる、震動する(shake)、(寒気・憎しみ・恐怖などで)",[]],["qualified",0,2,2,"資格のある、適任の、制限された、条件付きの",[["He is not qualified for the job.","彼はそのポストの資格を満たしていない。"],["She is qualified as a nurse.","彼女は看護婦の資格を持っている。"]]],["qualify",0,1,2,"資格を与える、資格を得る",[["He is not qualified for the job.","彼はそのポストの資格を満たしていない。"],["She is qualified as a nurse.","彼女は看護婦の資格を持っている。"]]], ainforests are destroyed.","毎年、２７００万エーカーの熱帯雨林が破壊されているのである。"]]],["rank",0,0,2,"階級、順位、列",[["Apes rank above dogs in intelligence.","類人猿は知的には犬より上位である。"]]],["rap",0,1,2,"コツン、トン",[["He gave a rap on the door.","彼は戸をトントンとたたいた。"]]],["rapid",0,2,2,"速い、すばやい",[["The rapid growth of the city surprised us.","その街の急成長ぶりには驚かされた。"],["The progress of civilization is very rapid.","文明の進歩がとても速い。"]]],["rapidly",0,3,2,"速く、すみやかに",[["Airplanes enable people to travel great distances rapidly.","飛行機のおかげで、人は早く、長い距離を旅行できる。"],["I felt my heart beating rapidly.","心臓が速く鼓動しているのを感じた。"]]],["rare",0,2,2,"まれな、珍しい",[["How did you come by these rare books?","こんな貴重な本、どうやって手に入れたんですか？"],["How did you come by those rare books?","この珍しい本をどうやって手に入れたの？"]]],["rarely",0,3,2,"めったに、まれにしか、しない",[["I have a car, but I rarely use it.","車は持ってるけど、ほとんど使わないんだ。"],["My father rarely, if ever, goes out on Sundays.","父が日曜に外出することはまずない。"]]],["raspberry",0,0,2,"キイチゴ[の実]、唇の間で舌を鳴らすあざけりの音",[["Raspberries are expensive in the winter.","ラズベリーは冬場は値段が高いんだ。"],["Raspberries are very expensive.","ラズベリーって、すごく値が張るんだよ。"]]],["ration",0,0,2,"配給量",[]],["rational",0,2,2,"理性的な",[["Although the arguments were rational, he was not convinced.","理論は理にかなっていたけれども、彼は納得しなかった。"],["His argument was far from rational.","彼の議論はちっとも合理的ではなかった。"]]],["razor",0,0,2,"かみそり",[["I bought a new razor.","新しいカミソリを買ったよ。"],["I should've tried out this electric razor before buying it.","この電気かみそりは買う前に試してみるべきだった。"]]],["reach",0,0,2,"手を伸ばすこと",[["I like to have my dictionary within easy reach.","辞書は手元に置いておきたいんだ。"],["Can you reach the box on that shelf?","棚の上の箱に手が届きますか。"]]],["react",0,1,2,"反応する",[["The audience reacted in different ways to her performance.","観客は彼女の演奏にさまざまな反応を示した。"],["How did he react to the bad news?","彼はその悪い知らせにどんな反応を示しましたか。"]]],["realistic",0,2,2,"現実主義の",[["It's a more realistic plan.","より現実的な計画ですよ。"],["I'm a realistic person.","私は現実的な人間だ。"]]],["reality",0,0,2,"現実[性]、実在、(個々の)現実、事実、現物",[["It is not always easy to face reality.","現実に直面することは必ずしも簡単ではない。"],["His dre iable at all.","天気予報はまったく当てにならない。"]]],["religion",0,0,2,"宗教、信仰、宗旨",[["The two regions differ in religion and culture.","両地域は宗教と文化が違っている。"],["Some people don't believe in any religion.","宗教を信じない人もいます。"]]],["religious",0,2,2,"宗教の、信仰の厚い",[["He has engaged in religious activity since then.","彼はそれ以来宗教活動に携わっている。"],["My father was religious and he was a very moral man.","私の父は信仰深くて、とても道徳的な人だった。"]]],["rely",0,1,2,"あてにする",[["Tom is a man that you can rely on.","トムは信頼できる男だ。"],["She relied on the medicine as a last resort.","彼女は最後の手段としてその薬に頼った。"]]],["remainder",0,0,2,"残り、残りの人(物)、(引き算の)残り;(割り算の)余り",[]],["remark",0,1,2,"言う、気付く",[["His remark has nothing to do with the subject.","彼の発言はそのテーマとは何の関係もない。"],["That's an interesting remark, but it's beside the point.","興味深い発言ですが、それは別問題です。"]]],["remarkable",0,2,2,"注目すべき、目につく",[["In recent years, science has made remarkable progress.","近年科学は目覚しく進歩した。"],["The recent advances in medicine are remarkable.","近年における医学の進歩はめざましい。"]]],["remedy",0,0,2,"治療薬、治療法",[["Hot lemon with honey is a good remedy for colds.","かぜの治療には蜂蜜入りのホットレモンがよく効く。"],["We have yet to discover an effective remedy for cancer.","癌の効果的な治療法はまだ発見されていない。"]]],["remembrance",0,0,2,"思い出、記憶、記念品",[]],["remote control",0,0,2,"遠隔操作、リモコン(リモートコントロール)、リモコンの",[["There is a TV remote control under the couch.","テレビのリモコンがソファーの下にある。"],["I quickly picked up the remote control.","ぱっとリモコンを手に取った。"]]],["remove",0,1,2,"取り去る、移す",[["I have had a corn removed from my foot.","足の魚の目を取ってもらいました。"],["She removed her hat when she entered the room.","彼女は部屋へ入るとき帽子を取った。"]]],["renew",0,1,2,"新しくする、再び始める",[["I have to renew my passport.","パスポートを更新しないといけないんです。"]]],["repay",0,1,2,"返す、報いる",[["You must repay your debts.","借りたお金は返さなきゃいけないでしょ。"]]],["repeatedly",0,3,2,"繰り返して、再三再四",[["Tom kicked Mary repeatedly.","トムはメアリーを何度も蹴った。"]]],["reply",0,1,2,"答える、応じる",[["I'm sorry that I didn't reply to you sooner.","もっと早くに返事を出さなくてごめんなさい。"],["I would appreciate a reply as soon as possible.","なるべく早くご返事いただければ幸いです。"]]],["report",0,1,2,"報告 ["Let me borrow your phone for a second.","ちょっと電話貸して。"],["My grandfather died in the Second World War.","私の祖父は、第二次世界大戦で亡くなりました。"]]],["secondary school",0,0,2,"中等学校",[]],["second-hand",0,2,2,"中古の",[["Tom bought a second-hand truck.","トムは中古のトラックを買いました。"],["It is better to have old second-hand diamonds than none at all.","古い中古のダイヤモンドでもないよりはましよ。"]]],["second-hand",0,3,2,"中古の",[["Tom's work is selling second-hand cars.","トムの仕事は中古車の販売です。"],["Tom bought a second-hand truck.","トムは中古のトラックを買いました。"]]],["secret",0,2,2,"秘密の",[["Tom didn't know that he had a secret admirer.","トムは自分に隠れファンがいることを知らなかった。"],["This is a secret, so please don't tell anyone.","秘密だから、誰にも言わないでね。"]]],["secretly",0,3,2,"内密に、こっそり(in secrecy)",[["I think Tom and Mary are secretly married.","トムとメアリーはひそかに結婚していると思う。"],["He secretly showed me her photo.","彼は僕に彼女の写真をこっそり見せてくれた。"]]],["secure",0,2,2,"安全な",[["Please secure your seat belt during takeoff and landing.","離着陸の際にはシートベルトをしめて下さい。"],["It is necessary to secure financing for local road maintenance.","地方の道路整備のための財源確保が必要です。"]]],["security",0,0,2,"安全、安心",[["I work as a security guard at a museum.","博物館の警備員として働いています。"],["If you want security in your old age, begin saving now.","老後を安心して暮らしたかったら今から貯蓄を始めなさい。"]]],["seize",0,1,2,"ぐいとつかむ",[["The boy seized the ladder, and began to climb.","少年ははしごをつかみ、登りはじめた。"],["I seized the cat by the neck.","私は猫の首筋をつかんだ。"]]],["select",0,2,2,"えり抜きの、品質の良い",[]],["selection",0,0,2,"選ぶこと、選び抜かれた人、物",[]],["selfish",0,2,2,"利己的な",[["They have a less selfish reason for trying it.","彼らがそうしようとするのは単にわがままからではない。"],["A selfish man thinks of nothing but his own feelings.","利己的な人は自分の感情しか考えない。"]]],["self-service",0,2,2,"(食堂・エレベーターなどでの)セルフサービス、セルフサービス[式]の = sel",[["A cafeteria is a self-service style restaurant.","カフェテリアは料理を自分で取るセルフサービスのレストランです。"],["The cafeteria was self-service.","食堂はセルフサービスでした。"]]],["sensation",0,0,2,"感覚",[["I felt a burning sensation all over.","全身が焼き尽くされるような感じがした。"],["The news of the fire in the factory caused a sensation.","工場の火事のニュースで大騒ぎになった。"]]],["separation",0,0,2,"分離",[]],["sequence",0,0,2,"連続、順序",[]],["series",0,0,2,"連続",[["His life was a long series of failures.","彼の生涯は長い失敗の連続だった。"],["They gave a series of concerts.","彼らは一連の音楽会を開催した。"]]],["serious",0,2,2,"まじめな、本気の、重大な",[["She always has a serious look on her face.","彼女はいつも真剣な表情をしている。"],["The fire was put out before it got serious.","火事は大事に至らず鎮火した。"]]],["server",0,0,2,"仕える人、奉仕者;給仕人;(ミサで司祭を助ける)侍者、(テニスなどの)サーブをす",[["I can't check my mail. The server is down.","サーバーがダウンしてて、メールチェックできない。"],["Connection to the server failed. Please check your network settings.","サーバーへの接続に失敗しました。ネットワーク設定を確認してください。"]]],["service",0,0,2,"奉仕、公共事業、サービス",[["The number you have called is not in service.","おかけになった電話番号は現在使われておりません。"],["There is no bus service after nine-thirty.","９時半をすぎるとバスが無くなる。"]]],["service",0,1,2,"奉仕、公共事業",[["The number you have called isn't in service.","おかけになった電話番号は現在使われておりません。"],["A cafeteria is a self-service style restaurant.","カフェテリアは料理を自分で取るセルフサービスのレストランです。"]]],["session",0,0,2,"会議、会期",[["They held a special session on trade problems.","彼等は貿易問題について臨時の会合を開いた。"],["The training session is scheduled to begin at 4 p.m.","研修会は午後4時開始予定です。"]]],["setting",0,0,2,"(宝石などの)はめこみ台、(劇・文学作品の)背景・舞台",[["You can see the sun setting from the window.","窓から日が沈むのを見ることができるだろう。"],["We watched the sun setting behind the mountains.","我々は太陽が山の後ろに沈むのを眺めた。"]]],["settle",0,1,2,"決定する、安定させる、静める",[["It's high time you got married and settled down.","もう身を固めて落ち着いてもいいころだよ。"],["It's about time you settled down for good.","もうそろそろ腰を落ち着けてもいいんじゃないの。"]]],["settlement",0,0,2,"解決",[["The two countries will negotiate a settlement to the crisis.","両国は危機解決に向けて交渉をするでしょう。"]]],["settler",0,0,2,"移民、植民者、開拓者",[]],["severe",0,2,2,"厳しい、重い",[["A severe shortage of workers was the cause of the accident.","事故の背景には、深刻な人手不足がある。"],["I have a severe pain here.","ここがすごく痛いんです。"]]],["severely",0,3,2,"厳しく",[["The severely injured man was dead on arrival at the hospital.","重傷を負った男性は病院に着いた時既に亡くなっていた。"],["They demanded a treaty that would punish Germany severely.","彼らはドイツを厳しく罰する条約を要求した。"]]],["sex",0,0,2,"性、男性、女性",[]],["shadow",0,1,2,"影",[["Tom thinks he's being shadowed by a private detective.","トムは探偵に尾行されていると思っている。"],["The detective shadowed the suspect for four blocks.","その刑事は容疑者を4ブロックに渡って尾行した。"]]],["shadowy",0,2,2,"陰になった、影を生ずる、影のような、ぼんやりとした",[]],["shake",0,1,2,"振り落とす、震動される、震える",[["He reached across the table and shook my hand.","彼はテーブル越しに手を差し出し、私と握手をした。"],["They shook hands when they met at the airport.","空港で会うと彼らは握手をした。"]]],["shallow",0,2,2,"浅い、浅薄な",[["This part of the lake is very shallow.","湖のこの部分なんだけど、とっても浅いんだ。"],["The pond is too shallow for swimming.","その池は泳ぐには浅すぎる。"]]],["shame",0,0,2,"恥ずかしさ、恥、恥になる人",[["A man away from home need feel no shame.","旅の恥はかきすて。"],["It's a shame the way old people are treated.","お年よりへのその対応はひどい。"]]],["shameful",0,2,2,"恥ずべき",[]],["shape",0,1,2,"形を作る",[["What do you do to stay in shape?","健康のためにしていることは何ですか？"],["I don't like the shape of this hat.","この帽子の形は好きじゃないんだ。"]]],["sharp",0,2,2,"鋭い、急な、厳しい",[["Suddenly, I felt a sharp pain in my stomach.","突如、胃に激痛が走った。"],["I have a sharp pain in my chest.","胸がひどく痛みます。"]]],["shave",0,1,2,"そる、ひげをそる",[["Can you remember the summer Tom shaved his head?","トムが頭を剃って丸坊主になった夏のことまだ覚えてる？"],["Tom shaves only about three times a week.","トムは大体週に３回しか、ヒゲをそらないんだよ。"]]],["sheer",0,2,2,"透けるほど薄い、垂直に近い",[]],["sheet",0,0,2,"敷布、1枚、一面の広がり",[["My mother put clean sheets on my bed.","母さんが、僕のベッドにきれいなシーツをかけてくれた。"],["My mother put clean sheets on the bed.","母はベッドに綺麗なシーツを敷いた。"]]],["shelter",0,0,2,"保護、避難所",[["We took shelter from the rain under a tree.","私たちは木の下で雨宿りをした。"],["I had to take shelter under a tree.","私は木の下に避難しなければならなかった。"]]],["sheriff",0,0,2,"長官、保安官",[["The sheriff beat the suspect until he was almost dead.","保安官は容疑者を相手が死んでしまうのではないかと思われるまで何回も殴りつけた。"]]],["shift",0,1,2,"移し替える、変わる",[["Starting next week, I'll be on the late shift.","来週から遅番勤務になったよ。"],["Tom works the night shift.","トムは夜勤で働いている。"]]],["shiny",0,2,2,"光る、輝く、光沢のある、(服が)着古して光る",[["The car is waxed and shiny.","その車はワックスがかけられてピカピカしている。"],["The tiles are shiny.","タイルはぴかぴか。"]]],["ship",0,1,2,"船で送る、送る",[["Three ships were given to him by the queen.","３隻の船が女王から彼に与えられた。"],["I can see a ship in the distance.","ずっと遠くに船が見える。"]]],["shiver",0,1,2,"震える",[["It was so cold that he was shivering.","とても寒かったので彼は震えていた。"],["The poor boys were shivering with fear.","かわいそうなその少年達は、恐ろしさに震えていた。"]]],["shocked",0,2,2,"",[["We were shocked at the news of his death.","我々は彼の死亡のニュースにショックを受けた。"],["Tom was shocked to hear that Mary had died.","トムはマリアが死んだと聞いてショックを受けた。"]]],["shocking",0,2,2,"びっくりさせる、ぞっとする、全くひどい(very bad)、不愉快な(offen",[["What Tom found was shocking.","トムが見つけたものは衝撃的だった。"]]],["shop",0,1,2,"買物をする",[["That is the shop where I used to work.","あれは私が昔働いていた店だ。"],["It's the only one there is in the shop.","店にあるのは、これ一つだけです。"]]],["shopper",0,0,2,"買物客",[["The store was crowded with holiday shoppers.","その店は休日の買い物客で混み合っていた。"],["The shoppers stood in a line.","買い物客たちは一列に並んでいた。"]]],["shortage",0,0,2,"不足",[["A severe shortage of workers was the cause of the accident.","事故の背景には、深刻な人手不足がある。"],["The serious job shortage is also affecting those illegal foreign workers.","深刻な就職難のしわ寄せが、そういった不法就労の外国人労働者にまで及んでいる。"]]],["shortly",0,3,2,"まもなく、手短に",[["My grandfather died shortly after my birth.","祖父は私の生後間もない頃に亡くなった。"],["The radio station came back on the air shortly after the storm.","嵐の後すぐ、そのラジオ局は放送を再開した。"]]],["shout",0,1,2,"叫ぶ、大声を出す",[["Don't shout like that. I can hear you perfectly.","そんなに叫ばなくても聞こえます。"],["He shouted at the top of his voice.","彼は声の限りに叫んだ。"]]],["shrimp",0,0,2,"(食用の)小エビ、ちび、子供;取るに足りない人",[["My cat loves shrimp.","私の猫、エビが大好きなの。"]]],["shut",0,2,2,"閉める、閉じる",[["Tom, could you shut up for just ten seconds?","トム、10秒でいいから黙っててくれない？"],["I shut the window to keep the mosquitoes out.","私は蚊を入れないよう窓を閉めた。"]]],["sickness",0,0,2,"病気でいること、病気",[["She was absent from school because of sickness.","彼女は病気のために学校を休んだ。"],["They said he was still weak from a recent sickness.","彼は病み上がりで弱っているそうだ。"]]],["sidewalk",0,0,2,"歩道",[["The flower pot crashed to the sidewalk.","植木鉢が歩道に落ちて、ガチャンと割れた。"],["I slipped and fell on the icy sidewalk.","凍ってる歩道で滑って転んだんだよ。"]]],["sigh",0,0,2,"ため息",[["Tom let out a big sigh.","トムは大きなため息をついた。"],["The old woman smiled with a sigh of relief.","老婆はほっと息をついてにっこり笑った。"]]],["sign",0,1,2,"署名する",[["I can't see the road signs in this fog.","この霧では道路標識は見えない。"],["Look at the sign right in front of you.","目の前の標識を見ろよ。"]]],["signal",0,0,2,"信号、合図",[["He gave us the signal to begin.","彼は私たちに始めるように合図した。"],["Tom didn't signal before changing lanes.","トムは車線変更の前にウインカーを出さなかった。"]]],["signature",0,0,2,"署名",[["I attached my signature to the document.","私は書類に署名した。"]]],["significance",0,0,2,"重要性、意味",[]],["signpost",0,0,2,"道しるべ、道標;看板柱",[]],["silent",0,2,2,"音がしない、沈黙の",[["Keep silent, or I'll throw you out of here.","静かにしないと、つまみ出すぞ。"],["She was angry. That is why she remained silent.","彼女は腹を立てていた。だから黙ったままだったのだ。"]]],["silk",0,0,2,"生糸、絹織物",[["That dress is made out of silk.","そのドレスは絹製です。"],["The gown is made of silk.","そのガウンはシルクなんだよ。"]]],["similarity",0,0,2,"類似、相似(resemblance)、類似点",[]],["similarly",0,3,2,"類似して、同様に",[]],["simplify",0,1,2,"…を簡単にする、平易にする、単純にする",[["I'm reading things like famous novels which have been rewritten in simplified French.","簡単なフランス語に書き直された名作とか読んでる。"]]],["simultaneously",0,3,2,"同時に",[["The summit talks are to be broadcast simultaneously throughout the world.","首脳会談は世界中で同時に放送される予定だ。"],["They stood up simultaneously.","彼らは一斉に立ち上がった。"]]],["since",0,5,2,"以後、ずっと、ので",[["Since I was cold, I put on a sweater.","寒かったから、セーターを着たんだよ。"],["Since it was sunny, we went on a hike.","晴れてたから、ハイキングに行ったのよ。"]]],["single",0,0,2,"一人",[["Have you ever been to a singles bar?","シングルバーに行ったことある？"],["It's hard to believe Tom is still single.","トムがまだ独身だなんて、信じられないよ。"]]],["sink",0,1,2,"沈む、下降する、が減る",[["The ship sank to the bottom of the sea.","船は海底に沈んだ。"],["The boat sank to the bottom of the lake.","ボートは湖の底に沈んだ。"]]],["skate",0,1,2,"アイススケート靴、滑り金具、エッジ",[["To me, skiing is far more interesting than skating.","私には、スケートよりもスキーのほうがずっと面白いです。"],["I would often go skating on the lake.","よく湖へスケートに行ったものだ。"]]],["skeleton",0,0,2,"骨格、骨組み",[["He's so thin that he looks like a skeleton.","彼は骸骨のようにやせている。"],["Dr. Skeleton is known for his study on ghosts.","スケルトン博士は幽霊の研究で知られている。"]]],["ski",0,1,2,"スキーで滑走する",[["How many times a year do you go skiing?","一年にどのくらいスキーに行きますか？"],["Tom can ski almost as well as Mary can.","トムはメアリーとほぼ同じぐらい上手にスキーができます。"]]],["skin",0,0,2,"皮膚、皮、毛皮",[["He was wet to the skin from the rain.","彼は雨でずぶぬれになった。"],["Tom got wet to the skin and caught cold.","トムはずぶ濡れになって、風邪をひいた。"]]],["skyscraper",0,0,2,"摩天楼、超高層ビル",[["They demolished the old temple to build a skyscraper.","高層ビルを建てるために、そのお寺は取り壊された。"],["All of a sudden, the thirty-story skyscraper went up in flames.","３０階建の超高層ビルが突然爆発炎上した。"]]],["slavery",0,0,2,"奴隷制度",[["Slavery has been abolished in most parts of the world.","奴隷制度は世界のほとんどの地域で廃止されている。"],["America did away with slavery in 1863.","アメリカは1863年に奴隷制度を廃止した。"]]],["sleep",0,0,2,"眠り、睡眠、状態",[["I want to sleep in my own bed tonight.","今夜は自分のベッドで寝たい。"],["I want to stay home and sleep all day.","家にいて一日中寝ていたいなぁ。"]]],["sleeve",0,0,2,"そで",[["Roll up your sleeves and get to work.","どしどし仕事に取りかかる。"],["I wear short-sleeve shirts in the summer.","夏には半そでシャツを着ます。"]]],["slight",0,0,2,"ほっそりした",[["Having a slight cold, I went to bed early.","風邪気味だったので、早く寝たよ。"],["I have a slight pain in my side.","脇腹が少し痛い。"]]],["slightly",0,3,2,"わずかに",[["Tom owes Mary slightly over a thousand dollars.","トムはメアリーに1000ドルちょっと借りてるんだ。"],["Tom prefers coffee and chocolate with a slightly bitter taste.","トムは、ほろ苦いコーヒーとチョコレートを好みます。"]]],["slip",0,0,2,"滑ること、小片",[["Watch your step, or you will slip and fall.","足元よく見ないと、すってんころりするよ。"],["Be careful not to slip on the ice.","氷の上で滑らないように注意しなさいね。"]]],["slip",0,1,2,"滑る",[["I slipped and fell down the stairs.","足を滑らせて階段から落ちちゃったんだ。"],["Tom slipped the money in his pocket.","トムはポケットにそっとお金を入れた。"]]],["slogan",0,0,2,"スローガン",[]],["slope",0,0,2," jam is my favorite.","ジャムの中でイチゴジャムが一番好きだ。"]]],["stream",0,0,2,"小川、流れ",[["A stream of people came out of the theater.","劇場から続々と人が出てきた。"],["He sat at the edge of the stream.","彼は川のふちに腰を下ろした。"]]],["stream",0,1,2,"流れる",[["A small stream runs by my house.","私の家の近くを小川が流れている。"],["A girl came running, with her hair streaming in the wind.","髪を風になびかせて、少女が走ってきた。"]]],["strengthen",0,1,2,"強くする、強くなる",[]],["stress",0,0,2,"緊張、強調、強勢",[["Exercise is the best way to get rid of stress.","ストレス解消には体を動かすのが一番です。"],["I want to stress this point.","この点を強調したいんだ。"]]],["stressed",0,2,2,"",[["He stressed the convenient aspects of city life.","彼は都会生活の便利な面を強調した。"],["The teacher stressed the importance of daily practice.","先生は毎日の練習の大切さを強調した。"]]],["stressful",0,2,2,"",[["Cities are exciting places, but also stressful.","都会は刺激的な場所だが、ストレスも多い。"],["It was a stressful week.","ストレスフルな一週間だった。"]]],["stretch",0,1,2,"いっぱいに伸ばす(広げる)、長々と横になる",[["He stretched out his arm for a magazine.","彼は雑誌を取るために手を伸ばしました。"],["I stretch before exercising to prevent injury.","怪我を防ぐために、運動前にはストレッチをしています。"]]],["stricken",0,2,2,"strikeの過去分詞、(悲しみ・病気・不幸などに)襲われた、打ちひしがれた",[]],["strike",0,1,2,"なぐる、たたく、ぶつける",[["I'm at the hospital. I got struck by lightning.","病院にいるよ。雷に打たれたんだ。"],["The man suddenly struck me on the head.","男は突然私の頭を殴った。"]]],["strip",0,0,2,"細長い一片",[["Cut the meat into thin strips.","肉は細切りにします。"]]],["stripe",0,0,2,"筋、しま",[["Why do zebras have stripes?","シマウマって、どうしてしましまなの？"]]],["struggle",0,0,2,"非常な努力",[["Finding food was a struggle.","食料を探すのに苦労したよ。"],["Ethnic minorities struggle against prejudice, poverty, and oppression.","少数民族は偏見、貧困、抑圧と戦っている。"]]],["stubborn",0,2,2,"がん固な、取り扱いにくい",[["I don't think Tom is as stubborn as Mary.","トムがメアリーほど頑固だとは思わない。"],["I have never come across such a stubborn person.","あんな強情な人は初めてだよ。"]]],["stuck",0,2,2,"stick の過去・過去分詞、動かない、固定している、粘着している",[["Gum got stuck to the bottom of my shoe.","靴の底にガムが付いてしまった。"],["We were stuck for hours in a traffic jam.","車が混んで何時間も動かなかった。"]]],["studio",0,0,2,"仕事場、映画撮影所、放送 t like committing suicide.","夫が死んだ時彼女は自殺したい気分になった。"]]],["summarise",0,1,2,"…を要約する、手短に述べる",[]],["summarize",0,1,2,"…を要約する、手短に述べる",[]],["summit",0,0,2,"何か",[["The summit of the mountain is covered with snow.","山頂は雪で覆われている。"],["The view from the summit is very nice.","頂上からの景色は最高だね。"]]],["sunbathe",0,1,2,"日光浴をする",[["Cats like to sunbathe.","猫は日向ぼっこが好きなんだよ。"]]],["sundial",0,0,2,"日時計",[]],["sunrise",0,0,2,"日の出",[["We got up early so that we could see the sunrise.","私達は日の出を見るために早く起きた。"],["Tom rises with the sunrise.","トムは夜明けとともに起きます。"]]],["sunset",0,0,2,"日没",[["We have another ten miles to walk before sunset.","日没までにもう十マイル歩かなければならない。"],["We could see the sunset from the window.","窓から日が沈むのを見ることができるだろう。"]]],["superior",0,2,2,"上位の",[["She told her superior what she thought.","彼女は思ったことを上司に伝えた。"],["This cloth is superior to that.","この生地はあの生地よりも上質です。"]]],["superstition",0,0,2,"迷信",[]],["supply",0,0,2,"供給、供給量",[["This dam supplies us with water and electricity.","このダムは私たちに水と電力を供給している。"],["There is close relationship between supply and demand.","需要と供給の間には密接な関係がある。"]]],["support",0,1,2,"支える、養う、支持する",[["He has a sufficient income to support his family.","彼は家族を養うだけの収入がある。"],["I've already sent an email to the support department.","もうサポートセンターにメールを送りました。"]]],["supporter",0,0,2,"支持者、後援者;支え、支える物、扶養する人",[["Some of Martin Luther King's supporters began to question his belief in peaceful protests.","マーティン・ルーサー・キング牧師の支持者の中には、平和的に抗議するという彼の信念に疑いの念を持つ物も現れ始めた。"]]],["supportive",0,2,2,"支える;維持する;扶養する",[]],["suppose",0,1,2,"仮定する、思う、前提[条件]にする",[["I didn't think you were supposed to be here.","君がここにいるはずだとは思ってなかったよ。"],["I thought we were supposed to meet Tom at 2:30.","私たちは2時30分にトムと会うことになっていると思っていました。"]]],["supposedly",0,3,2,"想像上、おそらく",[["Supposedly, Tom is a good cook.","おそらくトムは良いコックだ。"],["Supposedly it's going to rain soon.","もうすぐ雨が降るはずなんだけど。"]]],["surely",0,3,2,"確かに",[["Surely I'm not as smart as Tom.","きっとトムほど賢くないだろうな。"],["She will surely be enjoying a hot bath at this hour.","彼女はきっとこの時間は温泉につかって楽しんでいることでしょう。"]]],["surface",0,0,2,"うわべ、表面(水面)の、うわべだけの",[["He stood on the surface of the moon.","彼は月の表面に立った。"],["A fallen leaf floated on the surface of the water.","１枚の落ち葉が水面に浮かんでいた。"]]],["surgeon",0,0,2,"外科医",[["The surgeon persuaded me to undergo an operation.","外科医は私に手術を受けるよう説得した。"],["Tom is a brain surgeon.","トムは脳外科医だ。"]]],["surgery",0,0,2,"外科医術、手術",[["What kind of surgery do you need?","どんな手術が必要なの？"],["Am I going to need surgery?","手術が必要ですか？"]]],["surprise",0,1,2,"驚かす、不意をつく、急襲する",[["I was surprised at the news of his death.","彼が死んだと言うニュースを聞いて驚いた。"],["He was surprised to hear a cry from within.","彼は中から聞こえてくる叫び声にびっくりした。"]]],["surprisingly",0,3,2,"驚くほどに",[["Tom always gets the job done surprisingly fast.","トムはいつも驚くほど仕事が早い。"],["This film was surprisingly interesting.","この映画、意外に面白かったよ。"]]],["surround",0,1,2,"囲む、囲いをする",[["The garden was surrounded by a wooden fence.","庭は木のフェンスで囲まれていた。"],["My town is surrounded by tall mountains.","私の町は高い山に囲まれている。"]]],["surrounding",0,2,2,"囲む",[]],["survival",0,0,2,"(…が)生き残ること、(…の)生存、残存、生存者、残存者;残存物、遺物",[["I gave up all hope of survival.","もう助からないものと観念した。"],["The company is struggling for survival.","会社は生き残りを賭けて奮闘している。"]]],["survivor",0,0,2,"生存者",[["There was only one survivor of the accident.","事故の生存者は一人だけでした。"],["Are there any survivors?","生存者はいますか？"]]],["suspect",0,0,2,"疑う、怪しいと思う",[["I suspect that what Tom said was a lie.","トムが言ったことは嘘なんじゃないかな。"],["I suspect that Tom and Mary don't like me.","トムとメアリーは私のこと嫌いなんじゃないかと思うんだ。"]]],["suspicion",0,0,2,"疑い",[["Talk like that will raise suspicion.","そういう言葉は疑念を呼ぶだろう。"],["The news confirmed my suspicions.","その知らせで私の疑いはいっそう強くなった。"]]],["swarm",0,0,2,"群れ",[["Tom got attacked by a swarm of bees.","トムがハチの群れに襲われたんだ。"],["We were attacked by swarms of bees.","私たち、蜂の大群に襲われたんです。"]]],["swear",0,1,2,"証言する",[["Tom swore that he didn't tell anyone our secret.","トムは私たちの秘密を誰にも言っていないと断言した。"],["I never told anybody about it, I swear.","誰にも言ってないよ。本当だってば。"]]],["sweat",0,0,2,"汗",[["Today, I worked up a good sweat swimming.","今日は、水泳でいい汗流したな。"],["Tom began to sweat like a pig.","トムは大汗をかき始めた。"]]],["sweatshirt",0,0,2,"(特に運動選手が着る)綿ジャージーの長袖のTシャツ",[["One of the men was wearing a blue sweatshirt.","男性の１人は青のスウェットを着ていた。"],["I think you've put your sweatshirt on inside out.","セーター、裏返しなんじゃない？"]]],["swell",0,1,2,"大きくなる、張り出る、増大する",[["In addition to a thick fog, there was a heavy swell.","濃霧に加えてうねりも高かった。"],["How many days will it take until the swelling goes down?","腫れが引くまで何日くらいかかりますか。"]]],["swimmer",0,0,2,"泳ぐ人",[["I thought that I was a fairly good swimmer.","私は水泳に相当の自信を持っていた。"],["Tom is a better swimmer than Mary is.","トムはメアリーよりも水泳が得意だ。"]]],["switch",0,0,2,"しなやかな小枝、変更、スイッチ",[["I felt for the light switch in the dark.","私は暗闇の中で手探りで電気のスイッチを探した。"],["Switch on the light. I can't see anything.","電灯を点けてくれ。何も見えないよ。"]]],["switch",0,1,2,"しなやかな小枝、変更",[["She switched on the lamp because it was dark.","暗かったので彼女はランプをつけた。"],["When the program finished, we switched the radio off.","私たちはその番組が終わるとラジオを切った。"]]],["swollen",0,2,2,"swell の過去分詞、膨れた、はれあがった;(…で)膨れた",[["How long have your cheeks been swollen?","頬の腫れは、どれくらい続いていますか？"],["My hands and legs are swollen.","手足がむくんでいます。"]]],["sword",0,0,2,"刀",[["A boy with a toy sword was playing by himself.","おもちゃの剣を持った少年が、一人で遊んでいた。"],["He was killed with a sword.","彼は剣で殺された。"]]],["sympathy",0,0,2,"共感、同情、共鳴",[["When his wife died, he received dozens of letters of sympathy.","奥さんが死んだ時、彼は何十通もの同情の手紙を受け取った。"],["We felt sympathy for her.","私たちは彼女に同情した。"]]],["symptom",0,0,2,"(病気の)徴候、症状、(一般)に(…の)徴候、きざし、印",[["I have a headache but no other symptoms.","頭痛はありますが、他の症状はありません。"],["You should go see a doctor if the symptoms get worse.","症状が悪くなったら医者に診てもらった方がいいよ。"]]],["syndrome",0,0,2,"(疾患の徴候となる一群の)症徴候、症候群、(事件・社会的状態などのパターンを示す",[]],["systematic",0,2,2,"系統だった",[]],["tablet",0,0,2,"(銘文などを彫り込む、金属・石の)銘板、(昔文字を記した粘土などの)書字板",[["I can't swallow these tablets without a drink of water.","水なしじゃ、こういう錠剤は飲み込めないよ。"],["Take one tablet a day until all of the medicine is gone.","毎日１錠を、薬がなくなるまで飲んで下さい。"]]],[ ,2,"重荷、重荷を負わせる",[["We think that it's our duty to pay taxes.","税金を納めるのは私たちの義務だと思っています。"],["The new tax system comes into effect next year.","新しい税制は、来年から実施される。"]]],["teaching",0,0,2,"教えること",[["Do you think my way of teaching is wrong?","わたしの教え方は間違っていると思いますか。"],["Thank you for teaching me so many things.","いろいろ教えていただき、ありがとうございました。"]]],["teammate",0,0,2,"チーム仲間",[["Tom was well liked by his teammates.","トムはチームメイトに好かれていた。"]]],["teamwork",0,0,2,"協同作業",[["Teamwork is important in soccer.","サッカーは連携が大切だ。"]]],["tear",0,1,2,"裂く、破って作る、引きはがす",[["The cabin was torn to pieces by the storm.","小屋は嵐でばらばらになった。"],["Someone has torn two pages out of this book.","誰かがこの本から２ページ破り取った。"]]],["tease",0,0,2,"いじめる",[["Don't tease Tom like that.","そんな風にトムをからかうな。"]]],["technique",0,0,2,"技巧、手法",[["I wonder what the advantage of this technique is.","この技術の利点って何なのかな？"],["That pianist is known for his technique.","あのピアニストは技巧でよく知られている。"]]],["technological",0,2,2,"科学技術の(に関する)",[]],["teen",0,0,2,"(数字が ‐teen で終わる)13歳から19歳までの、10代の(に特有な)",[["My younger sister got married in her teens.","私の妹は１０代で結婚した。"],["Mary went over to the United States in her late teens.","メアリーは１０代後半にアメリカ合衆国に渡った。"]]],["telecommunications",0,0,2,"電信・ラジオ・テレビによる遠距離通信",[]],["telegram",0,0,2,"電報",[["I received a telegram saying that my uncle had arrived.","私はおじが到着したという電報をうけとった。"],["I want to send a telegram.","電報を送りたいんですが。"]]],["teller",0,0,2,"話し手、語り手、(銀行の)現金出納係",[["Tom isn't a joke teller.","トムは冗談なんて言う人じゃないわ。"]]],["temper",0,0,2,"立腹、気質、気分",[["All of a sudden, the clerk lost his temper.","突如その職員がキレた。"],["He lost his temper and hit the boy.","彼はかんしゃくを起こして、その少年をたたいた。"]]],["temporary",0,2,2,"一時の",[["It's only a temporary fix.","ほんの一時的な処置です。"],["This arrangement is only temporary.","この取り決めは一時的なものでしかない。"]]],["tempt",0,1,2,"誘惑する、そそる",[["The sight of the money tempted him into stealing.","その金を見ると彼はふっと盗みたくなった。"],["What tempted him to propose to her?","彼は何を血迷って彼女にプロポーズしたのだろうか？"]]],["tend",0,1,2,"傾向がある、世話をする",[["Tom tends to do things at his own pace.","トムは呑気でマイペースな性格だ。"],["Boys tend to look down on their younger sisters.","男の子は自分の妹を見下しがちである。"]]],["tendency",0,0,2,"傾向、性癖",[["He has a tendency to lose his temper.","彼はカッとなる傾向がある。"],["You have a tendency to talk too fast.","お前さ、早口になりがちだぞ。"]]],["tense",0,2,2,"時制、ぴんと張った",[["I'm always tense before I get on an airplane.","飛行機に乗る前はいつも緊張する。"],["There was a tense atmosphere in the room.","部屋には張り詰めた空気が漂っていた。"]]],["tense",0,0,2,"時制、ぴんと張った、緊張した",[["This sentence is in the present tense.","この文の時制は現在です。"],["Are you still tense?","まだ緊張してる？"]]],["tension",0,0,2,"ぴんと張ること、緊張、緊張状態(関係)",[["His joke eased the tension in the room.","彼の冗談で室内の緊張がほぐれた。"]]],["tent",0,0,2,"テント",[["We set up the tent next to the river.","川の近くにテントを張った。"],["The problem was where to set up the tent.","問題はどこにテントを張るかだった。"]]],["term",0,0,2,"専門用語、期間、学期",[["I've been very busy since the new term started.","新学期が始まってからというもの、とっても忙しいの。"],["I'm not on good terms with my family.","家族とは折り合いが悪いんだ。"]]],["terminal",0,0,2,"終りの、死に至る",[["Where is the bus terminal?","バスターミナルはどこですか。"],["Where is the south terminal?","南ターミナルはどこですか。"]]],["terribly",0,3,2,"恐ろしく、ひどく",[["I'm terribly busy because the report deadline is near.","レポートの締め切りが間近に迫っているので、私はひどく忙しい。"],["The wind is blowing, but it's terribly hot.","風は吹いてるけどひどく暑い。"]]],["terrific",0,2,2,"(大きさ・程度が)ものすごい、恐ろしい",[["A car went by at terrific speed.","車が猛スピードで通り過ぎていった。"],["It was a terrific experience.","凄い経験でした。"]]],["terrified",0,2,2,"",[["Tom is obviously terrified.","トムは見るからに怖がっている。"]]],["terror",0,0,2,"恐怖、恐ろしい人(物・事)",[["Most young people don't know the terror of war.","大多数の若者は戦争の恐怖を知らない。"],["Tom was paralyzed with terror.","トムは恐怖のあまり立ちすくんだ。"]]],["terrorism",0,0,2,"(政治的な)行為、テロ;恐怖政治",[["We will not tolerate anyone who engages in terrorism.","我々は、誰であろうとテロ活動に携わるものに寛容でいるつもりはない。"]]],["terrorist",0,0,2,"テロリスト、暴力主義者、恐怖政治家、暴力政治の;暴力主義者の",[["The terrorists released the hostages.","テロリストは人質を解放した。"]]],["thankful",0,2,2,"感謝している",[["I am thankful for my friends.","友達に感謝しています。"],["I'm thankful to be alive.","生きていることをありがたく思います。"]]],["theft",0,0,2,"盗み;窃盗罪",[["Please tell me how the theft was done.","その盗難がどのようにして行われたか教えてください。"],["I reported the theft of my car to the police.","警察に車の盗難届を出した。"]]],["theory",0,0,2,"理論、推測",[["There are many theories about the origin of life.","生命の起源については数多くの学説がある。"],["The theory is too abstract for me.","その理論は私にはちんぷんかんぷんだ。"]]],["thirst",0,1,2,"渇望する",[["He satisfied his thirst with a large glass of beer.","彼は大きなグラスに入れたビールで喉の渇きをいやした。"],["I had a glass of beer to quench my thirst.","喉の渇きを癒すため、ビールを一杯飲んだ。"]]],["thorough",0,2,2,"完全な、徹底的な",[["He made a thorough analysis of the problem.","彼はその問題を徹底的に分析した。"],["I recommend a thorough checkup for your husband.","ご主人には精密検査をお勧めします。"]]],["threat",0,0,2,"脅し、きざし",[["What he said was nothing less than a threat.","彼の言ったことは脅しにほかならなかった。"],["Nuclear weapons are a threat to the human race.","核兵器は人類にとって脅威だ。"]]],["threatening",0,2,2,"脅す、脅迫する、(空模様などが)険悪な、荒れそうな",[["The workers are threatening to strike.","労働者たちはストライキを起こすと脅している。"],["It is threatening to rain.","今にも一雨きそうだ。"]]],["thriller",0,0,2,"スリルを与えるもの、スリラー映画(小説、劇)",[]],["through",0,3,2,"…を貫いて、通って、…の中を、…じゅうずっと",[["I want to see the world through your eyes.","君の世界観を教えて欲しいな。"],["I went through the gate out onto the street.","私は門をくぐって通りへと出た。"]]],["throughout",0,4,2,"…じゅう[ずっと]、…の至る所に、全く",[["He has helped the poor throughout his life.","彼は生涯に渡って貧しい人々を助けた。"],["The summit talks are to be broadcast simultaneously throughout the world.","首脳会談は世界中で同時に放送される予定だ。"]]],["thumb",0,0,2,"親指",[["He accidentally hit his thumb with the hammer.","彼は過って親指を金槌で打ち付けた。"],["He has her under his thumb.","彼女は彼の言いなりです。"]]],["thump",0,1,2,"ゴツンとたたく、ドンと打つ",[]],["thunder",0,0,2,"雷鳴、雷のような大きな音",[["We had a lot of thunder that summer.","あの夏は雷が多かった。"],["I heard it thunder in the distance.","遠くで雷が鳴ったのが聞こえた。"]]],["thunderous",0,2,2,"雷の、雷鳴のようにとどろく",[]],["thus",0,3,2,"このように、従って",[["Many women pursue higher education and careers, thus delaying marriage and childbirth.","多くの女性がより高い教養とキャリアを追求し、それ故に結婚 // D[i] = [見出し語, 種別(0単語/1熟語), 品詞, レベル(0=A1,1=A2,2=B1), 意味, [[英文,和訳],...]]
const POS=["名詞","動詞","形容詞","副詞","前置詞","接続詞","代名詞","限定詞","数詞","助動詞","間投詞","その他"];
const LV=["A1","A2","B1"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=a=>a[Math.random()*a.length|0];
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const keyOf=i=>D[i][0]+"|"+D[i][2];

// ---- 索引 ----
const byLv=[[],[],[]],byPos={},ALL=[],KI={};
D.forEach((w,i)=>{KI[keyOf(i)]=i;if(!w[4])return;byLv[w[3]].push(i);ALL.push(i);(byPos[w[2]]=byPos[w[2]]||[]).push(i)});

// ---- 学習記録: hist[見出し語|品詞] = [回答数, 正解数, 最終回答時刻] ----
const HK="vocab_hist_v1";
let hist={},histT=0,dbDoc=null,timer=0;
try{const s=JSON.parse(localStorage.getItem(HK)||"null");if(s){hist=s.h||{};histT=s.t||0}}catch(e){}
const setSync=t=>{$("#sync").textContent=t};
function saveLocal(){try{localStorage.setItem(HK,JSON.stringify({h:hist,t:histT}))}catch(e){}}
function save(){histT=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(pushDb,1500)}
async function pushDb(){
  if(!dbDoc)return;
  const body={h:hist,t:histT};
  if(JSON.stringify(body).length>240000){setSync("記録が大きいため、この端末内のみに保存しています");return}
  try{await dbDoc.set(body);setSync("学習記録をアカウントに保存しました")}catch(e){setSync("学習記録はこの端末内に保存しています")}
}
async function initDb(){
  try{
    if(!(window.claude&&claude.use)){setSync("学習記録はこの端末のブラウザ内に保存されます");return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    dbDoc=db.doc("data/users/"+uid+"/progress");
    const snap=await dbDoc.get();
    const d=snap.exists?snap.data():null;
    if(d&&d.t>histT){hist=d.h||{};histT=d.t;saveLocal();renderHist()}
    else if(histT)pushDb();
    setSync("学習記録はアカウントに保存されます");
  }catch(e){}
}

// ---- クイズ ----
let lvSel=2,cur=null,sel=null,total=0,right=0,last=-1;
function next(){
  const pool=byLv[lvSel];
  if(!pool.length){cur=null;renderQuiz();return}
  let i,n=0;
  do{i=rnd(pool)}while(i===last&&pool.length>1&&++n<20);
  last=i;
  const w=D[i],seen=new Set([w[4]]),opts=[];
  const pick=arr=>{for(let k=0;k<100&&opts.length<3;k++){const j=rnd(arr),m=D[j][4];if(j!==i&&!seen.has(m)){seen.add(m);opts.push(m)}}};
  pick(byPos[w[2]]||[]);
  if(opts.length<3)pick(ALL);
  const ch=[...opts,w[4]];
  for(let k=ch.length-1;k>0;k--){const r=Math.random()*(k+1)|0;[ch[k],ch[r]]=[ch[r],ch[k]]}
  cur={i,ch,ans:ch.indexOf(w[4])};sel=null;
  renderQuiz();
  if($("#auto").checked)say(w[0]);
}
function answer(k){
  if(sel!==null||!cur)return;
  sel=k;const ok=k===cur.ans;total++;if(ok)right++;
  const key=keyOf(cur.i),h=hist[key]||[0,0,0];
  h[0]++;if(ok)h[1]++;h[2]=Date.now();hist[key]=h;save();
  renderQuiz();
}
const exHtml=w=>w[5].length?w[5].map(e=>`<div class="ex"><div>${esc(e[0])}<div class="sub">${esc(e[1])}</div></div><button class="ic" data-t="${esc(e[0])}" aria-label="発音">🔊</button></div>`).join(""):'<div class="sub">用例は未登録です</div>';
function renderQuiz(){
  $("#score").textContent=right+" / "+total;
  const q=$("#qbox");
  if(!cur){q.innerHTML='<p class="sub">このレベルには、意味が登録された単語がありません。</p>';return}
  const w=D[cur.i],done=sel!==null;
  let h=`<div class="card"><div class="hw">${esc(w[0])}<button class="ic" data-t="${esc(w[0])}" aria-label="発音">🔊</button></div><div class="sub">${POS[w[2]]} ・ ${LV[w[3]]}${w[1]?" ・ 熟語":""}</div></div>`;
  cur.ch.forEach((t,k)=>{
    let c="opt";
    if(done){if(k===cur.ans)c+=" ok";else if(k===sel)c+=" ng"}
    h+=`<button class="${c}" data-k="${k}">${esc(t)}</button>`;
  });
  if(done){
    const ok=sel===cur.ans;
    h+=`<div class="res ${ok?"okt":"ngt"}">${ok?"正解!":"不正解"}</div>${exHtml(w)}<button class="next" id="nx">次へ</button>`;
  }
  q.innerHTML=h;
}

// ---- 回答履歴 ----
function renderHist(){
  const s=$("#sort").value,p=$("#fp").value,l=$("#fl").value,t=$("#ft").value;
  const rows=[];
  for(const k in hist){
    const i=KI[k];if(i===undefined)continue;
    const w=D[i];
    if(p!==""&&w[2]!=p)continue;if(l!==""&&w[3]!=l)continue;if(t!==""&&w[1]!=t)continue;
    rows.push([i,hist[k]]);
  }
  const abc=(a,b)=>D[a[0]][0].toLowerCase().localeCompare(D[b[0]][0].toLowerCase());
  rows.sort(s==="pos"?(a,b)=>D[a[0]][2]-D[b[0]][2]||abc(a,b):s==="lv"?(a,b)=>D[a[0]][3]-D[b[0]][3]||abc(a,b):s==="recent"?(a,b)=>b[1][2]-a[1][2]:abc);
  $("#cnt").textContent=rows.length+"語";
  $("#list").innerHTML=rows.length?rows.map(([i,h])=>{
    const w=D[i];
    return `<details><summary><b>${esc(w[0])}</b><span class="tag">${POS[w[2]]} ・ ${LV[w[3]]}</span><span class="rate">${h[1]}/${h[0]}</span></summary><div class="mean">${esc(w[4]||"(意味は未登録)")}<button class="ic" data-t="${esc(w[0])}" aria-label="発音">🔊</button></div>${exHtml(w)}</details>`;
  }).join(""):'<p class="sub">まだ回答した単語がありません。クイズに答えると、ここに記録されます。</p>';
}

// ---- 画面の組み立て ----
$("#lv").innerHTML=LV.map((n,k)=>`<button class="chip${k===lvSel?" on":""}" data-lv="${k}">${n}</button>`).join("");
$("#fp").innerHTML='<option value="">全品詞</option>'+POS.map((n,k)=>`<option value="${k}">${n}</option>`).join("");
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){say(b.dataset.t);e.preventDefault();return}
  if(b.dataset.k!==undefined){answer(+b.dataset.k);return}
  if(b.id==="nx"){next();return}
  if(b.dataset.lv!==undefined){lvSel=+b.dataset.lv;document.querySelectorAll("#lv .chip").forEach((c,k)=>c.classList.toggle("on",k===lvSel));next();return}
  if(b.dataset.tab){
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
    $("#quiz").hidden=b.dataset.tab!=="quiz";$("#hist").hidden=b.dataset.tab!=="hist";
    if(b.dataset.tab==="hist")renderHist();
  }
});
["#sort","#fp","#fl","#ft"].forEach(s=>$(s).addEventListener("change",renderHist));
next();
initDb();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
