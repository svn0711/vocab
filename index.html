u on your way to the tennis court?","テニスコートに行くの？"],["I thought a game of tennis might be fun.","テニスの試合は面白いかもしれないと思った。"]]],["terrible",0,2,0,"恐ろしい、ひどい",[["I had a terrible accident riding this bike.","この自転車に乗っててひどい事故に遭ったんです。"],["She fainted when she heard the terrible news.","彼女はその恐ろしいニュースを聞いて気を失った。"]]],["test",0,0,0,"試験",[["I wish I had studied harder for the test.","テスト勉強、もっとやっとけばよかった。"],["He studied hard in order to pass the test.","彼は試験に合格するために一生懸命勉強した。"]]],["than",0,5,0,"より[も]、よりも、よりむしろ",[["I can no more swim than I can fly.","私は空を飛べないのと同じく泳ぐこともできない。"],["I know Tom is a bit older than me.","トムが私よりちょっとだけ年上なのは知ってるよ。"]]],["than",0,4,0,"…より[も]、よりも、よりむしろ",[["A dog can run faster than a man can.","犬は人間よりも速く走れる。"],["He has a lot more money than I have.","彼はぼくよりたくさんお金を持っている。"]]],["thank",0,1,0,"感謝する",[["I just want to thank you for your help.","ただ、助けていただいたお礼が言いたいです。"],["I thank you from the bottom of my heart.","心からお礼申し上げます。"]]],["thanks",0,0,0,"ありがとう、(…に対する)感謝の言葉(気持ち)",[["Thanks a lot for lending your umbrella to me.","傘を貸してくださってたいへん有り難うございました。"],["\"How are you feeling this morning?\" \"Pretty good, thanks.\"","「今朝は調子はいかがですか」「かなりいいですよ、ありがとう」"]]],["that",0,5,0,"あれ、それ、それ、あれ",[["I wish that I had a lot of money.","うんとお金があればいいのに。"],["I need to tell Tom not to do that.","私はトムにそれをしてはいけないと教える必要がある。"]]],["that",0,7,0,"あれ、それ、それ、あれ",[["I want Tom to take a look at that.","私はトムにそれを見てほしい。"],["I wish that I were as rich as you.","君のような金持ちだったらよかったのに。"]]],["that",0,6,0,"あれ、それ、それ、あれ",[["Tom is a man that you can rely on.","トムは信頼できる男だ。"],["What is it that you want me to do?","君が私にやってほしいというのは何ですか。"]]],["the",0,7,0,"その、というもの、…につき;…単位[で]",[["Is it OK if I stay in the car?","車の中にいてもいい？"],["I did it the way he told me to.","私は彼の言う通りにした。"]]],["theater",0,0,0,"劇場、劇、現場",[["I am going to the theater on the corner.","角の劇場に行くところです。"],["A stream of people came out of the theater.","劇場から続々と人が出てきた。"]]],["theatre",0,0,0,"劇場、劇、現場",[["I am going to the theater on the corner.","角の劇場に行くところです。"],["A stream of people came out of the theater.","劇場から続々と人が出てきた。"]]],["their",0,7,0,"彼らの",[["Tom and Mary bought a car for their son.","トムとメアリーはね、息子に車を買ってあげたんだよ。"],["No one in their right mind would do that.","正気の人なら誰もそんなことをしない。"]]],["them",0,6,0,"彼らを(に)",[["I went to the airport to see them off.","私は彼らを見送りに飛行場まで行った。"],["My clothes got wet so I took them off.","服が濡れちゃったから脱いだんだよ。"]]],["then",0,3,0,"その時、それから、その上",[["I like to ride a horse now and then.","私は時々馬に乗るのを楽しみます。"],["I wish you had told me the truth then.","あの時本当のことを言ってくれたらよかったのに。"]]],["there",0,3,0,"そこで(に、へ)、その時に、その点で",[["Do you go there by bus or by car?","そこにはバスで行ってるの？それとも車？"],["Is it OK if I put this over there?","これ、あそこに置いてもいいですか？"]]],["these",0,7,0,"これら、これらの",[["It isn't easy to find a job these days.","近頃は仕事を見つけるのが簡単じゃない。"],["Would it be OK if we ate these oranges?","このオレンジ食べてもいいですか。"]]],["these",0,6,0,"これら、これらの",[["It's not easy to find a job these days.","近頃は仕事を見つけるのが簡単じゃない。"],["May I visit your home one of these days?","そのうちお宅にお伺いしてもいいでしょうか。"]]],["they",0,6,0,"彼らが(は)、人々",[["I just did what they told me to do.","言われたことをしたまでです。"],["They went on a trip a few days ago.","彼らは数日前に旅行にでかけた。"]]],["thick",0,2,0,"厚い、太い、厚さ…の",[["The ice isn't thick enough to hold our weight.","私たちの体重を支えるだけの厚さが氷にはないんです。"],["The flight was canceled because of the thick fog.","フライトは濃霧のため、キャンセルになった。"]]],["thin",0,2,0,"薄い、か細い",[["I used to be thin when I was young.","若い頃は痩せてたんだよ。"],["My uncle is thin, but my aunt is fat.","叔父はすらっとしているが、叔母は太っている。"]]],["thing",0,0,0,"物、無生物",[["I have a lot of things to do today.","僕は今日はすることがたくさんある。"],["I have a lot of things to tell you.","お話したいことが色々あります。"]]],["think",0,1,0,"考える、思う、企てる",[["I think Tom can do it on his own.","トムは一人でできると思うよ。"],["I thought I told you to go to bed.","寝るように言ったはずだけど。"]]],["thirteen",0,8,0,"13の",[["When Tom was thirteen, he ran away from home.","１３歳の時にトムは家出をした。"],["My parents died when I was thirteen years old.","両親は13の時に亡くなりました。"]]],["thirty",0,8,0,"30の",[["Two to the power of five equals thirty-two.","2の5乗は32です。"],["I thought Tom and Mary were both over thirty.","トムとメアリーの２人とも30を超えてると思ってたよ。"]]],["this",0,7,0,"これ、今、ここ",[["Is it OK if I drink all of this?","これ全部飲んじゃってもいい？"],["I like this coat. May I try it on?","このコート気に入ったわ。試着してもいいかしら。"]]],["this",0,6,0,"これ、今、ここ",[["Is it OK if I put this over there?","これ、あそこに置いてもいいですか？"],["This desk is a bit too low for me.","この机は、私にはちょっと低すぎる。"]]],["those",0,7,0,"それ[ら]、それ、人たち",[["I usually got up at five in those days.","私は当時たいてい５時に起きた。"],["In those days, all I ate was junk food.","あのころはジャンクフードばかり食べてた。"]]],["those",0,6,0,"それ[ら]、それ、人たち",[["There was no TV or radio in those days.","その頃はテレビやラジオはありませんでした。"],["In those days, he lived in the house alone.","その当時、彼は一人でその家に住んでいた。"]]],["three",0,8,0,"3の",[["We lost by a score of three to one.","３対１で負けた。"],["He earns three times as much as I do.","彼は私の三倍も稼ぐ。"]]],["through",0,4,0,"…を貫いて、通って、…の中を、…じゅうずっと",[["The cat went through a gap in the fence.","ネコは塀の割れ目を通り抜けた。"],["We had to push our way through the crowd.","混んでいたので人をかき分けて行かねばならなかった。"]]],["throw",0,0,0,"投げること",[["I felt like I was going to throw up.","戻しそうだった。"],["I feel very sick. I want to throw up.","ひどく気分が悪い。吐きそうだ。"]]],["Thursday",0,0,0,"木曜日",[["I will be here from Monday to Thursday.","月曜から木曜までここにおります。"],["I would rather you came on Friday than on Thursday.","木曜日より金曜日に来ていただきたいのですが。"]]],["ticket",0,0,0,"切符",[["Let me get you a ticket to the concert.","そのコンサートのチケット、買ってきてあげるよ。"],["Can I buy a ticket for the concert here?","コンサートのチケットはここで買えますか。"]]],["tiger",0,0,0,"トラ",[["A tiger will attack people when it's hungry.","トラは空腹の時は人を襲うものだ。"],["A tiger has escaped from the zoo.","動物園から一頭のトラが脱走した。"]]],["tight",0,2,0,"すきまのない、きつい",[["This is a bit too tight around my neck.","これは首まわりがすこしきつすぎる。"],["I'm on a really tight schedule this week.","今週はスケジュールがぎちぎちに詰まってるんだ。"]]],["time",0,0,0,"時間、時刻",[["It is time for you to go to bed.","もうお前は寝る時間だ。"],["How many times do I have to say it?","何度言わせるつもりだ。"]]],["tired",0,2,0,"疲れた、飽きた",[["I'm tired and I want to go to bed.","疲れてるし、寝たいよ。"],["I am so tired that I can hardly walk.","私はひどく疲れてもう歩けそうにない。"]]],["to",0,11,0,"へ、…に対して",[["I go to bed at ten as a rule.","大抵１０時には寝るよ。"],["All I can do is to do my best.","私にできるのは全力を尽くすことだけです。"]]],["to",0,4,0,"…へ、…に対して",[["I did it the way he told me to.","私は彼の言う通りにした。"],["I have a mind to buy a new car.","新しい車を買おうかと思っている。"]]],["today",0,3,0,"きょう[は]、現代では、きょう",[["Is it OK if I use your car today?","今日、あなたの車使ってもいい？"],["I owe what I am today to my uncle.","私の今日があるのは、おじさんのおかげです。"]]],["today",0,0,0,"きょう[は]、現代では、現代",[["I have a lot of things to do today.","僕は今日はすることがたくさんある。"],["Today I have to give my cat a bath.","今日はねこをお風呂に入れなくちゃ。"]]],["together",0,3,0,"いっしょに、一団(一体)となるように、互いに",[["We need to band together to beat the enemy.","敵に打ち勝つために団結しなければならない。"],["Why do wine and cheese go together so well?","どうしてワインとチーズはこんなによく合うの？"]]],["toilet",0,0,0,"便器",[["That was the last roll of toilet paper.","最後のトイレットペーパだったのに。"],["I need to go to the toilet.","ちょっとトイレ。"]]],["tomato",0,0,0,"トマト",[["The tomato is a vegetable, not a fruit.","トマトは野菜で、果物ではない。"],["I grow tomatoes and onions in my garden.","庭でトマトと玉ねぎを栽培しています。"]]],["tomorrow",0,3,0,"明日[に]、明日",[["I have a lot of work to do tomorrow.","明日はやるべき仕事がたくさんある。"],["I will go out if it is fine tomorrow.","明日天気なら外出します。"]]],["tomorrow",0,0,0,"明日[に]、明日",[["I plan to stay at home all day tomorrow.","明日は一日中家にいるつもりです。"],["Do you think tomorrow will be a nice day?","明日はいい天気だと思う？"]]],["tonight",0,3,0,"今晩、今夜[は]",[["Do you want to go out with me tonight?","今夜、私と一緒に出かけませんか？"],["I want to sleep in my own bed tonight.","今夜は自分のベッドで寝たい。"]]],["too",0,3,0,"あまりにも、非常に",[["This desk is a bit too low for me.","この机は、私にはちょっと低すぎる。"],["I don't want to be too hard on Tom.","トムにはあまり厳しくしたくないんだよ。"]]],["tool",0,0,0,"道具、動力機械",[["A half-dozen tools make up the tool collection.","６種の道具がひとまとまりになっている。"],["We need a tool to open it with.","それを開ける道具が必要です。"]]],["tooth",0,0,0,"歯、歯状の物",[["I had a tooth pulled a week ago.","1週間前に抜歯しました。"],[" t to Tom yet.","トムにまだそれを見せたくない。"],["The paint on the door is not dry yet.","このドアのペンキはまだ乾いていない。"]]],["yoghourt",0,0,0,"",[]],["yoghurt",0,0,0,"ヨーグルト",[]],["yogurt",0,0,0,"ヨーグルト",[["There is yogurt in the fridge.","冷蔵庫にヨーグルトがあるよ。"],["This yogurt tastes strange.","このヨーグルトは変な味がする。"]]],["you",0,6,0,"あなた[がた]は(を)",[["May I ask you to do me a favor?","一つお願いがあるのですが。"],["Do you mind if I take a day off?","一日休みを取ってもいいですか。"]]],["young",0,2,0,"若い、年下のほうの",[["I'm not as young as I used to be.","昔のような元気はない。"],["He is young, but he is an able man.","彼は若いが、有能な男だ。"]]],["your",0,7,0,"あなた[がた]の",[["Is it OK if I use your car today?","今日、あなたの車使ってもいい？"],["Can I stay at your place for a while?","しばらくの間、家に泊めてもらってもいいかな？"]]],["yours",0,6,0,"あなた[たち]のもの",[["I need a pencil. Can you lend me yours?","鉛筆がいるんだけど。あなたの貸してくれない？"],["I heard about it from a friend of yours.","お前のダチから、聞いたよ。"]]],["yourself",0,6,0,"あなた自身、あなた自身を(に)",[["Do you plan to eat all of that yourself?","それ全部一人で食べるつもり？"],["Are you going to do that all by yourself?","自分一人でそれやるつもりなの？"]]],["zoo",0,0,0,"動物園",[["Could you tell me the way to the zoo?","動物園への行き方を教えてもらえませんか？"],["How much money did you spend at the zoo?","動物園でいくら使ったの？"]]],["ability",0,0,1,"能力",[["Cats have the ability to see in the dark.","猫は暗闇でも目が見える能力を持っている。"],["I'll help you within the limits of my ability.","私に出来る範囲でお手伝いいたしましょう。"]]],["abroad",0,3,1,"海外へ(で)、外国に(で)、広く",[["He is eager for a chance to study abroad.","彼は留学するチャンスがほしいと強く望んでいる。"],["If I had enough money, I could go abroad.","もし十分なお金を持っていれば、海外へ行けるのに。"]]],["accept",0,1,1,"受け取る、認める、引き受ける",[["I had no choice but to accept the offer.","その申し出は受けるより仕方がなかった。"],["I asked her to marry me and she accepted.","彼女に結婚してくれないかと言ったら彼女は承知してくれた。"]]],["acceptable",0,2,1,"受け入れられる、認められる;人に喜ばれる",[["Flowers are always acceptable.","花はいつもらってもうれしいものだ。"],["Let's find a solution that is acceptable to everyone.","全員が受け入れられる解決策を探そう。"]]],["accident",0,0,1,"偶然、事故",[["I got my left arm hurt in the accident.","事故で左腕をけがしたんだ。"],["I got my right leg hurt in the accident.","私はその事故で右足を負傷した。"]]],["account",0,0,1,"計算、計算書、説明",[["My husband and I have a joint bank account.","夫と私は共同の銀行口座を持っています。"],["The game was called off on account of rain.","その試合は雨のため中止となった。"]]],["achieve",0,1,1,"達成する",[["He finally achieved what he set out to do.","彼はついに目的を果たした。"],["It takes luck and hard work to achieve wealth.","裕福になるためには幸運と大変な努力が必要だ。"]]],["across",0,3,1,"を横断して、を越えて、の向こう側に",[["We saw a jet plane fly across the sky.","空を飛んでるジェット機が見えたよ。"],["I ran across an old friend near the bank.","銀行の近くで、昔の友達にばったり会った。"]]],["across",0,4,1,"…を横断して、を越えて、の向こう側に",[["The post office is just across from the bank.","郵便局は銀行のちょうど真ん前だよ。"],["He reached across the table and shook my hand.","彼はテーブル越しに手を差し出し、私と握手をした。"]]],["act",0,0,1,"行為、幕",[["He acts as if he were a king.","彼はまるで王様のであるかのような振る舞いをする。"],["I'll act as a guide for you.","私があなたの案内役を務めましょう。"]]],["actually",0,3,1,"実際に",[["Is the water in the Black Sea actually black?","黒海の水って、実際に黒いの？"],["He looked calm, but actually he was very nervous.","彼は落ち着いて見えたが、実はとても緊張していた。"]]],["addition",0,0,1,"付け加えること",[["The addition of salt greatly improved the flavor.","塩を加えたら味が大いに良くなった。"],["My boy can't do addition properly yet.","うちの息子はまだちゃんと足し算ができない。"]]],["additional",0,2,1,"付け加えた",[["Our plan has lots of additional advantages.","私たちの計画には、更に多くの利点がございます。"],["How much was the additional charge?","追加料金はいくらだった？"]]],["adjective",0,0,1,"形容詞",[["\"Small\" and \"tiny\" are adjectives.","「小さい」と「ちっちゃい」は形容詞です。"]]],["adjust",0,1,1,"調節する",[["Our eyes take time to adjust to the darkness.","我々の目は暗闇に慣れるのに時間がかかる。"],["She soon adjusted herself to the new school.","彼女はすぐに新しい学校に慣れた。"]]],["admire",0,1,1,"感嘆する",[["I admire a person who expresses a frank opinion.","私は率直に意見を述べる人を尊敬します。"],["They admired the fine view from the hill.","彼らはその丘からの素晴らしい眺めに感嘆した。"]]],["admit",0,1,1,"入れる、認める",[["She doesn't admit that she is in the wrong.","彼女は自分が間違っていることを認めない。"],["Tom won't admit it, but he's in big trouble.","トムは認めようとしないだろうが、彼は大きな問題を抱えている。"]]],["adult",0,2,1,"おとなの、おとな",[["That boy speaks as if he were an adult.","その子は大人のような口を利く。"],["Adult cats are the size of human babies.","大人の猫は、人間の赤ちゃんくらいの大きさです。"]]],["adult",0,0,1,"おとなの、おとな",[["Most young adults enjoy going out at night.","多くの若い成人は、晩に出かけることを好む。"],["Some people think talking back to an adult is rude.","大人に口答えするのは失礼なことだと思っている人もいる。"]]],["advanced",0,2,1,"進出した、前進した、進歩した",[["Our teacher advanced the date of the exam.","先生は試験の日取りを早めた。"],["Advanced countries must give aid to developing countries.","先進国は発展途上国を援助しなければならない。"]]],["advantage",0,0,1,"有利な立場",[["I wonder what the advantage of this technique is.","この技術の利点って何なのかな？"],["It's to your advantage to learn everything you can.","何でも習っておいた方が得ですよ。"]]],["adventure",0,0,1,"冒険",[["He told us a very exciting adventure story.","彼はわくわくするような冒険談をしてくれた。"],["He went traveling in search of adventure.","彼は冒険を求めて旅に出た。"]]],["advertisement",0,0,1,"広告",[["He answered an advertisement in the paper and got the job.","彼は新聞の広告に応募して職を得た。"],["I put an advertisement in the newspaper saying my house was for sale.","新聞に家の売却の広告を出した。"]]],["advertising",0,0,1,"広告;広告業、広告の",[["The company spends a lot of money on advertising.","その会社は広告にたくさんお金をかけている。"],["Tom started an advertising agency.","トムは広告代理店を立ち上げた。"]]],["advice",0,0,1,"忠告",[["I have no one to go to for advice.","私には相談相手がいない。"],["I have no one to turn to for advice.","僕には相談相手がない。"]]],["advise",0,1,1,"忠告する",[["Did you advise him to go to the police?","警察へ行くように言ってくれたの？"],["I advise you not to keep company with Tom.","トムとはつきあわないほうがいいよ。"]]],["affair",0,0,1,"事、事件",[["I have lots of affairs to look after.","私にはしなければならない事がたくさんある。"],["I have nothing to do with the affair.","私はその事件とは何の関係も無い。"]]],["after",0,3,1,"の後に、を求めて、の名をとって",[["Tom is going to pick me up after school.","学校終わったら、トムが車で迎えに来てくれる予定なんだ。"],["What do you plan to do after you retire?","引退した後は何をするつもりなの？"]]],["against",0,4,1,"…に対して、から、にぶつかって",[["As for me, I have nothing against the plan.","私に関して言えば、その計画に異存はありません。"],["He is fighting with his back against the wall.","彼は悪戦苦闘している。"]]],["aged",0,2,1,"歳の",[["She is aged seventeen.","彼女は１７歳です。"]]],["agency",0,0,1,"代理店",[["I work at a travel agency.","私は旅行代理店で働いています。"],["Where is the closest travel agency?","一番近い旅行代理店はどこですか？"]]],["agent",0,0,1,"代理人",[["Get in touch with your agent right away.","すぐにあなたの代理人に連絡を取りなさい。"],["A travel agent arranged everything for our trip.","旅行代理店が全部手配してくれたよ。"]]],["ahead",0,3,1,"前方に、前に",[["You can't get ahead if you don't work hard.","頑張らないと前には進めないんだよ。"],["Can you read that sign ahead of us?","前方にあるあのサインが読めますか。"]]],["air",0,0,1,"空気、空中",[["Air is to us what water is to fish.","魚に水が必要なように、我々には空気が必要である。"],["I need to put some air in the tire.","タイヤに空気をいれなくちゃ。"]]],["aisle",0,0,1,"(教会・劇場・列車・旅客機などの)座席間の通路、側廊(教会堂で本堂(nave)の",[["Could I sit on the aisle?","通路側に座ってもいいですか。"],["Would you like a window seat or a seat on the aisle?","窓側か通路側どちらになさいますか。"]]],["alarm",0,0,1,"警報、警報器",[["Do you have an alarm clock in your room?","自分の部屋に目覚まし時計ってある？"],["All of a sudden, the fire alarm went off.","突然火災警報機が鳴った。"]]],["alarm clock",0,0,1,"目覚まし時計",[["Do you have an alarm clock in your room?","自分の部屋に目覚まし時計ってある？"],["My alarm clock didn't go off this morning.","私の目覚まし時計は今朝鳴らなかった。"]]],["alive",0,2,1,"生きている",[["I don't know if Tom is dead or alive.","トムが生きてるんだか、死んでるんだかは分からない。"],["I don't know whether he is dead or alive.","彼が生きているのか死んでいるのかわからない。"]]],["all",0,3,1,"全体の、全部の、全部",[["Is it all right if I call you Tom?","トムって呼んでもいい？"],["Is it all right if I pay by check?","小切手は使えますか。"]]],["allow",0,1,1,"許す",[["This money will allow me to buy a car.","このお金のおかげで車が買えます。"],["My father won't allow me to keep a dog.","父は、僕が犬を飼うことを許してくれないんです。"]]],["alone",0,2,1,"ひとりで",[["I might not be able to do that alone.","私独りではできないかもしれません。"],["It would be better not to go there alone.","一人ではそこに行かない方がいいよ。"]]],["along",0,4,1,"…をたどって、沿って",[["How are you getting along in your new job?","新しい仕事はうまくいってますか。"],["I found it difficult to get along with him.","彼と付き合っていくのは難しいことがわかった。"]]],["alright",0,2,1,"",[["Would it be alright to come to visit your place soon?","そのうち、あなたのところにお邪魔してもいいですか。"]]],["alright",0,3,1,"",[["Would it be alright to come to visit your place soon?","そのうち、あなたのところにお邪魔してもいいですか。"]]],["although",0,5,1,"ではあるが",[["Although I may be unhappy, I won't commit suicide.","僕は不幸かも知れないけれど自殺はしない。"],["Although the arguments were rational, he was not convinced.","理論は理にかなっていたけれども、彼は納得しなかった。"]]],["ambition",0,0,1,"大望",[["He never forgot his ambition to become a leading politician.","彼は大物政治家になるという野心を忘れたことはなかった。"],["Tom has no ambition.","トムは野心がない。"]]],["among",0,4,1,"…の間に、の中の一つ、一人",[["He believes that there is a spy among us.","私たちの中にスパイがいると彼は信じている。"],["He divided the apples among the five of us.","彼はリンゴを私たち５人に分けてくれた。"]]],["amused",0,2,1,"おもしろがった",[["He amused us with a funny story.","彼はおもしろい話で私達を楽しませた。"],["We amused ourselves by playing games.","私たちはゲームをして楽しんだ。"]]],["amusement",0,0,1,"楽しみ、楽しみごと",[["It took ten years to build the amusement park.","その遊園地を建設するのに１０年かかった。"],["Yesterday, I ran into my teacher at the amusement park.","昨日遊園地でばったり先生に会ったよ。"]]],["ancestor",0,0,1,"先祖",[["Our ancestors arrived in this country 150 years ago.","私たちの先祖は百五十年前この国にたどり着きました。"],["I can trace my ancestors back 200 years.","私は自分の祖先を200年遡ることができる。"]]],["ancient",0,2,1,"古代の",[["You can see the ancient ruins in the distance.","遠くに古代の遺跡が見えるでしょう。"],["He wrote a novel based on ancient myths.","彼は古代神話に基づく小説を書いた。"]]],["angel",0,0,1,"天使",[["A sleeping child looks like an angel.","眠っている子どもというのは天使のようだ。"],["I've only seen an angel once.","一度だけ、天使を見たことがある。"]]],["angrily",0,3,1,"おこって、腹を立てて",[["He angrily tore up the letter from her.","彼は彼女からの手紙を怒って引きさいた。"],["\"Let me alone,\" she said angrily.","「私の事は放っておいてよ」と彼女は怒って言った。"]]],["ankle",0,0,1,"足首",[["Tom broke his left ankle during a rugby match.","トムはラグビーの試合中に左足首を骨折した。"],["Tom broke his ankle when he tripped.","トムね、つまずいた時に足首を折ったんだよ。"]]],["anniversary",0,0,1,"記念日",[["Today is my parents' wedding anniversary.","今日は両親の結婚記念日です。"],["It's our anniversary tomorrow.","明日は僕らの記念日だよ。"]]],["annoy",0,1,1,"困らせる",[["I was annoyed with him for interrupting me.","彼がわたしの邪魔をするのでイライラした。"],["He arrived an hour late, which annoyed me very much.","彼は１時間遅れて到着したが、そのため私はとてもいらいらした。"]]],["annoying",0,2,1,"迷惑な、うるさい",[["I told you Tom was really annoying.","トムはマジでうざいって言ったでしょ。"],["This noise is annoying.","この騒音には苛々する。"]]],["another",0,6,1,"もう一つの、もう一人の、別の",[["Would you like to have another cup of tea?","お茶をもう一杯飲みませんか。"],["I could really go for another cup of coffee.","コーヒーをもう一杯飲みたいな。"]]],["anxious",0,2,1,"気になる、切望して",[["People all over the world are anxious for peace.","世界中の人々が平和を切望している。"],["I'm anxious whether I'll do well at this new job.","新しい職場で上手くやっていけるか不安だなあ。"]]],["anymore",0,3,1,"",[["I don't know if I can take it anymore.","もう、我慢できるかわかんないよ。"],["I used to wear ties, but I don't anymore.","前はネクタイをしてたんだけど、今はもうしないね。"]]],["anyway",0,3,1,"どうしても",[["Why do we need to learn this stuff anyway?","一体どうして私たちがこれを学ぶ必要があるんですか？"],["Anyway, I gave it my best shot.","とにかく全力は尽くしたんだ。"]]],["anywhere",0,3,1,"どこかへ、に、どこへも",[["I have to take a bus to go anywhere.","どこに行くにもバスに乗らなければならないんです。"],["When I was a child, I could sleep anywhere.","子供のころ、どこででも眠ることができた。"]]],["apart",0,3,1,"離れて",[["Apart from the weather, it was a good picnic.","天気は別として、それは楽しいピクニックだった。"],["I can't tell Tom and his younger brother apart.","私にはトムとトムの弟との区別がつかない。"]]],["apartment",0,0,1,"アパート",[["We want to rent an apartment in the city.","街でアパートを借りたいんです。"],["How much rent do you pay for the apartment?","アパートの家賃はいくら払っていますか。"]]],["apologise",0,1,1,"わびる",[["I don't have to apologize for what I said.","私は自分が言ったことに謝る必要などない。"],["He apologized to me for stepping on my foot.","彼は足を踏んだことを私にわびた。"]]],["apologize",0,1,1,"わびる",[["I don't have to apologize for what I said.","私は自分が言ったことに謝る必要などない。"],["He apologized to me for stepping on my foot.","彼は足を踏んだことを私にわびた。"]]],["apparently",0,3,1,"明らかに、見かけは",[["Apparently, the murder happened in a locked room.","一見したところ、この殺人は密室で起こっている。"],["Apparently, Tom likes Mary quite a lot.","どうやら、トムはメアリーのことが大好きらしいよ。"]]],["appear",0,1,1,"姿を現す、見える、思われる",[["He ran for his life when the bear appeared.","彼は熊が現れたとき必死で走った。"],["I waited for an hour, but he didn't appear.","一時間待ったが彼はあらわれなかった。"]]],["appearance",0,0,1,"現れること、外観",[["I can see he is ill by his appearance.","彼の様子から見て病気だということが解る。"],["Her first appearance on the stage was in 1969.","彼女が初舞台を踏んだのは1969年であった。"]]],["apply",0,1,1,"適用する、当てる、適用される",[["I am going to apply for a visa today.","今日、ビザの申請をするつもりです。"],["There are some cases where this rule doesn't apply.","このルールは適用されない場合がある。"]]],["appointment",0,0,1,"約束、任命",[["Can I make an appointment for a haircut today?","今日、カットの予約はできますか？"],["I have an appointment with him for five-thirty.","５時半に彼と会う約束がある。"]]],["appreciate",0,1,1,"認める、味わう",[["Thank you very much for that. I appreciate it.","どうもありがとうございます。感謝しています。"],["I would appreciate a reply as soon as possible.","なるべく早くご返事いただければ幸いです。"]]],["appropriate",0,2,1,"適当な",[["These clothes are not appropriate for a cold winter day.","この服は寒い冬の日には向かない。"],["Your speech was appropriate for the occasion.","あなたのスピーチはあの場にふさわしいものだった。"]]],["architecture",0,0,1,"建築術、建築学",[["I majored in architecture in college.","大学では建築学を専攻してたよ。"]]],["area",0,0,1,"面積、地域、地方",[["Do I have to dial the area code, too?","市外局番もいるの？"],["It's an area with a lot of new houses.","そこは新しい家がたくさんあるエリアです。"]]],["argue",0,1,1,"議論する、説得する",[["Tom and Mary used to argue all the time.","トムとメアリーって、前はしょっちゅう口喧嘩してたんだ。"],["I don't think it's wise to argue with Tom.","トムに反論するのは賢明じゃないと思うよ。"]]],["argument",0,0,1,"論争、口論、論拠、理由(reason)",[["Although the arguments were rational, he was not convinced.","理論は理にかなっていたけれども、彼は納得しなかった。"],["Since our argument, Tom has kept his distance.","私たちが言い争って以来、トムは距離を置くようになった。"]]],["armchair",0,0,1,"ひじ掛けいす",[]],["armed",0,2,1,"武装した、(ある目的のために)用意した",[["They armed themselves with rifles.","彼らはライフルで武装していた。"]]],["around",0,3,1,"の周りに、を、…のあちこちに",[["This is a bit too tight around my neck.","これは首まわりがすこしきつすぎる。"],["There used to be a big pond around here.","以前は、この辺りに大きな池があったんです。"]]],["artificial",0,2,1,"人造の、人工の",[["We skied on artificial snow.","私たちは人工雪でスキーをした。"],["I don't like artificial flowers.","私は造花が好きではない。"]]],["as",0,5,1,"同じくらい、同様に、…ほど",[["I felt as if I were in a dream.","まるで夢を見ているようだった。"],["I ran as fast as I was able to.","私は出来るだけ速く走った。"]]],["asleep",0,2,1,"眠って",[["As soon as I sat down, I fell asleep.","座るや否や、眠りに落ちてしまった。"],["I had my wallet stolen while I was asleep.","眠っている間に財布を盗まれた。"]]],["assistant",0,2,1,"助手",[["He trusts his assistant quite a lot.","彼は助手を非常に信頼している。"],["I'll be working as your assistant.","僕はあなたのアシスタントとして働きます。"]]],["association",0,0,1,"交際、連合、共同",[["My association with him did not last long.","彼とのつきあいは長く続かなかった。"],["My association with them didn't last long.","彼らとのつきあいは長く続かなかった。"]]],["astronaut",0,0,1,"宇宙飛行士",[["Tom has a friend whose father is an astronaut.","トムの友達には、父親が宇宙飛行士をしている人がいる。"],["Do you want to be an astronaut?","宇宙飛行士になりたいですか？"]]],["athlete",0,0,1,"競技者、運動家;強壮な人;陸上競技選手",[["He seems to have been a great athlete.","彼はすごいスポーツ選手だったらしい。"],["It seems that Tom used to be a great athlete.","トムはすごいスポーツ選手だったらしいよ。"]]],["atom",0,0,1,"原子",[["A water molecule has two hydrogen atoms and one oxygen atom.","水分子は、２個の水素原子と１個の酸素原子からなる。"],["A molecule of water is made up of one oxygen and two hydrogen atoms.","水分子は一個の酸素原子と二個の水素原子から出来ています。"]]],["attack",0,0,1,"攻撃",[["The cause of death was a heart attack.","死因は心臓発作だった。"],["The enemy kept up the attack all night.","敵は夜通し攻撃を続けた。"]]],["attack",0,1,1,"襲う、攻撃する、非難する",[["What did you do when those people attacked you?","あの人たちに襲われた時、あなたどうしたの？"],["Tom got attacked by a swarm of bees.","トムがハチの群れに襲われたんだ。"]]],["attempt",0,0,1,"企て",[["He gave up his attempt once and for all.","彼はきっぱりと企てを諦めた。"],["He failed in his attempt to swim across the river.","彼はその川を泳いで渡ろうと試みたが失敗した。"]]],["attention",0,0,1,"注意、注意力、世話、思いやり",[["You should pay more attention to what you say.","あなたは自分の言うことにもっと注意を払うべきです。"],["Don't pay any attention to what your father says.","君のお父さんが言う ike food, is a basic human need.","空気は食べ物と同様、人間が根本的に必要とするものだ。"],["This course teaches basic skills in first aid.","この講座では応急手当の基本的な技能を教えます。"]]],["basically",0,3,1,"基本的に、根本的に;元来は",[["I basically prefer being by myself.","私、基本的に一人でいる方が好きなんです。"],["Basically, I agree with your opinion.","基本的にあなたの意見に賛成です。"]]],["basket",0,0,1,"かご、バスケット",[["Half of the bananas in the basket were rotten.","かごの中のバナナの半分は腐っていた。"],["Don't put all your eggs in one basket.","卵をすべて一つのかごに入れるな。"]]],["batch",0,0,1,"(パンなどの)一焼き分、(…の)1度分の[の分量]",[]],["battery",0,0,1,"電池",[["I have to change the batteries in the radio.","ラジオの電池を交換しなくちゃ。"],["The clock has stopped. It needs a new battery.","時計が止まっちゃったんだ。電池交換しないといけないな。"]]],["bay",0,0,1,"湾、入り江",[["We were granted the privilege of fishing in this bay.","我々はこの湾内で漁獲する特権を与えられた。"],["The bay has more yachts than sailboats.","湾にはセーリングボートよりヨットがたくさんある。"]]],["bear",0,1,1,"産む、つける、結ぶ",[["Is this ladder strong enough to bear my weight?","このはしごはわたしの体重を支えるのに十分なほど丈夫なのですか。"],["A bear will not touch a dead body.","熊は死体には触れないものだ。"]]],["beauty",0,0,1,"美しさ、美点、美人",[["She plans to take part in the beauty contest.","彼女は美人コンテストに参加するつもりだ。"],["My mother has gone to the beauty shop.","母は美容院に行っています。"]]],["been",0,9,1,"beの過去分飼形",[["She has been sick in bed for a week.","彼女は病気で１週間寝込んでいる。"],["He has been ill in bed for four days.","彼は、病気で４日間ずっと寝ている。"]]],["beer",0,0,1,"ビール",[["I only drink one can of beer a week.","缶ビールは週に1本しか飲まないよ。"],["How much does a six-pack of beer cost?","ビール６缶パックは、おいくらですか？"]]],["before",0,5,1,"の前に、より前に、よりまさって",[["I make a point of getting up before six.","６時前には起きるようにしてるんだ。"],["I'll give you a call before I visit you.","そっちへ行く前に電話するね。"]]],["beg",0,1,1,"くださいと頼む、懇願する、施しを請う",[["I beg your pardon. What did you say?","すみません、何とおっしゃいましたか？"],["I beg your pardon. I didn't quite catch your name.","もう一度おっしゃって下さいませんか。お名前がはっきりと聞き取れなかったものですから。"]]],["beginner",0,0,1,"初学者、初心者、創始者",[["Tom is a beginner, but he catches on fast.","トムは初心者だが飲み込みが速い。"],["Do you have a course for beginners?"," usic is not my cup of tea.","クラシック音楽は僕の好みじゃない。"],["Some people like classical music, while others like popular music.","クラシック音楽が好きな者もいれば、ポップスが好きな者もいる。"]]],["cleaner",0,0,1,"掃除機、(またcleaner's)クリーニング屋(店)",[["I have to take my suit to the cleaners.","スーツをクリーニングに出さなきゃ。"],["Look. My house is cleaner than yours.","見てごらんなさい。私の家の方がお宅よりも奇麗ですよ。"]]],["clear",0,2,1,"分かりやすい",[["I told him to clear out of the room.","私は彼に部屋から出て行くように言った。"],["I went for a drive to clear my head.","気分転換にドライブしてきた。"]]],["clearly",0,3,1,"はっきりと、疑いもなく",[["I think to clearly distinguish opinion from fact is important.","「事実」と「意見」を峻別するということは重要なことだと思います。"],["It is too dark to see clearly.","暗すぎてはっきりと見えない。"]]],["clerk",0,0,1,"書記、店員",[["All of a sudden, the clerk lost his temper.","突如その職員がキレた。"],["She is a clerk in the supermarket.","彼女はスーパーマーケットの店員である。"]]],["click",0,1,1,"カチリと音がする",[["If the screen doesn't change automatically, please click here.","画面が自動で切り替わらない場合は、こちらをクリックしてください。"],["Please click the \"Save\" button to start downloading.","ダウンロードを開始するには「保存」ボタンをクリックしてください。"]]],["climb",0,1,1,"よじ登る、上がっている",[["Tom climbed into bed and turned off the light.","トムはベッドに潜り込むと明かりを消した。"],["Mountain climbing isn't something I really enjoy so much.","私は山登りはそんなに楽しくないんです。"]]],["climbing",0,0,1,"登る、はい登る、登ること、登山",[["Mountain climbing isn't something I really enjoy so much.","私は山登りはそんなに楽しくないんです。"],["Last week, Tom and I went rock climbing.","先週さ、トムとロッククライミングに行ったんだ。"]]],["clone",0,1,1,"クローン(一個体から無性生殖で増殖した有機体群);(植物の)栄養系、(動物の)分",[]],["clown",0,0,1,"(サーカスなどの)道化、道化役[者]、(集団の中の)おどけ者",[["The clown fell down on purpose.","そのピエロはわざと転んだ。"]]],["clue",0,0,1,"手がかり、糸口",[["I have no clue what Tom is talking about.","トムが一体何の話をしているのか、私にはさっぱり分からない。"],["We have no clue where he is.","杳として行方が知れない。"]]],["coast",0,0,1,"海岸",[["The island is about two miles off the coast.","その島は海岸から約２マイル離れた沖にあります。"],["It's about three kilometers from here to the coast.","ここから海岸までは大体3kmくらいです。"]]],["coin",0,0,1,"硬貨",[["He published the book about the history of coins.","彼はコインの歴史に関する本を出した。"],["He took a coin out of his pocket.","彼はコインを１枚ポケットから取り出した。"]]],["cola",0,0,1,"コーラの木(熱帯産の木)、コーラの木の実からつくった炭酸飲料(Coca-Cola",[["This cola has gone flat and doesn't taste good.","このコーラ、炭酸が抜けちゃっておいしくない。"],["I used to drink a lot of cola, but now I only drink water.","私はかつてコーラを沢山飲んでいたが、今は水しか飲まない。"]]],["colorful",0,2,1,"色彩に富んだ、多彩な、はなやかな、(情景・場面などが)絵画的な、変化に富む;(描",[["I saw a boy with colorful shoes.","カラフルな靴を履いた男の子を見たんだ。"],["Why are butterflies so colorful?","どうして蝶々って、あんなにカラフルなんだろう。"]]],["colourful",0,2,1,"色彩に富んだ、多彩な、はなやかな、(情景・場面などが)絵画的な、変化に富む;(描",[["I saw a boy with colorful shoes.","カラフルな靴を履いた男の子を見たんだ。"],["Why are butterflies so colorful?","どうして蝶々って、あんなにカラフルなんだろう。"]]],["column",0,0,1,"円柱、円柱状の物、欄",[["The columns were made of marble.","柱は大理石で作られていた。"],["I found this column interesting.","このコラムは面白かった。"]]],["comb",0,0,1,"くし",[["Lend me your comb for a minute, will you?","ちょっとだけそのクシ貸してくれない？"],["Do you want me to comb your hair?","髪を梳かしましょうか？"]]],["comfortable",0,2,1,"気持ちのよい",[["Even though this chair was cheap, it's very comfortable.","この椅子は安かったんだけど、めっちゃ座り心地がいいんだ。"],["This chair is really comfortable to sit on.","この椅子は座っていると、本当に気持ちいい。"]]],["comic",0,2,1,"喜劇の、喜劇的な、こっけいな、おかしな、おどけた",[["I've loved comic books since I was a kid.","子供の頃から、漫画が大好きなんだ。"],["The comic books were piled on the desk.","机の上には漫画本が重ねてあった。"]]],["comic",0,0,1,"喜劇の、喜劇的な、こっけいな、おかしな、おどけた",[["Tom spends most of his free time reading comics.","トムは空いている時間のほとんどを、漫画を読むことに使っている。"],["I borrowed this comic from his sister.","この漫画、あいつの姉ちゃんに貸してもらったんだ。"]]],["commitment",0,0,1,"約束、献身",[["You want commitment, don't you?","確約が欲しいんだね。"]]],["committee",0,0,1,"委員会",[["Tom was hoping the committee would adopt his proposal.","トムは委員会が彼の提議を承認することを望んでいた。"],["The committee is made up of ten members.","その委員会は１０人のメンバーで構成されている。"]]],["common",0,2,1,"共通の、一般の、普通の",[["We may have more in common than you think.","君が思ってるよりも僕らは共通点があるのかもね。"],["They have nothing in common with the older generation.","彼らは年上の世代と何の共通点もない。"]]],["communicate",0,1,1,"伝える、通信する",[["Tom says he's able to communicate with the dead.","トムは死者と交信することができると言っている。"],["We can communicate with each other in many ways.","私たちは様々な方法で、お互いの意思疎通を図ることができます。"]]],["communication",0,0,1,"伝達、通信",[["What changes the world is communication, not information.","世界を変えるのは情報ではなくコミュニケーションだ。"],["Their communication may be much more complex than we thought.","彼らのコミュニケーションは我々が考えてきたものよりはるかに複雑かもしれません。"]]],["company",0,0,1,"来客、会社、仲間",[["A man is known by the company he keeps.","付き合う仲間を見れば、その人がわかるものだ。"],["I advise you not to keep company with Tom.","トムとはつきあわないほうがいいよ。"]]],["comparative",0,0,1,"比較の",[]],["compare",0,1,1,"比較する、比べる、たとえる",[["They compared the new car with the old one.","彼らは新しい車と古い車を見比べた。"],["There are those who compare life to a stage.","人生を舞台にたとえる人もいる。"]]],["competition",0,0,1,"競争",[["Competition in itself is not a bad thing.","競争それ自体は悪くない。"],["Competition for the position is very intense.","ポスト争いは厳しい。"]]],["complain",0,1,1,"不平を言う",[["Tom always seems to find something to complain about.","トムはいつも不平を言うものを探しているみたいだ。"],["Tom is always complaining about how much Mary spends.","トムはいつもメアリーのお金の使い方について愚痴をこぼしている。"]]],["complaint",0,0,1,"不平",[["I don't want to hear any of your complaints.","君の愚痴なんて聞きたくないんだよ。"],["He turned a deaf ear to their complaints.","彼は彼らの不平に耳をかそうとしなかった。"]]],["complete",0,2,1,"全部の、完全な",[["There was complete silence. You could hear a pin drop.","あたりは水を打ったように静かだった。"],["We should be able to complete the work in five days.","５日たてば仕事が完了するだろう。"]]],["composer",0,0,1,"作曲家",[["I think Beethoven is the greatest composer who ever lived.","歴史上最も偉大な作曲家はベートーヴェンだと思っています。"]]],["concentrate",0,1,1,"集中する",[["Don't look out the window. Concentrate on your work.","窓から外を見るんじゃないぞ。仕事に集中しろ。"],["I can't concentrate on my work because of the noise.","音が気になって仕事に集中できないんだ。"]]],["concern",0,0,1,"関係、関心",[["It concerns all the people living there.","そこに住んでいる人すべてに関わりがある。"],["The matter does not concern me.","そのことは、私には関係ありません。"]]],["condition",0,0,1,"状態、状況",[["Please inform me of any change in his condition.","彼の容態が少しでも変わったら知らせてください。"],["There is an urgent need for improved living conditions.","生活水準の向上が急務である。"]]],["confident",0,2,1,"自信のある",[["We were confident that we would win the game.","私達は、試合には勝つと確信していた。"],["I'm confident that I'll win the tennis match.","僕はこのテニスの試合に勝てるという確信がある。"]]],["confuse",0,1,1,"混同する、とまどわせる",[["You should not confuse business with personal affairs.","公私を混同してはいけない。"],["Sorry, I seem to have confused you.","すみません、どうやら混乱させてしまったようですね。"]]],["confused",0,2,1,"困惑した、まごついた、ごっちゃになった、混乱した;(思考・言葉など)支離滅裂の",[["Sorry, I seem to have confused you.","すみません、どうやら混乱させてしまったようですね。"],["I was very confused by his questions.","彼の質問にひどく面食らってしまった。"]]],["consequence",0,0,1,"結果",[["We have to live with the consequences of our actions.","私たちは自分の行動が招いた結果を受け入れなければならない。"],["We have to live with the consequences of our choices.","私たちは自分が選択した結果を甘受しなければならない。"]]],["consider",0,1,1,"よく考える、みなす、考慮に入れる",[["I'm considering studying in the United States next year.","来年アメリカに留学しようかと思っています。"],["Tom often eats things that other people consider strange.","トムはよく変なものを食べる。"]]],["consist",0,1,1,"成る",[["My family consists of my father, mother, and sister.","父と母と妹がいます。"],["A human body consists of a countless number of cells.","人体は無数の細胞からなっている。"]]],["contact",0,0,1,"接触、連絡",[["We will contact you as soon as we know.","分かり次第お電話いたします。"],["Please feel free to contact me at any time.","いつでもご連絡ください。"]]],["contact",0,1,1,"接触、連絡",[["When you contact me, please do so by phone.","連絡するなら電話でお願いします。"],["At last, we made contact with the police.","やっと警察と連絡がとれた。"]]],["container",0,0,1,"容器、入れ物(箱・かんなど);(貨物輸送用の)コンテナ",[["These containers are airtight.","こちらの容器は密閉式です。"]]],["context",0,0,1,"(文章の)前後関係、文脈、(事の)周囲の情況、背景",[["It depends on the context.","それは文脈による。"],["That depends on the context.","それは文脈次第だね。"]]],["continent",0,0,1,"大陸",[["They crossed the vast continent on foot.","彼らは徒歩でその広大な大陸を横断した。"],["Africa was once called the Dark Continent.","アフリカはかつて、暗黒大陸と呼ばれた。"]]],[ ow.","うちの息子は百まで数えられるんだ。"],["He can count up to ten with his fingers.","彼は指で10まで数えることができる。"]]],["country",0,0,1,"国、国家、国民、祖国",[["It's hard to get a job in this country.","この国で職を得るのは難しいですよ。"],["We are not short of oil in this country.","この国の石油は不足していない。"]]],["countryside",0,0,1,"いなか",[["We spent a peaceful day in the countryside.","我々は田舎で穏やかな一日を過ごした。"],["Tom and Mary took a long walk through the countryside.","トムとメアリーは田舎道を長時間散歩した。"]]],["couple",0,0,1,"2個、夫婦",[["I used to play with a couple of boys.","かつて私は２、３人の少年とよく遊んだものだ。"],["Tom and I each ate a couple of bananas.","僕とトムはバナナを2本ずつ食べたよ。"]]],["court",0,0,1,"中庭、コート、宮廷",[["Are you on your way to the tennis court?","テニスコートに行くの？"],["The court declared him innocent on the charge of murder.","法廷は彼のその殺人容疑について無罪とした。"]]],["cover",0,1,1,"表面をおおう、及ぶ",[["He was covered in mud from head to foot.","彼は全身泥まみれだった。"],["The top of the mountain is covered in snow.","その山の頂は雪に覆われている。"]]],["crazy",0,2,1,"狂気の、途方もない",[["How did you come up with this crazy idea?","こんな馬鹿げた考えをどうやって思いついたんだ？"],["I find it crazy that Tom did that.","私はトムがそれをやったことが不思議だ。"]]],["cream",0,2,1,"クリーム、クリーム菓子",[["I don't like eating ice cream in the winter.","冬にアイスクリームを食べるのは嫌だ。"],["Do you want to eat some ice cream?","アイス食べる？"]]],["create",0,1,1,"創造する、創作する、引き起こす",[["I'm interested in creating my own web pages.","私は自分のホームページを作ることが趣味です。"],["Your behavior is creating a lot of problems.","君の振る舞いは多くの問題を引き起こしている。"]]],["creative",0,2,1,"独創的な",[["I used to be more creative.","昔はもっと創造性豊かだったんだけどね。"],["Tom is a very creative person.","トムはとても創造性のある人だ。"]]],["creativity",0,0,1,"独創性",[["Language acquisition requires creativity.","言語習得には創造力が必要だ。"]]],["creature",0,0,1,"生物",[["I'm just a creature of habit, I guess.","どうしても習慣から抜けきれないんだよなあ。"],["Are you a creature of habit?","あなたは習慣の奴隷ですか？"]]],["credit",0,0,1,"信用、信望、賞賛",[["I usually use a credit card instead of cash.","普段は現金じゃなくてクレカを使うんだ。"],["I paid for it with a credit card.","クレジットカードで払いました。"]]],["cricket",0,0,1,"コオロギ、クリケット(英国の球技で11人のチーム2組で行う)",[ "We had a good deal of rain last summer.","去年の夏は雨が多かった。"],["We had a good deal of snow last winter.","去年の冬は雪が多かった。"]]],["death",0,0,1,"死",[["It makes me sad to think of his death.","彼の死を考えると私は悲しくなる。"],["His death was a great loss to our firm.","彼の死は我が社にとって大きな痛手であった。"]]],["debate",0,0,1,"討論、論争",[["His proposal started a debate that lasted a year.","彼の提案は一年間に渡って議論された。"],["He participated in the debate.","彼はその討論に参加した。"]]],["decide",0,1,1,"解決する、決心する、決定する",[["It's up to you to decide what to do.","何をするかを決めるのは、あなたに任せます。"],["I've decided to study as hard as I can.","もっと一生懸命勉強しようと心に決めました。"]]],["deep",0,3,1,"深い、深く、深い所",[["How do you know how deep the lake is?","どうして湖の深さが分かるの？"],["The baby seemed to be in a deep sleep.","その赤ちゃんはぐっすり眠っているようだった。"]]],["deeply",0,3,1,"深く",[["He was deeply moved by the story.","彼はその話に深く感動した。"],["I was deeply moved by his speech.","私は彼の話に深く感動した。"]]],["degree",0,0,1,"程度、学位、度",[["I have a cold and a temperature of 38 degrees.","かぜで熱が三十八度あります。"],["An angle of 90 degrees is called a right angle.","９０度の角度は直角と呼ばれている。"]]],["delay",0,0,1,"遅れ、延期",[["I apologize for the delay in sending the agenda.","議題の送付が遅くなり、申し訳ございません。"],["I'm sorry for the delay in my reply.","お返事が遅れまして、申し訳ありません。"]]],["dentist",0,0,1,"歯科医",[["I want to be a dentist in the future.","私は将来歯医者になりたい。"],["\"Where have you been?\" \"I've been to the dentist.\"","「何処に行っていたの？」「歯医者に行っていたのだ」"]]],["department store",0,0,1,"百貨店、デパート",[["I got a new hat at the department store.","デパートで新しい帽子を買った。"],["I usually buy my clothes at the department store.","普段はあのデパートで服を買うんです。"]]],["depend",0,1,1,"頼る",[["Whether we go or not depends on the weather.","行くか行かないかは天気次第です。"],["The prosperity of a country depends upon its citizens.","国家の繁栄は市民の手にかかっている。"]]],["description",0,0,1,"記述、描写",[["He gave a minute description of the dinner party.","彼はディナーパーティーについて詳細な説明をした。"],["The man answers to the description in the newspaper.","あの男は新聞の記述と一致する。"]]],["desert",0,0,1,"砂ばく、住む人のない",[["Camels are often used to travel in the desert.","ラクダは砂漠を旅するのに屡々用いられている。"],["We ran out of gas in the middle of the desert.","砂漠の真ん中で私たちの車はガス欠になった。"]]],["dessert",0,0,1,"デザート",[["Tom was eating his dessert when the phone rang.","電話が鳴ったとき、トムはデザートを食べていた。"],["I'm trying to save room for dessert.","食後のデザートのために食べ過ぎないようにしてるの。"]]],["destroy",0,1,1,"破壊する",[["All of the town was destroyed by a fire.","町中、焼け野原となった。"],["The town was destroyed by the flood after the storm.","町は嵐の後の洪水で破壊された。"]]],["detail",0,0,1,"細部、細目、詳細",[["Could you send me more details by email?","もしよかったらeメールでもっと詳細を送ってもらえますか？"],["He explained in detail what he had seen.","彼は自分が見たものを詳しく説明した。"]]],["develop",0,1,1,"生じさせる、発展させる、開発する",[["I want this photograph developed as soon as possible.","至急この写真を現像してほしいのですが。"],["Advanced countries must give aid to developing countries.","先進国は発展途上国を援助しなければならない。"]]],["developed",0,2,1,"",[["I want this photograph developed as soon as possible.","至急この写真を現像してほしいのですが。"],["Can I have this film developed?","このフィルムを現像してもらえますか。"]]],["diamond",0,0,1,"ダイヤモンド",[["This may not be a real diamond.","これは本物のダイヤではないかもしれない。"],["Nothing is as hard as a diamond.","ダイヤモンドほど硬いものはない。"]]],["diary",0,0,1,"日記",[["He decided to write in his diary every day.","彼は毎日、日記をつける決心をした。"],["She continued writing in her diary until she died.","彼女は死ぬまで日記を書きつづけた。"]]],["die",0,1,1,"死ぬ、枯れる",[["It is a pity that he died so young.","彼がそんなに若くして亡くなったのは残念です。"],["I almost died a year and a half ago.","一年半前、私はもう少しで死ぬところだった。"]]],["diet",0,0,1,"議会、飲食物、規定食",[["I’m on a diet at the moment.","今ダイエット中なの。"],["I always try to eat a healthy diet.","いつも体にいい食事を摂るように心がけています。"]]],["differently",0,3,1,"異なって",[["I now view life differently than I used to.","以前とは人生観も変わった。"],["I would act differently in your place.","俺だったら、違う行動を取るけどな。"]]],["difficulty",0,0,1,"難しさ、困難なこと、困難な状況",[["I had a little difficulty in getting a taxi.","タクシーを拾うのに少々苦労した。"],["Did you have any difficulty in finding my house?","私の家って、見つけるの難しかった？"]]],["digital camera",0,0,1,"",[["I want to learn how to use my new digital camera right away.","新しいデジカメを早く使いこなせるようになりたい。"]]],["dinosaur",0,0,1,"恐竜(中生代の巨大な爬虫類(はちゅうるい)動物の総称)",[["Dinosaurs died out a very long time ago.","太古の昔、恐竜は死に絶えた。"],["Dinosaurs used to rule the earth.","かつては恐竜が地球を支配していた。"]]],["direct",0,2,1,"まっすぐな、直接の、率直な",[["Store in a cool place, away from direct sunlight.","直射日光の当たる場所は避け、涼しい場所で保管してください。"],["Can you direct me to the post office?","郵便局へ行く道を教えてくれませんか。"]]],["direction",0,0,1,"方向、傾向、監督",[["A stranger asked me for directions to the school.","知らない人が、学校へ行く道を聞いてきたの。"],["The police officer gave me directions to the station.","おまわりさんが駅までの道を教えてくれました。"]]],["director",0,0,1,"指導者、重役、監督",[["He is acting for the chief director.","彼が理事長の代行をしている。"],["The board of directors is going to discuss the proposal next Tuesday.","来週の火曜日に役員会がその提案を検討することになっている。"]]],["disadvantage",0,0,1,"不利な立場、不利",[["Each programming language has its advantages and disadvantages.","どのプログラミング言語も一長一短だ。"],["It has too many disadvantages.","デメリットが多すぎます。"]]],["disagree",0,1,1,"一致しない、意見が合わない",[["This is the reason I disagree with you.","こういうわけで私はあなたに反対なのです。"],["My parents and I disagree on a lot of things.","親とよく意見が食い違います。"]]],["disappear",0,1,1,"見えなくなる",[["Tom walked away and soon disappeared into the fog.","トムは立ち去り、すぐに霧の中へと姿を消した。"],["Before long, the ghost disappeared into a thick fog.","やがて幽霊は深い霧の中へと消えていった。"]]],["disappointed",0,2,1,"当ての外れた、失望した、落胆した",[["I am disappointed that my friend is not here.","友達がここにいないのでがっかりだ。"],["I was very disappointed when I heard the news.","私はその知らせを聞いて非常にがっかりした。"]]],["disappointing",0,2,1,"失望させるような、意外につまらない",[["To sum up, we can say that his new novel is disappointing.","要するに、彼の新しい小説は期待はずれのつまらない作品と言える。"],["His new film is disappointing.","彼の新しい映画にはがっかりだ。"]]],["disco",0,0,1,"discotheque",[["She kept dancing at the disco all night.","彼女はディスコで一晩中、踊り続けた。"],["Tom likes disco music.","トムはディスコミュージックが好きだ。"]]],["discover",0,1,1,"発見する",[["Cancer can be cured if discovered in time.","発見が間に合えば、ガンは治療できる。"],["Oil has been discovered under the North Sea.","北海の海底で石油が発見されている。"]]],["discussion",0,0,1,"議論",[["We arrived at an agreement after two hours' discussion.","我々は２時間の討議の後に合意に達した。"],["Are you interested in participating in this discussion, Tom?","トム、この討論への参加に興味ある？"]]],["dishonest",0,2,1,"不正直な",[]],["dislike",0,0,1,"嫌いなこと",[["I dislike living in such a noisy place.","こんなうるさい場所に住むのは嫌です。"],["I know that Tom dislikes me, but I don't care.","トムが僕のこと嫌いなのは知ってるけど、気にしてないよ。"]]],["display",0,0,1,"見せること、誇示、展示",[]],["disturb",0,1,1,"かき乱す、不安にする、邪魔をする",[["Don't disturb her. She is at work right now.","彼女の邪魔をするな。彼女は今、仕事中だ。"],["I'll do my best not to disturb your studying.","あなたの勉強を邪魔しないようにします。"]]],["divide",0,1,1,"分ける、分け合う、分離する",[["He divided the apples among the five of us.","彼はリンゴを私たち５人に分けてくれた。"],["We divided ten dollars among the five of us.","１０ドルを私たち５人で分けた。"]]],["dizzy",0,2,1,"(人が)めまいがする、ふらふらする、(場所・状況などが)めまいを起こさせる、目を",[["I get dizzy spells when I stand up.","立ちくらみがします。"],["Have you ever felt dizzy on a plane?","飛行機でめまいを感じたことはありますか？"]]],["done",0,9,1,"doの過去分詞、仕上がった、完成した",[["I will get the work done in a week.","１週間でその仕事をやり遂げましょう。"],["There is too much that needs to be done!","やらなければならない事がありすぎる！"]]],["double",0,2,1,"2倍の、二重の",[["The price is double what it was last year.","価格は去年の２倍になっている。"],["I need to do something about this double chin.","この二重あごをなんとかしたいのよ。"]]],["doubt",0,0,1,"疑い、疑う",[["I doubt that Tom will get here on time.","トムが時間通りにここに来るとは思えない。"],["I began to doubt the accuracy of his statement.","私は彼の陳述の正確さを疑い始めた。"]]],["down",0,4,1,"…下へ、下(しも)手へ、下がって",[["I saw the man knocked down by a car.","私はその男が車にはねられるのを見た。"],["As soon as I sat down, I fell asleep.","座るや否や、眠りに落ちてしまった。"]]],["download",0,1,1,"",[["Please click the \"Save\" button to start downloading.","ダウンロードを開始するには「保存」ボタンをクリックしてください。"],["The download is complete.","ダウンロードが完了しました。"]]],["downstairs",0,3,1,"階下へ、に、階下の",[["She came downstairs with a letter in her hand.","彼女は手紙を手に、階下へ降りてきた。"],["Wait for me downstairs. I'll be there in a minute.","下の階で待ってて。すぐ行くから。"]]],["downtown",0,3,1,"(都市の中心の)商業地区へ(で)、町の中心街へ(で)、商業地区の(にある)、町の",[["Are you sure you want to move downtown?","本当に都心に引っ越ししたいのか？"],["Please tell me which bus to take to go downtown.","繁華街へ行くにはどのバスに乗ったらいいですか。"]]],["draw",0,0,1,"引いて",[["I don't know how to draw a bird.","鳥の描き方がわからない。"],["Tom can't draw as well as I can.","トムは私ほど上手に絵を描けない。"]]],["drawer",0,0,1,"引き出し",[["I also put my pens in the drawer.","ペンも引き出しに収めました。"],["Tom helped Mary move the chest of drawers.","トムは、メアリーがタンスを動かすのを手伝った。"]]],["drawing",0,0,1,"線で描くこと、絵、スケッチ",[["Tom was sitting at his desk, drawing a picture.","トムは机に座って絵を描いていた。"],["She succeeded in drawing the truth from him.","彼女はうまく彼から真実を聞きだした。"]]],["dream",0,1,1,"夢を見る、夢想する、夢に見る",[["Mary had a dream that she won the lottery.","メアリーは宝くじに当たる夢を見た。"],["I never dreamed that I would meet you here.","こんなところで君に会うなんて夢にも思わなかったよ。"]]],["dress",0,1,1,"服を着せる、服を着る",[["She selected a hat to match her new dress.","彼女は新しいドレスに合う帽子を選んだ。"],["This is a dress that Mary made by herself.","これはメアリーが自分で作った服です。"]]],["dressed",0,2,1,"",[["That guy over there dressed in black is Tom.","向こうにいる黒服のあいつがトムだよ。"],["Where are you going all dressed up like that?","そんなおめかししてどこ行くの？"]]],["drill",0,0,1,"きり、ドリル、反復練習",[["We had a fire drill at school today.","今日、学校で避難訓練をしました。"],["We had a fire drill yesterday.","私たちは昨日防火訓練をした。"]]],["drive",0,1,1,"追い立てる、運転する、車を運転する",[["Would you like to go for a drive now?","今からドライブに行きませんか。"],["How far can you drive your car on empty?","ガソリンランプがついてから、どれくらい走れるの？"]]],["driver's license",0,0,1,"運転免許証(driving license)",[["I'm not old enough to get a driver's license.","僕はまだ運転免許を取れる年齢じゃないんだよ。"],["Tom showed his driver's license to the police officer.","トムは、警察官に運転免許証を見せました。"]]],["driving licence",0,0,1,"車を運転する人、運転手",[["Show me your driving license, please.","免許証を見せてください。"]]],["drop",0,0,1,"したたる、落ちる",[["Drop in at my house any time you want.","いつでも家に遊びにおいで。"],["I'm going to drop in on her next week.","来週彼女のところに立ち寄るつもりだ。"]]],["drug",0,0,1,"薬、麻薬",[["He was dropped from the team for using drugs.","彼は麻薬の使用でチームからはずされた。"],["The woman suspected that her son was using drugs.","その女性は息子の薬物使用を疑った。"]]],["drugstore",0,0,1,"ドラッグストア",[["The drugstore is at the end of this road.","ドラッグストアなら、この道のつきあたりですよ。"],["I need to buy some things at the drugstore.","ドラッグストアで買わなきゃいけないものがあるの。"]]],["dry",0,1,1,"乾かす、乾く",[["I dried myself with the towel Tom handed me.","トムが取ってくれたタオルで体を拭いたよ。"],["The paint on the door isn't dry yet.","このドアのペンキはまだ乾いていない。"]]],["duck",0,0,1,"アヒル、カモ",[["There are a lot of ducks in the park.","公園にね、たくさんのアヒルがいるんだ。"],["There are a lot of ducks swimming in the pond.","池にはたくさんのアヒルが泳いでいます。"]]],["during",0,4,1,"…の間ずっと",[["Do you have any free time during the week?","その週のどこかで空いてる時間ある？"],["During the war, we had to do without sugar.","戦時中は、お砂糖なしでやってたのよ。"]]],["dust",0,0,1,"ちり",[["The empty house was full of dust.","その空き家はほこりでいっぱいだった。"],["All the furniture was covered with dust.","家具はすべてほこりをかぶっていた。"]]],["early",0,2,1,"早い、初期の",[["I take it that we are to come early.","私たちは早く来いってことね。"],["I don't get up as early as my mother.","私は母ほど早く起きません。"]]],["earn",0,1,1,"かせぐ",[["He earns three times as much as I do.","彼は私の三倍も稼ぐ。"],["She earns half as much money as her husband.","彼女は夫の半分のお金をかせぐ。"]]],["earring",0,0,1,"イヤリング、耳飾り",[["I lost one of my earrings.","ピアスの片方をなくしちゃった。"],["One of my earrings is missing.","ピアスが１つどっか行っちゃった。"]]],["earth",0,0,1,"地球、地、土",[["The earth is a lot larger than the moon.","地球は月よりもずっと大きい。"],["The earth is similar to an orange in shape.","地球は形がオレンジに似ている。"]]],["earthquake",0,0,1,"地震",[["When the big earthquake occurred, I was just ten.","その大地震が起こったとき、私はほんの１０歳だった。"],["A great many houses were damaged in the earthquake.","この地震で非常に多くの家が被害を受けた。"]]],["easily",0,3,1,"容易に",[["You should be able to read this book easily.","この本なら簡単に読めるはずだよ。"],["Your problem is that you give up too easily.","あなたのいけないところは、すぐに諦めちゃうとこね。"]]],["east",0,2,1,"東の",[["If you face north, the east is on your right.","北を向くと、東は右側になる。"],["The wind is blowing from the east.","風は東から吹いている。"]]],["east",0,3,1,"東、東洋、東の",[["The sun rises in the east and sets in the west.","太陽は東から昇り、西へ沈む。"],["I'm from the East Coast.","東海岸出身です。"]]],["east",0,0,1,"東、東洋、東に",[["I'm from the east coast.","東海岸出身です。"],["The wind is blowing east.","風は東に吹いています。"]]],["editor",0,0,1,"編集者",[["What text editor do you use?","テキストエディタは何を使っていますか？"],["The editor glanced over the manuscript.","編集者は原稿にさっと目を通した。"]]],["education",0,0,1,"教育",[["He placed emphasis on the importance of education.","彼は教育の重要性を強調した。"],["With more education, he would have found a better job.","もっと教育を受けていたら、彼はさらによい仕事を見つけていただろう。"]]],["educational",0,2,1,"教育の、教育に関する、教育的な、教育のための",[["Pay will be based on experience and educational background.","給料は、経験と学歴に基づいて決まります。"],["Educational reforms still have a long way to go.","教育の改革はまだまだこれからだ。"]]],["effect",0,0,1,"結果、効果",[["The new tax system comes into effect next year.","新しい税制は、来年から実施される。"],["The effect was quite different from what was intended.","意図していたものとかけ離れた結果となった。"]]],["effort",0,0,1,"努力",[["I make an effort to eat plenty of vegetables.","野菜を多くとるよう心がけている。"],["He found that all his efforts amounted to nothing.","彼は自分のやったことがすべて水の泡になったことに気づいた。"]]],["either",0,5,1,"どちらかの、どちらか一方、どちらでも",[["I don't like cats, and my brother doesn't either.","私は猫が嫌いだし、私の兄もそうだ。"],["A person who chases two rabbits won't catch either.","二兎を追う者は一兎をも得ず。"]]],["elderly",0,2,1,"かなり年配の、初老の",[["My parents told me we should respect the elderly.","両親は私に年寄りを敬うように言った。"],["My parents told me that we should respect the elderly.","両親は私に老人を敬うように言った。"]]],["electric",0,2,1,"電気の",[["Tom rides his electric bicycle to work every day.","トムは毎日、電動自転車で通勤してるんだよ。"],["Do you need a license to use an electric wheelchair?","電動車椅子って免許要るの？"]]],["elephant",0,0,1,"ゾウ",[["This is how they catch an elephant alive.","こんなふうにして彼らは象を生け捕りにする。"],["There were no other elephants in the area.","周囲に他の象はいませんでした。"]]],["elevator",0,0,1,"エレベーター",[["Do you have an elevator in your house?","あなたの家にはエレベーターがありますか？"],["The elevator seems to be out of order.","そのエレベーターは故障しているようだ。"]]],["elsewhere",0,3,1,"どこかよそに",[["Your mind is obviously elsewhere.","明らかに上の空よね。"]]],["email",0,1,1,"",[["I've already sent an email to the support department.","もうサポートセンターにメールを送りました。"],["Please send bug reports to the following email address.","バグ報告を下記のメールアドレスに送ってください。"]]],["embarrassing",0,2,1,"(人を)まごつかせる、困惑させる、きまり悪がらせる",[["It was really embarrassing.","めちゃ恥ずかしかったよ。"],["It's an embarrassing question.","それは答えづらい質問ね。"]]],["emergency",0,0,1,"非常の場合",[["You can always count on him in any emergency.","いざという時は、いつでもあいつを頼ればいいからな。"],["I'm going to lay aside that money for emergencies.","そのお金はいざというときのために取っておくよ。"]]],["empty",0,2,1,"からの、空虚な",[["How far can you drive your car on empty?","ガソリンランプがついてから、どれくらい走れるの？"],["This box is empty. It has nothing in it.","この箱は空だ。中には何も入っていない。"]]],["encourage",0,1,1,"勇気づける",[["All my friends encouraged me to try my best.","友達がみんな、がんばれと勇気づけてくれた。"],["His advice encouraged me to try it again.","彼のアドバイスのおかげで、私はもう一度やってみようという気になった。"]]],["end",0,1,1,"終わらせる、終わる",[["The long war came to an end at last.","長かった戦争がやっと終わった。"],["I met him at the end of the platform.","私はプラットホームの端で彼にあった。"]]],["endangered",0,2,1,"危険にさらされた、(動・植物が)絶滅寸前の",[]],["ending",0,0,1,"終り、終了;(物語・映画などの)結末、(文の)語尾",[["A good beginning makes a good ending.","始めが肝心。"],["I like stories that have sad endings.","悲しい結末の物語が好きです。"]]],["energetic",0,2,1,"精力的な",[["Why are you so energetic?","なんでそんなに元気なの？"],["You look very energetic today.","今日はとても元気そうだね。"]]],["enormous",0,2,1,"巨大な",[["Tom lives in an enormous house.","トムは巨大な家に住んでいる。"],["My heavens, what an enormous box!","おやまあ、なんて大きな箱なの。"]]],["enough",0,3,1,"不足のない、十分な量(数)、十分に",[["I was lucky enough to get a good seat.","運よくいい席がとれたんだ。"],["If I had enough money, I could buy it.","お金を持っていれば買えるんですが。"]]],["enough",0,7,1,"不足のない、十分な量(数)、十分に",[["I had enough sense to get out of there.","気を利かせて外へ出た。"],["She was kind enough to make tea for us.","彼女は親切にも私達にお茶を入れてくれた。"]]],["enough",0,6,1,"不足のない、十分な量(数)、十分に",[["She was kind enough to show me the way.","彼女はそれは親切に道を教えてくれました。"],["I had enough money to buy what I needed.","必要なものを買うくらいのお金はありました。"]]],["enter",0,1,1,"入る、一員となる",[["I took off my hat and entered the church.","私は帽子を取り、教会に入った。"],["Take off your hat when you enter a temple.","お寺に入る時は、帽子をとりなさい。"]]],["entertainment",0,0,1,"娯楽",[["There's no entertainment for young people around here.","ここいらの若者には娯楽がない。"]]],["entrance",0,0,1,"入り口、入ること",[["She saw a young man at the entrance.","彼女は入り口で若い男を見た。"],["Please hand in the papers at the entrance.","入り口で書類を提出して下さい。"]]],["envelope",0,0,1,"封筒",[["I have to put a stamp on the envelope.","封筒に切手を貼らなきゃ。"],["I forgot to put a stamp on the envelope.","私は封筒に切手をはるのを忘れた。"]]],["envy",0,0,1,"ねたみ、羨望の的",[["I envy your lifestyle - living day-to-day like that.","なんかその日暮らしって感じで、羨ましい。"],["He was the envy of his friends.","彼は友人たちの羨望の的であった。"]]],["episode",0,0,1,"挿話的なでき事(人生の特殊な経験など)、(小説・劇などの中の本筋と直接関係のない",[["Seriously though, episode 21 made me laugh so hard I almost cried.","でもほんとに、エピソード21には涙が出るほど笑ったよ。"],["Each episode of that TV drama ends with somebody delivering a profound line.","あのドラマ、最後にいつも意味深な言葉を言って終わるよね。"]]],["error",0,0,1,"誤り",[["If you find any errors, please let me know immediately.","万一間違いを見つけたら、直ちに知らせてください。"],["Correct the errors if there are any.","間違えがもしあれば、直しなさい。"]]],["escalator",0,0,1,"エスカレーター",[]],["escape",0,0,1,"逃げ出すこと",[["He admitted that he wanted to escape from here.","彼はここから逃げ出したがっていることを認めた。"],["Once again, I was able to escape death.","私は再び死から逃れることができた。"]]],["especially",0,3,1,"特に",[["\"Do you like sports?\" \"Yes, I especially like baseball.\"","「スポーツは好きですか」「はい特に野球が好きです」"],["I love this town, especially in the spring.","この町が大好きなんだ。特に春がね。"]]],["essay",0,0,1,"小論、随筆",[["I have a few essays to write by tomorrow.","明日までに書かなければならないレポートがいくつかある。"],["I have to finish writing this essay by tomorrow.","明日までにこの作文を書いてしまわないといけないんだ。"]]],["establish",0,1,1,"設立する、確立する",[["The research institute was established in the late 1960s.","その研究所が設立されたのは１９６０年代後半です。"],["The idn't expect it to be this much fun.","こんなに楽しいとは思っていなかった。"],["I expect that I will see him on Monday.","私は月曜日に彼に会うつもりだ。"]]],["experience",0,0,1,"経験、経験(体験)したこと",[["I have a lot more experience than Tom does.","私にはトムよりも多くの経験があります。"],["Have you ever had an out-of-body experience?","体外離脱を経験したことってある？"]]],["expert",0,0,1,"専門家、熟練者、熟達した",[["She is an expert when it comes to cooking.","料理にかけては、彼女は名人だ。"],["They asked a medical expert to do more research.","彼らはもっと調べるよう医療専門家に頼んだ。"]]],["explain",0,1,1,"説明する",[["She explained to me how to make a cake.","彼女は私にケーキの作り方を説明してくれた。"],["I didn't know how to explain that to Tom.","トムにどう説明すればいいのか分からなかったんだ。"]]],["explanation",0,0,1,"説明",[["The explanation of each fact took a long time.","ひとつひとつの事実を説明するのにずいぶん時間がかかった。"],["I don't want an apology. I want an explanation.","私は謝ってほしいのではない。説明して欲しいのだ。"]]],["explore",0,1,1,"探検する、詳しく調べる",[["They explored every avenue in an attempt to avoid war.","彼らは戦争を回避しようと、あらゆる手段を探し求めた。"],["We explored all possible ways of cutting expenditures.","我々は支出を削減するあらゆる可能な方法を探った。"]]],["express",0,0,1,"至急便、急行",[["I admire a person who expresses a frank opinion.","私は率直に意見を述べる人を尊敬します。"],["I don't know how to express my thanks.","感謝の気持ちをどう表したらいいかわからない。"]]],["expression",0,0,1,"言葉で表すこと、表現、現れ",[["Which expression do you use more often?","どちらの表現をよく使いますか？"],["I was confused by her expression.","彼女の表情に私は困惑した。"]]],["extra",0,2,1,"余分の、臨時の、付属するもの",[["Could you use an extra pair of hands?","お手伝いしましょうか？"],["Are they paying you extra to work late?","深夜勤務手当は出てるの？"]]],["extra",0,3,1,"余分の、臨時の、付属するもの",[["Will there be an extra charge for that?","それには追加料金がかかるんでしょうか。"],["We have the extra-large size, but not in that color.","特大のサイズはあるんですが、その色のは切らしております。"]]],["extremely",0,3,1,"極端に",[["The coat she said she wanted was extremely expensive.","彼女が欲しいって言ってたコート、目の玉が飛び出るほど高かったんだ。"],["It was extremely hot, so I took my coat off.","とても暑かったので上着を脱いだ。"]]],["face",0,1,1,"面する",[["I have spots coming out all over my face.","顔中にぶつぶつができた。"],["She always has a serious look on her face.","彼女はいつも真剣な表情をしている。"]]],["fact",0,0,1,"事実",[["As a matter of fact, I don't like Tom.","俺、実はトムのこと嫌いなんだ。"],["The fact is known to everyone in the town.","町の人なら誰もがその事実を知っている。"]]],["fail",0,1,1,"失敗する、衰える、落第する",[["Don't fail to come here by the appointed time.","約束の時間までに必ずここに来るように。"],["No one told me that he had failed.","あの人が失敗したと誰も私に教えてくれなかった。"]]],["fairly",0,3,1,"公平に、かなり",[["I thought that I was a fairly good swimmer.","私は水泳に相当の自信を持っていた。"],["The police car was driving at fairly high speed.","パトカーがかなりの速度で走っていた。"]]],["fall",0,1,1,"落下する、倒れる、下がる",[["I broke my wrist when I fell on it.","転んだ時、手首を折った。"],["As soon as I sat down, I fell asleep.","座るや否や、眠りに落ちてしまった。"]]],["familiar",0,2,1,"親しい",[["I am familiar with the way he asks questions.","私は彼の質問の仕方をよく知っている。"],["I am familiar with this part of town.","私は町のこのあたりはよく知っている。"]]],["fancy",0,2,1,"装飾的な",[["Tom and Mary stayed at a fancy hotel.","トムとメアリーは高級ホテルに宿泊した。"],["I used to be a waiter at a fancy restaurant.","昔は、高級レストランでウェイターしてたよ。"]]],["fantastic",0,2,1,"異様な、想像上の",[["This is a fantastic idea.","素敵な考えね。"],["The view is fantastic.","見事な景色だ。"]]],["far",0,3,1,"遠くに、ずっと後まで(に)、ずっと先まで(に)、ずっと",[["How far is it from here to the park?","ここから公園までどれくらいありますか。"],["How far is it from here to the hotel?","ここからそのホテルまでどのくらいの距離ですか。"]]],["fare",0,0,1,"料金",[["How much is the fare on the bus?","このバスの料金はいくらですか。"],["The bus fares have been raised by 20 percent.","バスの運賃が20%値上げされました。"]]],["fascinating",0,2,1,"魅惑的な、うっとりさせる",[["I went to the book store and bought a fascinating book.","本屋さんに行って、面白そうな本買ってきたよ。"],["It was a fascinating story.","興味深い話でした。"]]],["fashion",0,0,1,"流行、方法",[["What sort of coats are in fashion this year?","どんな種類のコートが今年流行っていますか。"],["She always wears clothes which are out of fashion.","彼女はいつも流行遅れの服を着ている。"]]],["fast food",0,0,1,"",[["Tom said that Mary doesn't like eating at fast food restaurants.","トムが言ってたんだけど、メアリーはファーストフードで食べるのは嫌なんだってさ。"],["I'm sick of eating fast food.","ファーストフードにはうんざりだよ。"]]],["fault",0,0,1,"欠点、誤り、責任",[["The teacher is always finding fault with his students.","その教師は生徒のあら探しばかりしている。"],["I must admit that it was my fault.","あれは、私の不徳の致すところでした。"]]],["favor",0,0,1,"親切な行為、好意",[["May I ask you to do me a favor?","一つお願いがあるのですが。"],["I have a small favor to ask of you.","ちょっとお願いしたいことがあるんだけど。"]]],["favour",0,0,1,"親切な行為、好意",[["May I request a favour of you?","ひとつお願いしたいのですが。"]]],["fear",0,0,1,"恐れ、不安",[["You must conquer your fear of the dark.","暗い所が怖いっていうのを乗り越える必要がありますね。"],["I fear for the future of mankind.","人類の未来が心配だ。"]]],["feather",0,0,1,"羽",[["Birds of a feather flock together.","類をもって集まる。"],["Fine feathers make fine birds.","立派な羽が立派な鳥をつくる。"]]],["feature",0,0,1,"特徴、呼び物",[["I see. That's certainly a useful feature.","なるほど、確かに便利な機能ですね。"],["It isn't a bug. It's an undocumented feature.","それはバグじゃなくて、ドキュメント化されてない仕様です。"]]],["fee",0,0,1,"料金",[["You must pay the admission fee here.","ここは入場料を払わなきゃいけないんだ。"],["How much is the annual membership fee?","年会費はいくらですか。"]]],["feel",0,0,1,"触れる、感じる",[["I feel very sick. I want to throw up.","ひどく気分が悪い。吐きそうだ。"],["I'm so happy, I feel like I could fly.","天にも昇るような気持ちです。"]]],["female",0,2,1,"雌の、女の",[["My boyfriend has a lot of female friends.","私の彼ね、女友達が多いのよ。"],["Would you prefer to be examined by a female nurse?","女性看護師に診てもらいたいですか？"]]],["fence",0,0,1,"囲い",[["I saw a white dog jump over the fence.","私は白い犬が塀を飛び越えるのを見た。"],["She was too short to see over the fence.","彼女は背が低すぎて塀の向こうがみえなかった。"]]],["few",0,7,1,"少しはある、ほとんどない、少数の人",[["I want to stay here for a few days.","何日か、ここにいたいな。"],["I'll be out of town for a few days.","数日町を離れます。"]]],["fiction",0,0,1,"作り話、小説",[["He really likes science fiction novels a lot.","彼はSF小説が大好きです。"],["This science-fiction novel is very interesting.","このＳＦ小説はとても面白い。"]]],["fighter",0,0,1,"戦う人、戦士、闘士、プロボクサー",[["That fighter plane dropped a bomb.","その戦闘機は爆弾を投下した。"],["You're still a fire fighter, aren't you?","今でも消防士なんでしょ？"]]],["figure",0,0,1,"数字、姿、人",[["I can't figure out how to upload an image.","画像のアップロードの仕方が分かりません。"],["I can't figure out how to solve the puzzle.","そのパズルの解き方がわからないんだ。"]]],["figure",0,1,1,"数字、姿",[["I figured out how to do that by myself.","自分でそれをする方法を考えついたよ。"],["I can't figure out why you don't like jazz.","きみがなぜジャズを嫌いか私にはわからない。"]]],["film",0,0,1,"薄皮、フイルム、映画",[["I forgot to put film in the camera.","カメラにフィルムを入れるのを忘れた。"],["Have you ever seen a film this good?","こんなすばらしい映画を見たことがありますか。"]]],["final",0,2,1,"最終の、最終的な",[["Final exams are coming up, so I'm busy.","期末試験が近づいているので忙しい。"],["The two teams competed in the final game.","２チームは決勝戦で競った。"]]],["final",0,0,1,"決勝戦",[["Most students are preparing for the final exams.","たいていの学生は期末試験の準備をしている。"],["We left the final decision to him.","最終決定は彼に任せた。"]]],["finally",0,3,1,"最後に",[["I finally got hold of that book I wanted.","やっとほしい本を手に入れた。"],["He finally achieved what he set out to do.","彼はついに目的を果たした。"]]],["first name",0,0,1,"ファーストネーム、名(「姓」に対する「名」に当たる;米国ではChristian",[["You may call me by my first name.","下の名前で呼んでいいよ。"],["The most common first name in the world is Mohammed.","世界で一番多いファーストネームはモハメッドだ。"]]],["fisherman",0,0,1,"漁夫",[["The fisherman cast his line into the water.","漁師は釣り糸を水中に投げた。"]]],["fit",0,2,1,"適した、合う",[["I don't think he is fit for the job.","私は彼はその仕事に向いていないと思う。"],["I don't think she is fit for the job.","彼女はその仕事に適していないと思う。"]]],["fix",0,0,1,"固定する、決める",[["I'm not able to fix the car by myself.","僕はその車を自分で直せない。"],["Hold still a moment while I fix your tie.","ネクタイを締める間、ちょっとじっとしてね。"]]],["flea",0,0,1,"ノミ",[["Is there anywhere I can go to find a flea market?","フリーマーケットをやっている場所がありますか。"],["Where's the flea market going to be?","フリマって、どこでやってるの？"]]],["flight",0,0,1,"飛ぶこと、一団となって飛ぶ群れ、一続きの階段",[["The flight was canceled because of the heavy fog.","その便は濃霧のため欠航になりました。"],["The flight was canceled because of the thick fog.","フライトは濃霧のため、キャンセルになった。"]]],["float",0,0,1,"浮く、浮かせる",[["Would you like a root beer float?","ルートビアフロートはいかがですか？"],["A stone does not float.","石は浮かびません。"]]],["flood",0,0,1,"洪水、はんらん、満潮",[["The flood water reached the level of the windows.","洪水は窓の高さまで押し寄せた。"],["We provided the flood victims with food and clothing.","私たちは洪水の被災者に食べ物と衣類を提供した。"]]],["flour",0,0,1,"小麦粉",[["He bought a lot of flour and oil.","彼はたくさんの小麦粉と油を買い込んだ。"],["This cake contains flour, milk, eggs and sugar.","このケーキには小麦粉、牛乳、卵、砂糖が含まれています。"]]],["fog",0,0,1,"霧、もや、霧状(の…)、(…の)霧",[["I can't see the road signs in this fog.","この霧では道路標識は見えない。"],["It is dangerous to fly in this heavy fog.","濃霧のため飛ぶのは危険だ。"]]],["folder",0,0,1,"紙ばさみ、(印刷した1枚の紙を数ページに折り畳んだ)折り本;折り畳み広告、折り畳",[["In which folder did you save the file?","どのフォルダにファイルを保存しましたか。"],["The folder is empty.","フォルダーは空です。"]]],["follow",0,1,1,"後について行く、たどる、従う",[["My dog follows me whenever I leave the room.","ウチの犬は僕が部屋を出たらいつもついて来るんだ。"],["All you have to do is follow the instructions.","君は指示に従ってさえいればいいのです。"]]],["fool",0,0,1,"ばか者",[["You can't fool me with a trick like that.","そんな手で私の目をごまかそうとしても無駄だ。"],["I don't like being made a fool of.","人をばかにしないでもらいたい。"]]],["footballer",0,0,1,"",[]],["for",0,5,1,"…の間、…のために、…向きの(に)",[["I must buy a new suit for my son.","息子に新しい背広を買ってやらなければならない。"],["I traded in my car for a new one.","車を下取りに出して新車を買った。"]]],["forbid",0,1,1,"禁じる",[["My father forbids me to go out at night.","父は私が夜外出するのを禁止している。"],["There is a very strict rule forbidding smoking in bed.","ベッドでの煙草を禁ずる厳しい規則がある。"]]],["force",0,0,1,"力、暴力、軍隊",[["It isn't good to force our ideas on others.","自分の考えを他人に押し付けるのはよくない。"],["Nothing can force me to give it up.","何があろうとも私はあきらめない。"]]],["forest",0,0,1,"森林",[["You can see some wild rabbits in the forest.","この森では野生のうさぎを見る事が出来る。"],["It is believed that ghosts exist in this forest.","この森には、幽霊がいると信じられている。"]]],["forever",0,3,1,"永久に",[["It would take forever for me to explain everything.","いつまでかかっても全部を説明するのは無理だ。"],["Humans were never meant to live forever.","人間は決して永遠には生きられないものだ。"]]],["fork",0,0,1,"フォーク",[["Have you ever stirred your coffee with a fork?","コーヒーをフォークで混ぜたことってある？"],["I can't use a fork well.","フォークがうまく使えないんだ。"]]],["fortunately",0,3,1,"運よく",[["Fortunately, I've got you to talk to.","幸い、私には話せる相手がいるしね。"],["Fortunately none of the passengers were injured.","幸いにも乗客は誰も負傷しなかった。"]]],["fortune",0,0,1,"運、運勢、富",[["He left a large fortune to his son.","彼は息子に莫大な財産を残した。"],["Tom left a large fortune to his son.","トムは息子に莫大な財産を残した。"]]],["forward",0,3,1,"前方へ、将来へ",[["I am looking forward to hearing from you soon.","早急なお返事をお待ちしております。"],["We are looking forward to hearing about your trip.","旅のお土産話を楽しみにしてますね。"]]],["forwards",0,3,1,"前方へ、将来へ",[]],["frame",0,0,1,"骨組み、枠、体格",[["I need a frame for this picture.","この絵を入れる額がいるね。"],["Tom is wearing glasses with black frames.","トムは黒縁メガネをかけている。"]]],["frank",0,2,1,"率直な",[["I admire a person who expresses a frank opinion.","私は率直に意見を述べる人を尊敬します。"],["He is a frank person and easy to talk to.","彼はざっくばらんな人柄なので話しやすい。"]]],["free",0,3,1,"自由な、独立している、免れている",[["What do you usually do in your free time?","普段、自由時間って何してるの？"],["Whenever I have free time, I read a book.","暇さえあれば、本を読んでます。"]]],["freedom",0,0,1,"自由、解放",[["There used to be no freedom of the press.","昔は出版の自由などなかった。"],["We must defend our freedom at all cost.","われわれは、どんな犠牲を払っても自由を守らなければならない。"]]],["freeze",0,1,1,"凍る、凍らせる、凍えさせる",[["The temperature has been below freezing for several days.","この数日間、ずっと氷点下の気温が続いている。"],["We came dangerously close to freezing to death.","私たちは危うく凍え死ぬところだった。"]]],["fresh",0,2,1,"新鮮な、鮮やかな",[["Open the window and let in some fresh air.","窓を開けて、新鮮な空気をいれなさい。"],["Tom opened the window to get some fresh air.","トムは新鮮な空気を入れるため窓を開けた。"]]],["fridge",0,0,1,"(おもに家庭用の)冷蔵庫(refrigerator)",[["Please feel free to eat anything in the fridge.","冷蔵庫の中の物は、何でも御自由に召し上がってください。"],["There is no meat left in the fridge.","冷蔵庫には肉は残っていません。"]]],["fried",0,2,1,"fryの過去・過去分詞、油で焼いた(揚げた)",[["I ate fried rice for lunch today.","今日の昼はチャーハンを食べた。"],["I don't often eat deep-fried food.","揚げ物はめったに食べません。"]]],["friendship",0,0,1,"友情、親交、友情の具体例や関係",[["A true friendship is more valuable than money.","真の友情はお金より尊い。"],["Friendship is as precious as anything else.","結局友情がいちばん大切だ。"]]],["frighten",0,1,1,"(突然)…をひどく驚かせる、おびえさせる、ひどく怖がる、おびえる",[["She stared at him with frightened eyes.","彼女はおびえた目で彼を見ていた。"],["I was frightened at the sight.","その光景を見てぎょっとした。"]]],["frightened",0,2,1,"",[["She stared at him with frightened eyes.","彼女はおびえた目で彼を見ていた。"],["I was frightened at the sight.","その光景を見てぎょっとした。"]]],["frightening",0,2,1,"ぎょっとさせる、恐ろしい",[]],["front",0,0,1,"前面",[["I got a taxi in front of the station.","駅前でタクシーを拾った。"],["There is a lake in front of my house.","私の家の目の前に、湖がある。"]]],["fry",0,0,1,"油で揚げる",[["A large order of fries, please.","ポテトのＬサイズをお願いします。"],["Tom put ketchup on his french fries.","トムはフライドポテトにケチャップをかけた。"]]],["fully",0,3,1,"十分に",[["I'm sorry, today is fully booked.","申し訳ございませんが、本日は満席となっております。"],["The single rooms were fully booked.","シングルルームは満室だった。"]]],["function",0,1,1,"機能を果たす",[["The function of the heart is to pump blood.","心臓の働きは血液を送り出す事である。"],["As far as I know, there is no such function.","私の知る限り、そのような機能はないと思います。"]]],["furniture",0,0,1,"家具",[["There is a lot of furniture in this room.","この部屋には家具がたくさんある。"],["There was a lot of furniture in the room.","部屋には家具がたくさんあった。"]]],["further",0,2,1,"もっと遠い",[["He was too tired to go any further.","彼はあまりにも疲れていて、それ以上進む事が出来なかった。"],["He didn't want to talk about it further.","彼はその事について、それ以上話したがらなかった。"]]],["gallery",0,0,1,"回廊、さじき",[["You should drop by his gallery if you have time.","時間があるなら、彼の画廊に寄ってみたら。"],["When was the last time you went to an art gallery?","最後に絵画のギャラリーに行ったのはいつですか。"]]],["garage",0,0,1,"車庫",[["The garage is at the side of the house.","ガレージは家のそばにあります。"],["The car is in front of the garage.","車はガレージの前だよ。"]]],["garlic",0,0,1,"ニンニク",[["I don't like the smell of garlic.","ニンニクの臭いが嫌いなの。"],["The food tasted slightly of garlic.","その食べ物には微かににんにくの風味があった。"]]],["gas",0,0,1,"気体、ガス",[["We ran out of gas on the way there.","そこに行く途中ガソリンが切れてしまったんだ。"],["I was late because I ran out of gas.","ガソリンがなくなってしまって、遅くなりました。"]]],["gate",0,0,1,"門",[["Pick me up 2:30 in front of the main gate.","2時半に正門の前に迎えに来てください。"],["I went through the gate out onto the street.","私は門をくぐって通りへと出た。"]]],["gather",0,1,1,"集める、集まる",[["A crowd gathered at the scene of the crime.","犯行現場に人だかりができていた。"],["A crowd of people gathered in the street.","道には人だかりができていた。"]]],["gender",0,0,1,"(名詞・代名詞の)性",[["Tom believes in traditional gender roles.","トムは男尊女卑思想の持ち主だ。"]]],["generation",0,0,1,"同時代の人人、一代、発生",[["They have nothing in common with the older generation.","彼らは年上の世代と何の共通点もない。"],["This tradition has been passed down from generation to generation.","この伝統は代々受け継がれている。"]]],["gentle",0,2,1,"優しい、穏やかな",[["Mary is very gentle with her baby sister.","メアリーはベビーシッターにとても優しい。"],["She has a gentle heart.","彼女は優しい心の持ち主です。"]]],["given",0,2,1,"giveの過去分詞、定められた、一定の;(数学などで)与えられた",[["I was given a nice watch by my uncle.","伯父さんから素敵な時計をもらったの。"],["I was given a nice present by my uncle.","叔父さんから、素敵なプレゼントをいただきました。"]]],["globe",0,0,1,"球、地球、地球儀",[["She has traveled all over the globe.","彼女は世界中を旅した。"]]],["glove",0,0,1,"手袋、グローブ",[["I found a pair of gloves under the chair.","イスの下にひと組の手袋を見つけた。"],["Why don't we buy a baseball glove for Tom?","トムに野球のグローブを買ってあげない？"]]],["gold",0,0,1,"金、金貨",[["There was a big gold star on the door.","ドアには大きな金色の星がついていました。"],["I'll show you how to separate gold from sand.","砂から金を分離採集する方法をお見せしましょう。"]]],["golden",0,2,1,"金の、金色の",[["I have a nice golden fountain pen.","素敵なゴールドの万年筆を持ってるよ。"],["Isn't that the Golden Gate Bridge?","あれがゴールデン・ゲート・ブリッジでしょ。"]]],["golf",0,0,1,"ゴルフ",[["I don't know how to play golf at all.","私はゴルフのやり方はさっぱりわからない。"],["He plays golf two or three times a month.","彼は月に２～３回ゴルフをする。"]]],["good-looking",0,2,1,"(人が)器量のよい、美しい",[["I don't consider myself to be good-looking.","自分の見た目がいいとは思っていませんよ。"],["Tom is only interested in good-looking girls.","トムは面食いだ。"]]],["government",0,0,1,"政府、政体、統治",[["Why does the US government let people have guns?","なぜアメリカ政府は国民が銃を持つことを許しているのですか。"],["The two countries were united under one government.","２つの国は１つの政府に統合された。"]]],["grace",0,0,1,"優雅さ、思いやり",[]],["gradually",0,3,1 ler than his wife is.","トムは奥さんより３インチ背が高い。"],["He is two inches taller than I am.","彼は私よりも２インチ背が高い。"]]],["include",0,1,1,"含む",[["Don't forget to include me in the count.","忘れずに俺も頭数に入れてくれよ。"],["How much is it including insurance and tax?","保険、税金を含めて、合計金額はいくらになりますか。"]]],["increase",0,1,1,"増える、増大する、増やす",[["Warm and humid weather increases the number of crimes.","暖かく湿度の高い天候は、犯罪数を増加させる。"],["The workers asked for an increase in pay.","労働者達は賃上げを要求した。"]]],["indeed",0,3,1,"実に、なるほど、まさか",[["He is, indeed, a hard worker.","彼は実に勉強家だ。"],["It may, indeed, be a mistake.","なるほど、それは間違いかもしれない。"]]],["independence",0,0,1,"独立",[["Today is Independence Day.","今日は独立記念日です。"],["In 1847, they declared independence.","１８４７年、彼らは独立を宣言した。"]]],["indicate",0,1,1,"表れ(徴候)である、指し示す",[["The strong wind indicates that a storm is coming.","強風は嵐が近づいていることを示している。"],["I went in the direction my friend indicated.","私は友人が指さした方向へと向かった。"]]],["indoor",0,2,1,"室内の、屋内の",[["The world's largest indoor beach is located in Brandenburg, Germany.","世界一の大きさを誇る室内ビーチは、ドイツのブランデンブルクにあります。"]]],["inexpensive",0,2,1,"安い、費用のかからない",[["Do you know of any inexpensive stores?","安い店を紹介してください。"],["It's inexpensive but very nutritious.","安いのに栄養価は高いです。"]]],["influence",0,0,1,"影響、影響力",[["Tides are caused by the influence of the moon.","月の影響で潮の干満が起こる。"],["The influence of TV on society is great.","テレビが社会に与える影響は大きい。"]]],["injure",0,1,1,"傷つける",[["Ten people were killed or injured in the accident.","その事故では10名の死傷者が出た。"],["Grandpa fell down the stairs and was seriously injured.","おじいちゃんが階段から落ちて大怪我をしたんだ。"]]],["inner",0,2,1,"内側の、内部の、精神の",[["I had my wallet stolen from my inner pocket.","内ポケットから財布を盗まれた。"]]],["insect",0,0,1,"昆虫",[["If you open the window, insects will come in.","窓開けてると、虫入ってくるよ。"],["I got a lot of insect bites in the woods.","林の中でいっぱい虫にさされた。"]]],["inside",0,3,1,"内部、内側、内部の、中へ",[["There was a small box inside the big box.","大きな箱の中に、小さな箱が入っていた。"],["I found a dog just inside the gate.","門のすぐ内側に犬がいた。"]]],["inspiration",0,0,1,"霊感",[["What is る、着岸する",[["Fifty years ago anyone could have bought the land.","５０年前だったら、だれでもその土地を買えただろう。"],["Please fasten your seat belt during takeoff and landing.","離着陸の際にはシートベルトをしめて下さい。"]]],["landscape",0,0,1,"風景",[["I gazed out of the window at the landscape.","私は窓からの景色を眺めた。"]]],["lane",0,0,1,"小道",[["The town has many narrow lanes.","その町には狭い小路が多い。"],["This swimming pool has six lanes.","ここのプールは、６レーンあります。"]]],["last",0,7,1,"最後の、すぐ前の、最新の",[["He is the last man I want to see.","彼は私の一番会いたくない人だ。"],["The long war came to an end at last.","長かった戦争がやっと終わった。"]]],["last",0,6,1,"最後の、すぐ前の、最新の",[["We got off the bus at the last stop.","終点でバスを降りました。"],["At last, he found out how to make it.","ついに彼はその作り方を発見した。"]]],["latest",0,2,1,"最近の",[["You need to be here by 2:30 at the latest.","遅くとも２時半には来てください。"],["Please be here by eight at the latest.","遅くとも８時までにはここに来てください。"]]],["latter",0,3,1,"後半の、後者の",[["The latter half of the game was very exciting.","その試合の後半はとてもおもしろかった。"],["The latter is better than the former.","前者より後者の方がいい。"]]],["latter",0,6,1,"後半の、後者の",[["The latter half of the game was very exciting.","その試合の後半はとてもおもしろかった。"],["The latter is better than the former.","前者より後者の方がいい。"]]],["law",0,0,1,"法、法律",[["My brother-in-law is older than I am.","義弟は、私より年上なのよ。"],["I didn't know that you went to law school.","法科大学院に行ってたなんて知らなかったよ。"]]],["lawyer",0,0,1,"弁護士",[["I know a girl whose father is a lawyer.","父親が弁護士の女の子と知り合いだよ。"],["My father had his lawyer draw up his will.","父は弁護士に遺言書を作成してもらった。"]]],["laziness",0,0,1,"怠惰、無精",[["The primary cause of his failure is laziness.","彼の失敗の第一の要因は怠惰である事だ。"]]],["lead",0,0,1,"先頭、鉛",[["You lead the way and I'll follow you.","道を先導してください。そうすればついて行きます。"],["Eating too much may lead to sickness.","食べ過ぎると病気になるかもしれない。"]]],["learner",0,0,1,"学習者;初学者",[["She adapted her teaching method to slow learners.","彼女は教え方を学習の遅い生徒に合わせた。"],["This sentence isn't useful for language learners.","この文は、語学学習者には役に立たないよ。"]]],["least",0,7,1,"最も小さい、少ない、最小",[["I am not in the least afraid of dogs.","犬なんかちっとも恐くない。"],["The least you could do is to answer me.","返事ぐらいしろよ。"]]],["leather",0,0,1,"なめし、皮",[["She gave me a bag made of leather.","彼女は革製のハンドバッグをくれた。"],["I want to buy a leather belt.","革のベルトを買いたいんです。"]]],["left",0,3,1,"左の、左",[["I left the rest to him and went out.","彼に後の仕事を任せて外出した。"],["He had no idea why his wife left him.","彼はなぜ妻が彼のもとを去ったのかわからなかった。"]]],["left",0,0,1,"左",[["I got my left arm hurt in the accident.","事故で左腕をけがしたんだ。"],["I may have left my umbrella on the bus.","バスに傘を忘れてきたかもしれない。"]]],["left-hand",0,2,1,"左側の、左方の、左手による、左手の",[]],["leisure",0,0,1,"暇",[["You can do it at your leisure.","時間のある時にやってくれればいいよ。"],["Poor men have no leisure.","貧乏暇なしですよ。"]]],["lemon",0,0,1,"レモン;レモンの木、レモン色(lemon yellow)",[["Do you prefer tea with lemon or with milk?","レモンティーとミルクティーどっちが好き？"],["The car that Tom bought was a lemon.","トムが買った車はひどいものだった。"]]],["lemonade",0,0,1,"レモン水、レモネード(レモンの汁に水と砂糖を加えた飲料)、レモン[ライム]ソーダ",[["If life deals you lemons, make lemonade.","人生からレモンをもらったら、レモネードを作りなさい。"],["They drink a lot of lemonade.","レモネードが多く飲まれる。"]]],["lend",0,1,1,"貸す",[["I need a bag. Will you lend me one?","かばんが必要です。貸してくれませんか。"],["If you need it, I'll lend it to you.","それ必要なんなら、貸してあげるよ。"]]],["less",0,3,1,"もっと少ない",[["I finished the work in less than an hour.","私はその仕事を１時間足らずで終えた。"],["I will be back in less than five minutes.","５分とはかからないで戻ってきます。"]]],["less",0,7,1,"もっと少ない",[["What he said was nothing less than a threat.","彼の言ったことは脅しにほかならなかった。"],["It is less humid today than it was yesterday.","今日は昨日ほど湿気がない。"]]],["less",0,6,1,"もっと少ない",[["They have a less selfish reason for trying it.","彼らがそうしようとするのは単にわがままからではない。"],["You can get there in less than thirty minutes.","そこまで３０分以内で行けます。"]]],["level",0,0,1,"標準、水準、水平面",[["The flood water reached the level of the windows.","洪水は窓の高さまで押し寄せた。"],["The water rose to a level of 10 meters.","水位は１０メートルまで上昇した。"]]],["liberty",0,0,1,"自由、気まま、権利",[["I'm not at liberty to tell you about the incident.","その事件について自由に話すことはできない。"],["The Statue of Liberty is located in New York.","自由の女神はニューヨークにある。"]]],["licence",0,1,1,"許可、許可証",[["I don't have a license, so I can't drive.","免許持ってないから、運転はできないよ。"],["You need a license to drive a car.","車を運転するには運転免許証が必要だ。"]]],["license",0,1,1,"許可、許可証",[["I don't have a license, so I can't drive.","免許持ってないから、運転はできないよ。"],["You need a license to drive a car.","車を運転するには運転免許証が必要だ。"]]],["lie",0,1,1,"横たわる、置かれている、位置する",[["Do you think what she said is a lie?","彼女の話は嘘だと思いますか。"],["I wonder if what Tom said was a lie.","トムが言ったことは嘘なんじゃないかな。"]]],["lifestyle",0,0,1,"生き方、生きざま",[["I envy your lifestyle - living day-to-day like that.","なんかその日暮らしって感じで、羨ましい。"],["Their lifestyle is different from ours.","彼らのライフスタイルは僕らのとは違う。"]]],["likely",0,2,1,"しそうな、ほんとうらしい、適切な",[["Tom said that Mary was likely to be arrested.","トムは、メアリーが逮捕される可能性は高いと言った。"],["It's likely that Tom will be the one who comes.","来るのは多分トムだろう。"]]],["lip",0,0,1,"くちびる",[["Get out of the water. Your lips are blue.","水から上がりなさい。唇が青いわよ。"],["I have a cold sore on my lip.","唇にヘルペスができています。"]]],["liter",0,0,1,"リットル(メートル法の容量の単位l.、lit)",[["I drink about three liters of water every day.","水は、毎日3リットルぐらい飲んでるよ。"],["We drink at least three liters of water a day.","１日に３リットルは水を飲みます。"]]],["litre",0,0,1,"リットル(メートル法の容量の単位l.、lit)",[["I drink about three liters of water every day.","水は、毎日3リットルぐらい飲んでるよ。"],["We drink at least three liters of water a day.","１日に３リットルは水を飲みます。"]]],["lively",0,2,1,"生気にあふれた",[["My grandfather is 90 years old and very lively.","祖父は９０歳で、とても元気です。"],["We had a lively party last night.","昨夜のパーティーは大盛況だったよ。"]]],["load",0,0,1,"重荷",[["How many loads of laundry did you wash today?","今日、洗濯機は何回回した？"]]],["local",0,2,1,"一地方の、部分的な",[["We must compete with the local stores in price.","地元の店と価格競争をしなければなりません。"],["The express train is an hour faster than the local.","急行列車は各駅停車より一時間も早い。"]]],["lock",0,0,1,"錠をおろす、錠がかかる",[["The door will lock automatically when you go out.","ドアは外に出ると自動的に閉まります。"],["I lock my door every time I leave my room.","部屋を出るたびにドアの鍵はかけるよ。"]]],["logical",0,2,1,"論理学の、
