<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--sub:#5f6b7a;--line:#dde2e8;--pri:#2563eb;--onpri:#fff;--ok:#2e7d32;--ng:#c62828;--chip:#e8edf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e8ebef;--sub:#9aa5b1;--line:#2c343d;--pri:#6ea0ff;--onpri:#0b1220;--ok:#2f8f3a;--ng:#d0413e;--chip:#252d38}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#e8ebef;--sub:#9aa5b1;--line:#2c343d;--pri:#6ea0ff;--onpri:#0b1220;--ok:#2f8f3a;--ng:#d0413e;--chip:#252d38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 32px}
button,select{font:inherit;color:inherit}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row .sp{flex:1}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip)}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;margin-bottom:10px}
.hw{font-size:32px;font-weight:700;word-break:break-word}
.sub{color:var(--sub);font-size:14px}
.ic{border:0;background:none;font-size:22px;padding:2px 8px;cursor:pointer}
.opt{display:block;width:100%;margin:8px 0;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);text-align:left}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.res{font-size:20px;font-weight:700;margin:10px 0}
.okt{color:var(--ok)}.ngt{color:var(--ng)}
.ex{display:flex;gap:6px;align-items:flex-start;margin:8px 0}
.ex div{flex:1}
.next{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:700}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{color:var(--sub);font-size:13px}
.rate{margin-left:auto;font-size:14px}
.mean{margin:6px 0}
footer{margin-top:24px;font-size:12px;color:var(--sub)}
[hidden]{display:none!important}
</style>
</head>

</div>
<script>
const D=[["a",0,7,0,"英語アルファベットの第1字、(音階の)イ音、イ調",[["Is it OK if I go for a walk?","散歩に出かけてもいいですか？"],["I go to bed at ten as a rule.","大抵１０時には寝るよ。"]]],["a.m.",0,3,0,"午前",[["I'm on duty from 9:00 a.m. to 5:00 p.m.","朝９時から夕方５時までの勤務だよ。"],["He usually goes to work at 8 a.m.","彼はたいてい8時に仕事に行く。"]]],["about",0,3,0,"の回りに(を)、のあちこちに(で、を)、の身の回りに",[["Do you want to talk about it or not?","それについて話したい？話したくない？"],["This is about all I can put up with.","そろそろ我慢の限界だよ。"]]],["about",0,4,0,"…の回りに(を)、のあちこちに(で、を)、の身の回りに",[["She has about as many stamps as I do.","彼女は私と同じくらい切手を持っている。"],["What do you want to talk to me about?","なんだい、話したいことって。"]]],["above",0,3,0,"の上方へ、の上に、の上流に(で)",[["He went above and beyond the call of duty.","彼は要求の上を行く働きをした。"],["Her voice could hardly be heard above the noise.","彼女の声は騒音のなかでほとんど聞きとれなかった。"]]],["above",0,4,0,"…の上方へ、の上に、の上流に(で)",[["My work at school was well above average.","私の学校の成績は平均をかなり上回っていた。"],["He likes to watch the birds fly above his head.","彼は鳥が頭上を飛んでいくのを眺めるのが好きです。"]]],["action",0,0,0,"行動、行為、日常の行動",[["I believe the actions that Tom took were right.","トムがとった行動は正しかったと、私は思っています。"],["I believe that actions are more important than words.","言葉より行動が大切だと思います。"]]],["activity",0,0,0,"活動",[["Students usually like club activities better than their classes.","たいてい、学生は学科の授業よりクラブ活動の方が好きだ。"],["He has engaged in religious activity since then.","彼はそれ以来宗教活動に携わっている。"]]],["actor",0,0,0,"俳優、男優",[["A boxer and an actor are coming toward us.","ボクサーと俳優がこっちに向かってくる。"],["He lacks the talent to be an actor.","彼には俳優になる才能がない。"]]],["add",0,1,0,"合計する、加える",[["If you add three to four, you get seven.","３を４に加えると７になる。"],["What do you have to add to 17 to get 60?","６０にするためには１７に何を足せばよいの。"]]],["address",0,0,0,"あて名、演説、あてて手紙",[["I can give you the address if you want.","住所が知りたいんなら、教えてあげるよ。"],["May I ask you for your name and address?","お名前と住所をお聞きしてもよろしいでしょうか。"]]],["aeroplane",0,0,0,"飛行機",[["Do you know how to fold a paper airplane?","紙飛行機の折り方、分かる？"],["I'm always tense before I get on an airplane.","飛行機に乗る前はいつも緊張する。"]]],["afraid",0,2,0,"恐れて、気づかって",[["I'm afraid I have a touch of a cold.","私は風邪気味のようです。"],["I am not in the least afraid of dogs.","犬なんかちっとも恐くない。"]]],["after",0,4,0,"…の後に、を求めて、の名をとって",[["He came to see you right after you left.","きみが出かけた直後に彼が訪ねてきた。"],["The mouse ran and the cat ran after him.","ネズミは走り、ネコはそれを追いかけた。"]]],["afternoon",0,0,0,"午後",[["What do you want to do in the afternoon?","午後は何やりたい？"],["I am afraid it will rain in the afternoon.","あいにく午後から雨になりますよ。"]]],["again",0,3,0,"再び、また元の所へ",[["Her one wish was to see her son again.","彼女の唯一の望みは息子にもう１度会うことだった。"],["Are you going to go out with Tom again?","またトムと付き合うつもり？"]]],["age",0,0,0,"年齢、老齢",[["Tom and Mary are the same age as John.","トムとメアリーはジョンと同い年だよ。"],["At what age do you want to get married?","何歳で結婚したい？"]]],["ago",0,3,0,"前に、以前に",[["I am not what I was ten years ago.","私は１０年前の私ではない。"],["They went on a trip a few days ago.","彼らは数日前に旅行にでかけた。"]]],["agree",0,1,0,"意見が一致する、同意する",[["I agree with you that we should try again.","僕らがもう一度やるべきだという点では君に賛成。"],["Tom asked me if I agreed with his opinion.","トムに自分の意見に同意するかどうか、聞かれました。"]]],["airplane",0,0,0,"飛行機",[["Do you know how to fold a paper airplane?","紙飛行機の折り方、分かる？"],["I'm always tense before I get on an airplane.","飛行機に乗る前はいつも緊張する。"]]],["airport",0,0,0,"空港",[["I met a friend of mine at the airport.","私は空港で友達に会った。"],["I went to the airport to see them off.","私は彼らを見送りに飛行場まで行った。"]]],["album",0,0,0,"アルバム",[["I tore the picture out of the album.","私はアルバムからその写真を引きはがした。"],["What is your favorite song on this album?","このアルバムの中で、一番好きな曲ってどれ？"]]],["all",0,7,0,"全体の、全部の、全部",[["All I can do is to do my best.","私にできるのは全力を尽くすことだけです。"],["If you do it at all, do it well.","やるからには、ちゃんとやりなさい。"]]],["all",0,6,0,"全体の、全部の、全部",[["Is it OK if I drink all of this?","これ全部飲んじゃってもいい？"],["Is it all right if I go home now?","もう家に帰ってもいいですか？"]]],["all right",1,2,0,"",[["Is it all right if I go home now?","もう家に帰ってもいいですか？"],["Is it all right if I call you Tom?","トムって呼んでもいい？"]]],["all right",1,3,0,"",[["Is it all right if I pay by check?","小切手は使えますか。"],["Is it all right to use a flash here?","フラッシュを使ってもいいですか。"]]],["almost",0,3,0,"ほとんど",[["I almost died a year and a half ago.","一年半前、私はもう少しで死ぬところだった。"],["The old man was almost hit by a car.","その老人は危うく車にひかれるところだった。"]]],["alone",0,3,0,"ひとりで",[["I may not be able to do it alone.","私独りではできないかもしれません。"],["It is not good for her to live alone.","彼女が一人で暮らすのはよくない。"]]],["along",0,3,0,"…をたどって、沿って",[["I don't think I can get along with him.","彼とうまくやっていく自信がない。"],["If you have the time, come along with me.","時間があるなら一緒に来てよ。"]]],["already",0,3,0,"もう、すでに",[["I can't believe it's already time to go home.","もう帰る時間だなんて、嘘でしょ。"],["I have the impression that I already know you.","君には会ったことがある気がする。"]]],["also",0,3,0,"もまた",[["I also know a thing or two about cooking.","料理も多少なり知ってるよ。"],["I also like listening to music on the radio.","ラジオで音楽を聞くのも好きなんだ。"]]],["always",0,3,0,"いつも",[["Tom always seems to be in a bad mood.","トムって、いつも機嫌悪そう。"],["I always brush my coat when I come home.","家に帰ると必ずコートにブラシをかけるんです。"]]],["am",0,3,0,"be動詞の一人称単数、直説法、現在形",[["My son is now as tall as I am.","息子はもう私と同じ身長だ。"],["I am not the person I used to be.","今の私は昔の私ではない。"]]],["am",0,9,0,"be動詞の一人称単数、直説法、現在形",[["I am not what I was ten years ago.","私は１０年前の私ではない。"],["I am pleased to help you if I can.","私に出来る事でしたら喜んでお手伝いします。"]]],["an",0,7,0,"不定冠詞。ある(程度)の、一つの、～というもの、～につき、同じ、～のような人、～",[["I gave up my seat to an old lady.","私は老婦人に席を譲った。"],["Keep an eye on my bag for a while.","ちょっと私のかばんを見ていてね。"]]],["and",0,5,0,"と、足す、しかも",[["I need to go home and feed my dog.","家に帰って犬にご飯をあげなきゃいけないんだ。"],["I'm tired and I want to go to bed.","疲れてるし、寝たいよ。"]]],["angry",0,2,0,"おこった",[["I have no idea why she got so angry.","なぜ彼女がそんなに怒ったのか私にはわからない。"],["It is quite natural for her to get angry.","彼女が怒るのも当然だ。"]]],["animal",0,0,0,"動物",[["There are a lot of animals in the park.","公園にはたくさんの動物がいます。"],["Man is the only animal that can use fire.","人間は火の使える唯一の動物である。"]]],["another",0,7,0,"もう一つの、もう一人の、別の",[["There has to be another way to do this.","きっと別のやり方もあるはずだよ。"],["Excuse me, may I have another cup of tea?","すみません、お茶をもう1杯いただけませんか。"]]],["answer",0,0,0,"答え、応報",[["The least you could do is to answer me.","返事ぐらいしろよ。"],["Do I have to answer all of the questions?","質問の全てに答えなければなりませんか。"]]],["answer",0,1,0,"答える",[["You mean to say that you know the answer?","答が分かるっていうこと？"],["No matter what you say, the answer is \"no.\"","何ていわれてもダメ！"]]],["any",0,7,0,"いくらかの、少しも、どんな…でも",[["I go to any party I am invited to.","私は招待されたパーティーには必ず出席する。"],["Is there any need for me to go there?","私がそこに出向く必要がありますか。"]]],["any",0,6,0,"いくらかの、少しも、どんな…でも",[["Drop in at my house any time you want.","いつでも家に遊びにおいで。"],["I don't want to take on any more work.","これ以上仕事は引き受けたくないんだ。"]]],["anybody",0,6,0,"だれか、だれも、だれでも",[["Will anybody be at the station to meet me?","誰か駅で私を待っているでしょうか？"],["I don't think anybody else could do my job.","他人には私の仕事はできないでしょうに。"]]],["anyone",0,6,0,"だれか、だれも、だれでも",[["No matter what anyone says, I plan to go.","誰が何と言おうと、私は行くつもりだから。"],["I don't think anyone else could do my job.","他人には私の仕事はできないでしょうに。"]]],["anything",0,6,0,"何か、何も、なんでも",[["I will do anything I can do for her.","私は彼女のためなら何でもする。"],["Is there anything I can do to help you?","何かお力になれることありませんか？"]]],["apple",0,0,0,"リンゴ",[["Would it be OK if I ate this apple?","このりんご食べてもいい？"],["Tom is the one who gave me this apple.","このリンゴをくれたのはトムなんだ。"]]],["April",0,0,0,"4月",[["In April we have a lot of school events.","４月には学校行事がたくさんある。"],["At times, it snows even in April around here.","このあたりでは、４月でも雪が降ることがあるんですよ。"]]],["apron",0,0,0,"エプロン",[]],["are",0,9,0,"である",[["I wish I were as smart as you are.","自分が君と同じくらい賢いといいのに。"],["There are a lot of eggs in the box.","その箱の中にはたくさんの卵があります。"]]],["arm",0,0,0,"腕、武器、兵器",[["I broke my arm when I was a child.","子どもの頃、腕を骨折しました。"],["I got my left arm hurt in the accident.","事故で左腕をけがしたんだ。"]]],["around",0,4,0,"…の周りに、を、…のあちこちに",[["I go to bed at around ten at night.","夜は10時ごろに寝るんだ。"],["I asked her to pick me up around four.","私は彼女に４時ごろ迎えに来てくれるように頼みました。"]]],["arrive",0,1,0,"着く、到着する",[["The letter will arrive in a week or so.","手紙は１週間ほどで着きますよ。"],["We won't be able to arrive home in time.","時間までに家に着けないよ。"]]],["art",0,0,0,"芸術、技術、人文科学",[["Does this bus go to the art museum?","このバスは美術館に行きますか？"],["She went to the art museum by taxi.","彼女はタクシーで美術館に行った。"]]],["article",0,0,0,"記事、一個、一品",[["The author of this article is a famous critic.","この記事の筆者は有名な評論家です。"],["You bought these articles at too high a price.","高い買い物をしたものだ。"]]],["as",0,4,0,"…同じくらい、同様に、…ほど",[["I go to bed at ten as a rule.","大抵１０時には寝るよ。"],["My son is now as tall as I am.","息子はもう私と同じ身長だ。"]]],["ask",0,1,0,"ついて質問する、尋ねる、質問する",[["May I ask you to do me a favor?","一つお願いがあるのですが。"],["I asked Tom to send the book to us.","本をこちらに送ってもらえるように、トムにお願いしました。"]]],["at",0,4,0,"…で、…に",[["I go to bed at ten as a rule.","大抵１０時には寝るよ。"],["I had a lot of fun at the party.","パーティーでは大いに楽しんだ。"]]],["August",0,0,0,"8月",[["This year there were few rainy days in August.","今年の８月は雨がほとんど降らなかった。"],["It rains a lot from May to August.","雨がよく降るのは、５月から８月にかけてです。"]]],["aunt",0,0,0,"おば",[["My uncle is slim, but my aunt is fat.","叔父はすらっとしているが、叔母は太っている。"],["We are going to visit our aunt next Sunday.","私達は今度の日曜日に叔母を訪問します。"]]],["autumn",0,0,0,"秋",[["Autumn is the best season for going on hikes.","ハイキングは秋に限る。"],["Some flowers bloom in spring and others in autumn.","春に咲く花もあれば、秋に咲く花もある。"]]],["awake",0,2,0,"目をさまさせる、眠らずに",[["I was kept awake all night by the noise.","騒音で一晩中眠れなかった。"],["More often than not I lay awake all night.","ほとんどの場合、一晩中眠れずにいた。"]]],["away",0,3,0,"離れて、あっちへ、向こうへ",[["He ran away as soon as he saw me.","彼は私を見るとすぐ逃げ去った。"],["I have to get out of here right away.","すぐにここから出なきゃ。"]]],["baby",0,0,0,"赤ん坊、赤ちゃん",[["My job is to take care of the baby.","私の仕事は赤ん坊の世話をする事です。"],["I have known him since he was a baby.","私は彼が赤ちゃんの時から知っている。"]]],["back",0,3,0,"背、背中、後ろ",[["He will be back in a day or two.","彼は一日か二日で帰ります。"],["I have a bad pain in my lower back.","腰痛がひどいんです。"]]],["back",0,0,0,"背、背中、後ろ",[["He has eyes at the back of his head.","彼は抜け目がない。"],["Let me know as soon as he gets back.","彼が帰ってきたらすぐに私に知らせてくれ。"]]],["bad",0,2,0,"悪い、適当でない、へたな",[["Tom isn't as bad as you say he is.","トムはあなたが言うほど悪くないわ。"],["I have a bad pain in my lower back.","腰痛がひどいんです。"]]],["bag",0,0,0,"袋、袋状の物",[["Keep an eye on my bag for a while.","ちょっと私のかばんを見ていてね。"],["I need a bag. Will you lend me one?","かばんが必要です。貸してくれませんか。"]]],["ball",0,0,0,"球、ボール、舞踏会",[["Seen from a distance, it looks like a ball.","少し離れたところから見ればそれはボールのように見える。"],["I saw many people hurrying toward the ball park.","大勢の人が野球場へ急いでいるのが見えた。"]]],["banana",0,0,0,"バナナ",[["Tom and I each ate a couple of bananas.","僕とトムはバナナを2本ずつ食べたよ。"],["Half of the bananas in the basket were rotten.","かごの中のバナナの半分は腐っていた。"]]],["band",0,0,0,"帯、バンド、一隊",[["Tom is one of the singers in my band.","トムはうちのバンドのボーカルの一人です。"],["We need to band together to beat the enemy.","敵に打ち勝つために団結しなければならない。"]]],["bank",0,0,0,"土手、銀行",[["He had a lot of money in the bank.","彼は銀行に多額の預金があった。"],["He has a lot of money in the bank.","彼は銀行にたくさんのお金がある。"]]],["bar",0,0,0,"棒、障害",[["Tom went to the bar to get a drink.","トムなら、一杯やりにバーに行ったよ。"],["Have you ever been kicked out of a bar?","バーから追い出されたことある？"]]],["baseball",0,0,0,"野球",[["Tom took his son John to a baseball game.","トムは息子のジョンを、野球の試合に連れて行った。"],["Why don't we buy a baseball glove for Tom?","トムに野球のグローブを買ってあげない？"]]],["basketball",0,0,0,"バスケットボール",[["Tom thinks that volleyball is more fun than basketball.","トムはバスケよりバレーの方が面白いと思っている。"],["I am a member of the basketball team.","ボクは、そのバスケットボールチームのメンバーだよ。"]]],["bat",0,0,0,"コウモリ、バット",[["A lot of people think that bats are birds.","多くの人がコウモリは鳥だと思っている。"],["Please hold your bat by the end of its handle.","バットを長めに持ってください。"]]],["bath",0,0,0,"入浴、浴室",[["Today I have to give my cat a bath.","今日はねこをお風呂に入れなくちゃ。"],["I think that I'll go and take a bath.","お風呂入ってこようかな。"]]],["bathroom",0,0,0,"浴室",[["I think Tom has to go to the bathroom.","トムはトイレに行きたいんだと思うよ。"],["The bathroom is at the end of the hall.","バスルームはホールの端にあります。"]]],["be",0,9,0,"である、ある、存在する",[["He will be back in a day or two.","彼は一日か二日で帰ります。"],["I want to be a stay-at-home dad.","専業主夫になりたい。"]]],["beach",0,0,0,"浜",[["How do I get to the beach from here?","ここからビーチまではどうやって行けばいいの？"],["I wanted to go to the beach with Tom.","トムと一緒に海に行きたかったの。"]]],["bean",0,0,0,"豆",[["I want to eat rice with beans.","豆ご飯が食べたいな。"],["I'll boil the beans for you.","君に豆を煮てあげよう。"]]],["bear",0,0,0,"クマ",[["I can't bear to see him cry like that.","彼があんな風に泣くのを見るのは堪えられない。"],["He ran for his life when the bear appeared.","彼は熊が現れたとき必死で走った。"]]],["beautiful",0,2,0,"美しい、きれいな、みごとな",[["I know Mary is more beautiful than I am.","メアリーが私より綺麗だってことぐらい、知ってるわ。"],["The old church by the lake is very beautiful.","湖畔の古い教会はとても美しい。"]]],["because",0,5,0,"…だから、…ゆえに、であるからといって",[["I do it because I like to do it.","好きでやってるんだよ。"],["I was late because I ran out of gas.","ガソリンがなくなってしまって、遅くなりました。"]]],["become",0,1,0,"なる、似合う",[["He made up his mind to become a pilot.","彼はパイロットになる決心をした。"],["Why do you want to become a bus driver?","どうしてバスの運転手になりたいの？"]]],["bed",0,0,0,"ベッド、寝台、花壇",[["I go to bed at ten as a rule.","大抵１０時には寝るよ。"],["It is time for you to go to bed.","もうお前は寝る時間だ。"]]],["bedroom",0,0,0,"寝室",[["Tom is taking a nap in his bedroom.","トムは寝室で昼寝してるよ。"],["The bedroom curtains have faded at the edges.","寝室のカーテンは端が色あせてきた。"]]],["bee",0,0,0,"はち",[["My father is busy as a bee every day.","私の父は毎日とても忙しい。"],["My mother is busy as a bee every day.","母は毎日とても忙しいんです。"]]],["beef",0,0,0,"牛肉",[["The ground beef was found to contain horse meat.","牛ミンチに馬肉が混入しているのが見つかりました。"],["Do you have a beef with me?","何か文句ある？"]]],["before",0,3,0,"の前に、より前に、よりまさって",[["I'll try to do that before I go home.","家に帰る前にそれやってみるよ。"],["I feed my dog just before I eat dinner.","私は晩ご飯の直前に犬にエサをやる。"]]],["before",0,4,0,"…の前に、より前に、よりまさって",[["I never felt this way before I met you.","こんな気持ちにさせてくれる人は初めてだよ。"],["I want to get home before it gets dark.","暗くなる前に家に帰りたい。"]]],["begin",0,1,0,"始まる、開始する、始める",[["The rain has let up, so we can begin.","小雨になりました。開始できます。"],["I began to see what he was getting at.","彼のねらいが何だかわかってきた。"]]],["behind",0,3,0,"の後ろに、の陰に、の後に",[["She hid behind the door and held her breath.","彼女は息を殺してドアの陰に隠れていた。"],["Show me what you have hidden behind your back.","後ろに隠しているもの見せてよ。"]]],["behind",0,4,0,"…の後ろに、の陰に、の後に",[["Tom is three months behind in paying his rent.","トムは家賃を3ヶ月滞納している。"],["A strange sound was heard from behind the door.","ドアの陰から変な音が聞こえた。"]]],["being",0,9,0,"存在、実在(existence);生命(life)、本質、本性(nature)",[["Mary is not used to being made fun of.","メアリーはからかわれることに慣れていない。"],["You can stay with us for the time being.","とりあえず君は私たちのところにいてもいいよ。"]]],["believe",0,1,0,"信じる、思う",[["It was stupid of you to believe in him.","彼を信じたあなたがどうかしていたのよ。"],["I believe he is not guilty of the crime.","私は、彼がその事件について無罪だと信じています。"]]],["bell",0,0,0,"鐘、鈴、ベル",[["When the bell rang, the teacher ended the class.","先生はベルが鳴ったとき授業を終えた。"],["I rung the bell countless times, but nobody came.","何度もピンポン鳴らしてみたんだけど、誰も出ないんだ。"]]],["below",0,3,0,"の下方へ、の下方で、より以下で",[["The temperature has been below freezing for several days.","この数日間、ずっと氷点下の気温が続いている。"],["The sun sank below the horizon and it got dark.","太陽が地平線の下に沈み、暗くなった。"]]],["below",0,4,0,"…の下方へ、の下方で、より以下で",[["The sun sank below the horizon before I knew it.","陽は知らぬ間に地平線下に沈んだ。"],["The sun is setting below the horizon.","地平線の彼方に日が沈みかけている。"]]],["beside",0,4,0,"…のそばに",[["I think this is beside the point right now.","これは今、関係ないと思うよ。"],["That's an interesting remark, but it's beside the point.","興味深い発言ですが、それは別問題です。"]]],["best",0,2,0,"いちばんよい、健康状態が最良の、最もよいもの",[["All I can do is to do my best.","私にできるのは全力を尽くすことだけです。"],["I told Tom that I would do my best.","僕は全力を尽くすとトムに言った。"]]],["best",0,3,0,"いちばんよい、健康状態が最良の、いちばんよく",[["This is by far the best hotel in town.","こちらは町の中でも別格のホテルなんですよ。"],["Tom is one of the best golfers I know.","トムは僕が知る中で最高のゴルファーの一人です。"]]],["better",0,2,0,"いっそうよい、もっと多い",[["Tom is better at the piano than I am.","トムは私よりピアノが上手い。"],["We are better off than we used to be.","私たちは以前より暮らし向きがよい。"]]],["between",0,4,0,"…の間に、の間で",[["My doctor told me not to eat between meals.","お医者さんに、間食はしないようにって、言われちゃった。"],["There is nothing going on between Tom and me.","トムと私の間には何もないわ。"]]],["bicycle",0,0,0,"自転車",[["I was saving up to buy a new bicycle.","新しい自転車を買うために、お金を貯めていたんだ。"],["How much does it cost to rent a bicycle?","自転車を借りるのに、いくらかかりますか？"]]],["big",0,2,0,"大きい、重要な",[["The door had a big gold star on it.","ドアには大きな金色の星がついていました。"],["There used to be a big pond around here.","以前は、この辺りに大きな池があったんです。"]]],["bike",0,0,0,"自転車",[["When was the last time you rode a bike?","最後に自転車に乗ったのはいつですか？"],["She got on her bike and rode away.","彼女は自転車にまたがり、走り去った。"]]],["bird",0,0,0,"鳥",[["I saw a white bird on my way home.","私は家に帰る途中で白い鳥を見た。"],["A lot of people think that bats are birds.","多くの人がコウモリは鳥だと思っている。"]]],["birth",0,0,0,"誕生、生まれ、起原",[["I congratulated him on the birth of his son.","私は彼に、男子出産のお祝いを述べた。"],["The birth rate and death rate were nearly equal.","出生率と死亡率は、ほぼ等しかった。"]]],["birthday",0,0,0,"誕生日",[["Do you know how to make a birthday cake?","誕生日ケーキの作り方、知ってる？"],["Tom gave this hat to me for my birthday.","私の誕生日に、トムがこの帽子をくれたの。"]]],["biscuit",0,0,0,"小型パン、ビスケット",[["Tom is eating biscuits, isn't he?","トムはビスケットを食べてるんでしょ？"]]],["black",0,2,0,"黒い、暗い",[["I have a black dog and a white dog.","黒い犬と白い犬を飼ってるよ。"],["The dress I like most is the black one.","一番好きなドレスは、黒のです。"]]],["black",0,0,0,"黒、黒色",[["That guy over there dressed in black is Tom.","向こうにいる黒服のあいつがトムだよ。"],["The red belt goes well with her black dress.","赤いベルトが彼女の黒いドレスをひきたたせている。"]]],["blank",0,2,0,"白紙の",[["Tom turned in a blank test paper.","トムは白紙の答案を出した。"],["He left the last page blank.","彼は最後のページをあけておいた。"]]],["block",0,0,0,"かたまり、区画、妨害物",[["The detective shadowed the suspect for four blocks.","その刑事は容疑者を4ブロックに渡って尾行した。"],["Tom and Mary live in the biggest house on the block.","トムとメアリーって、あのブロックで一番大きい家に住んでるんだよ。"]]],["blow",0,1,0,"吹く、風で動く",[["I blew my whole bonus on shopping and travel.","ボーナス全部を買い物と旅行に使ってしまった。"],["My hat was blown off by the wind.","帽子が風で飛ばされたよ。"]]],["blue",0,2,0,"青い",[["I go to church once in a blue moon.","めったに教会には行かない。"],["If I were you, I would paint it blue.","私なら、青く塗るだろうね。"]]],["blue",0,0,0,"青色",[["Get out of the water. Your lips are blue.","水から上がりなさい。唇が青いわよ。"],["The girl in the blue coat is my daughter.","ブルーのコートを着ている女の子は私の娘です。"]]],["board",0,0,0,"板、委員会",[["There were quite a few passengers on board.","かなり多くの乗客が船に乗っていた。"],["There were fifty passengers on board the bus.","そのバスには五十人の乗客がいた。"]]],["boat",0,0,0,"小型の船",[["What kind of boat do you want to buy?","どんなボートを買いたいの？"],["There were a lot of boats on the lake.","湖上にはたくさんのボートが浮かんでいた。"]]],["body",0,0,0,"身体、胴体、主要部",[["I have aches and pains all over my body.","体中がずきずき痛む。"],["She doesn't have a lazy bone in her body.","彼女ってまめだね。"]]],["bone",0,0,0,"骨、骨を作っている物質、骨質",[["I don't like to eat fish with many bones.","骨がたくさんある魚は嫌いだ。"],["She doesn't have a lazy bone in her body.","彼女ってまめだね。"]]],["book",0,0,0,"本、巻、帳簿",[["He said he read this book in a day.","一日でこの本を読み終えたんだって。"],["I asked Tom to send the book to us.","本をこちらに送ってもらえるように、トムにお願いしました。"]]],["bookstore",0,0,0,"書",[["Why don't we go to the bookstore on foot?","歩いて本屋へいきましょう。"],["There used to be a bookstore on that corner.","あの角には、かつて本屋があった。"]]],["boring",0,2,0,"退屈な、うんざりする、穴をあけること、穿孔(せんこう);(鉱山の)ボーリング",[["The movie was so boring that I fell asleep.","映画がつまらなさ過ぎて、寝ちゃったよ。"],["As a matter of fact, his lecture was boring.","実際のところ、彼の講義は退屈であった。"]]],["borrow",0,1,0,"借りる",[["I make it a rule never to borrow money.","私は決して借金をしないことにしている。"],["Can I borrow your pen for a few minutes?","ちょっとの間ペンを貸していただけますか。"]]],["both",0,3,0,"両方の、両方、両方とも",[["Both Tom and I are members of that club.","トムも僕もあのクラブのメンバーなんだ。"],["I had a hard time making both ends meet.","家計のやりくりに苦労したよ。"]]],["both",0,7,0,"両方の、両方、両方とも",[["This place is big enough for both of us.","ここは二人には十分な広さだね。"],["Both Tom and I were members of that club.","僕と同じようにトムもあのクラブの会員だったよ。"]]],["both",0,6,0,"両方の、両方、両方とも",[["I heard that Tom and Mary have both died.","トムもメアリーもお亡くなりになったそうですね。"],["Tom and John both fell in love with Mary.","トムとジョンの二人ともメアリーを好きになった。"]]],["bottle",0,0,0,"びん",[["Here, I got us a bottle of white wine.","ほら、二人で飲もうと思って白ワインを持ってきましたよ。"],["I have a bottle of beer in my backpack.","リュックの中にビールを1本入れてます。"]]],["bottom",0,0,0,"底、下部、底部",[["Gum got stuck to the bottom of my shoe.","靴の底にガムが付いてしまった。"],["I love you from the bottom of my heart.","心から愛してるよ。"]]],["bowl",0,0,0,"どんぶり、はち;わん",[["Tom put the bowl of popcorn on the table.","トムはポップコーンの入ったボウルを、テーブルの上に置いた。"],["Please give me a large bowl of rice.","ご飯は大盛りでお願いします。"]]],["box",0,0,0,"箱、1箱",[["There are a lot of eggs in the box.","その箱の中にはたくさんの卵があります。"],["Do you know what this box is made of?","この箱、何でできてるか分かる？"]]],["boy",0,0,0,"少年、男の子",[["I saw a boy get hit by a car.","少年が車にはねられるのを見たのです。"],["I had a puppy when I was a boy.","子供の頃、小犬を飼っていた。"]]],["boyfriend",0,0,0,"男友だち(恋人)、ボーイフレンド、男友だち(恋人)、ボーイフレンド",[["What would you do if you had a boyfriend?","彼氏できたら何したい？"],["I talked my boyfriend into buying me a ring.","ボーイフレンドを説得して指輪を買ってもらった。"]]],["brain",0,0,0,"脳、頭脳、知力",[["My brain doesn't seem to be working well today.","今日は頭がさえません。"],["My sister has a very good brain.","私の姉はとても頭が良い。"]]],["bread",0,0,0,"パン",[["Don't forget to buy bread on the way back.","帰りにパン買うの忘れないでよ。"],["Is it OK if I eat this bread?","このパン食べてもいい？"]]],["break",0,1,0,"壊す、役に立たなくする、破る",[["I broke my arm when I was a child.","子どもの頃、腕を骨折しました。"],["I broke my wrist when I fell on it.","転んだ時、手首を折った。"]]],["breakfast",0,0,0,"朝食",[["I have a boiled egg for breakfast every day.","私は毎日朝食にゆで卵を食べてます。"],["I did some work after breakfast and went out.","わたしは朝食後少し仕事をしてからでかけた。"]]],["breathe",0,1,0,"呼吸する",[["Are you having any difficulty breathing through your nose?","鼻での呼吸はしづらいですか？"],["Don't breathe a word of it to anyone.","おくびにも出すな。"]]],["bridge",0,0,0,"橋、船橋、艦橋",[["I'll go with you as far as the bridge.","橋まで一緒に行きましょう。"],["A long time ago, there was a bridge here.","昔ここに橋があった。"]]],["bright",0,2,0,"鮮やかな",[["It's so bright that I can't open my eyes.","眩しくて目を開けられない。"],["They all thought of her as a bright girl.","彼らはみんな彼女のことを利口な子だと思った。"]]],["bring",0,1,0,"持ってくる、連れてくる、来させる",[["I can't bring myself to do such a thing.","そんなことをする気には到底なれないね。"],["\"Can I bring my dog?\" \"Of course you can.\"","「犬連れてきてもいい？」「もちろんさ」"]]],["broken",0,2,0,"壊れた、破られた",[["There was broken glass on top of the wall.","塀の上には割れたガラスがありました。"],["There were bits of broken glass on the floor.","床にガラスの破片が落ちてたよ。"]]],["brother",0,0,0,"兄弟、兄、弟",[["I as well as my brother am to blame.","私の兄だけでなく、私にも責任がある。"],["My brother-in-law is older than I am.","義弟は、私より年上なのよ。"]]],["brown",0,2,0,"褐色の、茶色の",[["I saw the boy that was wearing brown shoes.","茶色の靴を履いてる男の子を見ました。"],["I think I'll brown bag it this week.","今週はお弁当を持ってくことにしよっかな。"]]],["brush",0,0,0,"ブラシ、はけ",[["I always brush my coat when I come home.","家に帰ると必ずコートにブラシをかけるんです。"],["This shampoo comes with a nice hair brush.","このシャンプーを買うと、素敵なヘアブラシがついてきます。"]]],["brush",0,1,0,"ブラシをかける",[["She was brushing her hair in front of a mirror.","彼女は鏡の前で髪にブラシをかけていた。"],["I need to buy some paint brushes.","絵筆を買わなきゃいけないの。"]]],["bucket",0,0,0,"バケツ、手おけ",[["This bucket has a hole in it.","このバケツ、穴が開いてるよ。"],["I'll go get a bucket of water.","バケツに水を汲んでくるよ。"]]],["build",0,1,0,"組み立てる、作り上げる",[["I hope to build a new house next year.","来年は新しい家を建てたい。"],["They say that a huge dam will be built.","大きなダムができるそうだ。"]]],["building",0,0,0,"建物",[["What is that big building in front of us?","目の前の、あの大きい建物は何なの？"],["There are a lot of new buildings here now.","今は新しいビルがたくさん立っています。"]]],["burger",0,0,0,"牛のひき肉(ground beef)、(またHamburg steak)ハンバー",[["I ate a burger, then went to bed.","ハンバーガーを食べてから寝ました。"],["I actually don't really like burgers.","実はハンバーガー、苦手なんだ。"]]],["bus",0,0,0,"バス",[["Do you go there by bus or by car?","そこにはバスで行ってるの？それとも車？"],["As the bus was late, I got a taxi.","バスが遅れたので私はタクシーに乗った。"]]],["business",0,0,0,"職業、店、会社",[["I was on a business trip all last week.","先週は出張に行ってたよ。"],["I know that this is none of my business.","私が口を挟むことではないのは分かってます。"]]],["busy",0,2,0,"忙しい、にぎやかな",[["I'm so busy I have no time to read.","めちゃめちゃ忙しくて、本を読む時間なんてないよ。"],["My father is busy as a bee every day.","私の父は毎日とても忙しい。"]]],["but",0,5,0,"しかし、て、…を除いて",[["It's a pain but I have to do it.","めんどうくさいけどやらないとね。"],["I have a car, but I rarely use it.","車は持ってるけど、ほとんど使わないんだ。"]]],["butter",0,0,0,"バター",[["I thought Tom would want butter on his toast.","トムはトーストにはバターを塗るんだと思ってたよ。"],["Melt the chocolate, add the butter and stir well.","チョコを溶かして、バターを加えてよくかき混ぜて。"]]],["butterfly",0,0,0,"チョウ",[["I was a butterfly in my dream.","夢の中で、僕は蝶々だったんだ。"],["He saw a butterfly on the wall.","彼は壁に蝶が止っているのを見た。"]]],["button",0,0,0,"ボタン、押しボタン",[["All you have to do is press the button.","ボタンを押してくれるだけでいいんだ。"],["I pressed the button to turn the radio on.","私はボタンを押してラジオをつけた。"]]],["buy",0,1,0,"買う",[["I have a mind to buy a new car.","新しい車を買おうかと思っている。"],["I have to buy a new pair of skis.","新しいスキー板を買わなくてはいけない。"]]],["by",0,4,0,"…のそばに、までに、の間に",[["I saw a boy get hit by a car.","少年が車にはねられるのを見たのです。"],["Do you go there by bus or by car?","そこにはバスで行ってるの？それとも車？"]]],["bye",0,0,0,"二の次の事(物)、付随的な、副次的な",[]],["cafe",0,0,0,"喫茶店、軽食堂",[["I had a cup of coffee at the cafe.","私は喫茶店でコーヒーを１杯飲みました。"],["We had a quick lunch at a cafe.","私達はカフェで軽いランチを食べた。"]]],["café",0,0,0,"喫茶店、軽食堂",[["There are many small restaurants and cafés in this area.","この辺りには、ちょっとした飲食店やカフェがたくさんあるの。"],["Turn left, and you'll find the café.","左に曲がると、カフェがあるわ。"]]],["cake",0,0,0,"ケーキ",[["Tom gave the last piece of cake to me.","トムがケーキの最後の一切れをくれたの。"],["She explained to me how to make a cake.","彼女は私にケーキの作り方を説明してくれた。"]]],["call",0,0,0,"呼び声、電話をかけること、訪問",[["Is it all right if I call you Tom?","トムって呼んでもいい？"],["He is what we call a man of culture.","彼はいわゆる文化人である。"]]],["camera",0,0,0,"カメラ",[["Tom is the only one who has a camera.","トムはカメラを持っているたった一人です。"],["I take my camera with me wherever I go.","僕はどこへ行くにもカメラ持参なんだ。"]]],["camp",0,0,0,"野 ["I have to catch a plane in three hours.","3時間以内に飛行機に乗らなきゃ。"],["I got up early to catch the first train.","私は始発電車に乗るために早起きした。"]]],["catch",0,1,0,"捕らえる、つかみ取る、間に合う",[["I caught a cold, and I have a fever.","風邪をひいて熱がある。"],["I was caught in a shower on the way.","途中でにわか雨にあったんだよ。"]]],["CD",0,0,0,"certificate of deposit、(またC.D.)Civil Def",[["This is the very CD I've been looking for.","これこそ私が探していたCDです。"],["Which CD do you want to listen to?","あなたはどのＣＤを聞きたいですか。"]]],["CD player",0,0,0,"",[["I got this CD player for free.","このCDプレーヤー、ただで手に入れたんだ。"]]],["celebrate",0,1,0,"祝う",[["My friends celebrated my birthday.","友達が私の誕生日を祝ってくれた。"],["We celebrated his birthday.","誕生日を祝福しました。"]]],["celebration",0,0,0,"祝賀",[]],["chair",0,0,0,"いす",[["I found a pair of gloves under the chair.","イスの下にひと組の手袋を見つけた。"],["Please bring me a chair from the next room.","隣の部屋から椅子を持って来て下さい。"]]],["change",0,0,0,"変化、取り替え",[["He told me about the change in the plan.","彼は私に計画の変更を知らせてきた。"],["What should I change to get this to work?","どこをいじったら動くんだ。"]]],["change",0,1,0,"変える、取り替える、変わる",[["Where can I find a place to change money?","両替所はどこにありますか。"],["I went home in order to change my clothes.","私は服を着替えるために家へ帰った。"]]],["character",0,0,0,"性格、登場人物",[["In no way is he a man of character.","彼は決して人格者ではない。"],["All the characters in this book are imaginary.","この本に登場する人物は、すべて架空のものです。"]]],["check",0,0,0,"阻止、引き合わせ、小切手",[["Is it all right if I pay by check?","小切手は使えますか。"],["He took out his pen to sign his check.","彼はペンを取り出して小切手にサインした。"]]],["cheese",0,0,0,"チーズ",[["Why do wine and cheese go together so well?","どうしてワインとチーズはこんなによく合うの？"],["There were four pieces of cheese on the table.","テーブルの上にはチーズが４個あった。"]]],["chicken",0,0,0,"ひよこ",[["Cows give us milk and chickens give us eggs.","牛はミルクを、鶏は卵を私たちに与えてくれる。"],["I have two dogs, three cats, and six chickens.","犬を２匹、猫を３匹、ニワトリを６羽飼ってるよ。"]]],["child",0,0,0,"子供",[["I broke my arm when I was a child.","子どもの頃、腕を骨折しました。"],["Don't treat me as if I were a child.","子供と思ってなめないでよね。"]]],["chocolate",0,0,0,"チョコレート、チョコレート菓子",[["I can easily give up chocolate to lose weight.","ダイエットのためなら、チョコレートを断つのなんて簡単よ。"],["I drink coffee without sugar if I have chocolate.","チョコを食べる時は、コーヒーに砂糖は入れません。"]]],["choose",0,1,0,"選択する、決める、選択をする",[["Choose any one of these books that you like.","どれでも好きな本を１冊選びなさい。"],["You can't be too careful in choosing your friends.","友達選びは慎重であるに越したことはない。"]]],["church",0,0,0,"教会",[["I go to church once in a blue moon.","めったに教会には行かない。"],["I took off my hat and entered the church.","私は帽子を取り、教会に入った。"]]],["cinema",0,0,0,"映画館、映画",[["Suddenly, a fire broke out in the movie theater.","突然、映画館で火災が発生した。"],["A fire broke out inside the movie theater.","映画館の中で火災が発生した。"]]],["circle",0,0,0,"円、仲間",[["Our math teacher drew a circle on the blackboard.","私たちの数学の先生は黒板に円を描いた。"],["Red circles on the map mark schools.","地図の赤丸は学校を示す。"]]],["city",0,0,0,"都市",[["The park is in the center of the city.","その公園は市の中央に位置している。"],["Tom wanted his son to live in the city.","トムは、息子が都会に住むことを願っていた。"]]],["class",0,0,0,"種類、クラス、授業",[["I am in charge of the third-year class.","私は３年生を受け持っている。"],["No boy in the class is taller than Tom.","そのクラスにトムより背の高い男子はいない。"]]],["classmate",0,0,0,"級友",[["Do you get along well with your new classmates?","新しいクラスメートと仲よくやっていますか。"],["He's getting along well with all of his classmates.","彼はクラスメート全員と上手く付き合っている。"]]],["classroom",0,0,0,"クラスルーム",[["Tom was the last one to leave the classroom.","最後に教室を出たのはトムだった。"],["Take off your hat when you enter a classroom.","教室に入る時は、帽子をとりなさい。"]]],["clean",0,2,0,"汚れのない、清潔な",[["All you have to do is clean your room.","自分の部屋を掃除するだけでいいんだよ。"],["I asked Tom to help me clean the pool.","トムにプール掃除を手伝ってくれないか聞いた。"]]],["clean",0,1,0,"きれいにする",[["I wanted Tom to help me clean the pool.","トムにプール掃除を手伝ってほしかった。"],["I thought I told you to clean your room.","自分の部屋を掃除するようにあなたに言ったはずですが。"]]],["clever",0,2,0,"利口な、器用な",[["He is very clever for a boy of ten.","１０歳の少年としては彼は利口だ。"],["A clever student can answer such a question easily.","利口な生徒はそうした質問に簡単に答えられる。"]]],["climb",0,0,0,"よじ登ること",[["Did you climb trees when you were a child?","子供の時に木登りってした？"],["The boy seized the ladder, and began to climb.","少年ははしごをつかみ、登りはじめた。"]]],["clock",0,0,0,"時計",[["Do you have an alarm clock in your room?","自分の部屋に目覚まし時計ってある？"],["The clock has stopped. It needs a new battery.","時計が止まっちゃったんだ。電池交換しないといけないな。"]]],["close",0,2,0,"近い、親密な",[["I only live here because it's close to work.","仕事場が近いから、ここに住んでるだけだよ。"],["Tom moved his chair a little closer to Mary.","トムが自分の椅子を少しメアリーの方に寄せたよ。"]]],["close",0,1,0,"閉じる、終える",[["She lay on a sofa with her eyes closed.","彼女は目を閉じてソファーに横になっていた。"],["Tom sat on the bench and closed his eyes.","トムはベンチに腰掛け目を閉じた。"]]],["closed",0,2,0,"",[["She lay on a sofa with her eyes closed.","彼女は目を閉じてソファーに横になっていた。"],["Tom sat on the bench and closed his eyes.","トムはベンチに腰掛け目を閉じた。"]]],["cloth",0,0,0,"布、布地",[["She bought six yards of cloth for a dress.","彼女はドレスを作る布を６ヤード買った。"],["The waitress spread a white cloth over the table.","ウエートレスはテーブルの上に白いテーブルクロスをかけた。"]]],["clothes",0,0,0,"衣服",[["My clothes got wet so I took them off.","服が濡れちゃったから脱いだんだよ。"],["I was ashamed to go out in old clothes.","古着での外出は恥ずかしかった。"]]],["cloud",0,0,0,"雲",[["There are more clouds today than there were yesterday.","昨日より雲が多いな。"],["That cloud looks like a rabbit to me.","あの雲、ウサギみたい。"]]],["cloudy",0,2,0,"曇った",[["It's very cloudy. I think it's going to rain.","めっちゃ曇ってるね。雨になるだろうね。"],["It was cloudy, so I took an umbrella with me.","曇りだったので、私は傘を持って行った。"]]],["club",0,0,0,"こん棒、クラブ",[["Both Tom and I are members of that club.","トムも僕もあのクラブのメンバーなんだ。"],["Both Tom and I were members of that club.","僕と同じようにトムもあのクラブの会員だったよ。"]]],["coach",0,0,0,"大型四輪馬車、コーチ",[["A good coach is like a father to his players.","良きコーチはいわば選手の親のようなものだ。"],["The last three coaches of the train were badly damaged.","列車の後部３両はひどい損傷を受けた。"]]],["coat",0,0,0,"コート、上着",[["I got cold, so I put on my coat.","体が冷えたので、私はコートを着た。"],["It was so hot I took my coat off.","とても暑かったので上着を脱いだ。"]]],["code",0,0,0,"法典、規約、信号法",[["Do I have to dial the area code, too?","市外局番もいるの？"],["I forgot the code for the safe deposit box.","セーフティボックスの暗証番号を忘れてしまった。"]]],["coffee",0,0,0,"コーヒー、飲料",[["I had a cup of coffee at the cafe.","私は喫茶店でコーヒーを１杯飲みました。"],["Do you want to go to a coffee shop?","喫茶店に行きたい？"]]],["coke",0,0,0,"(燃料の)コークス、をコークスにする",[["Can I have two hamburgers and a coke, please?","ハンバーガー２つとコーラを下さい。"],["Go and buy three bottles of coke.","コーラ３本買ってきてくれ。"]]],["cold",0,2,0,"寒い、冷たい",[["I got cold, so I put on my coat.","体が冷えたので、私はコートを着た。"],["I was cold, so I put on a sweater.","寒かったから、セーターを着たんだよ。"]]],["cold",0,0,0,"寒さ、かぜ",[["It was so cold that we made a fire.","とても寒かったので火をたいた。"],["I caught a cold, and I have a fever.","風邪をひいて熱がある。"]]],["collect",0,1,0,"集める、徴集する、集まる",[["My daughter lost almost all the coins she had collected.","私の娘は集めていたコインの大半をなくした。"],["A crowd collected to watch the fight.","喧嘩を見ようと、野次馬が集まった。"]]],["collection",0,0,0,"集めること、収集物、募金",[["A half-dozen tools make up the tool collection.","６種の道具がひとまとまりになっている。"],["I have a large collection of stamps.","切手をたくさん集めています。"]]],["college",0,0,0,"大学、単科大学",[["What do you plan to major in at college?","大学では何を専攻するつもりですか。"],["I've been out of college for ten years now.","大学を出て、10年になるわ。"]]],["color",0,0,0,"色、絵の具、顔色",[["Which color do you like more, blue or red?","青と赤ではあなたはどちらの方が好きですか。"],["I don't like the color of this wall.","この壁の色、嫌だ。"]]],["color",0,1,0,"彩る",[["Do you have this in any other colors?","色違いはありませんか。"],["What color is the roof of your house?","君んちの屋根って、何色なの？"]]],["colour",0,0,0,"色、絵の具、顔色",[["Which color do you like more, blue or red?","青と赤ではあなたはどちらの方が好きですか。"],["I don't like the color of this wall.","この壁の色、嫌だ。"]]],["colour",0,1,0,"彩る",[["Do you have this in any other colors?","色違いはありませんか。"],["What color is the roof of your house?","君んちの屋根って、何色なの？"]]],["come",0,1,0,"来る、行く、着く",[["He came in just as I was going out.","ちょうど私が出かけようとしていたときに、彼が入ってきた。"],["He comes to see me once in a while.","彼は時々私に会いに来てくれる。"]]],["computer",0,0,0,"計算機、電子計算機",[["You may use my computer if you want to.","俺のパソコン使いたかったら、使っていいよ。"],["I spend all day in front of my computer.","一日中パソコンに向かってるよ。"]]],["concert",0,0,0,"演奏会",[["Let me get you a ticket to the concert.","そのコンサートのチケット、買ってきてあげるよ。"],["Can I buy a ticket for the concert here?","コンサートのチケットはここで買えますか。"]]],["contest",0,0,0,"競争",[["She plans to take part in the beauty contest.","彼女は美人コンテストに参加するつもりだ。"],["She won first prize in the speech contest.","彼女はスピーチコンテストで１等賞を取った。"]]],["conversation",0,0,0,"会話",[["He often breaks into the middle of a conversation.","彼は会話の最中に口を挟むことがよくある。"],["Tom found it difficult to keep the conversation going.","トムは会話を続けるのは難しいとわかった。"]]],["cook",0,0,0,"料理人、コック",[["It is said that she is a good cook.","彼女は料理が上手だそうだ。"],["Tom won't eat the food I cook for him.","トムは、私が作った料理は食べてくれないのよ。"]]],["cook",0,1,0,"料理する",[["I'm afraid that I'm not much of a cook.","私はたいして料理がうまくないと思うのですが。"],["I didn't know you were such a good cook.","きみがこんなに料理がじょうずだとは知らなかった。"]]],["cookie",0,0,0,"クッキー( biscuit)",[["Cookie would be a good name for a cat.","クッキーは猫の名前に良さそうだ。"],["\"Where are my cookies?\" \"Sorry, I ate them all.\"","「僕のクッキーは？」「ごめん、全部食べちゃった」"]]],["cool",0,2,0,"涼しい、冷静な、冷淡な",[["I wish I could be as cool as you.","あなたみたいにカッコよくなりたいな。"],["It was cool in the shade of the trees.","木陰は涼しかった。"]]],["cop",0,0,0,"警官、ポリ公、…を捕らえる",[["I have to call the cops.","警察を呼ばなきゃ。"],["You look like a cop.","警官みたいですね。"]]],["copy",0,0,0,"部、冊",[["Tom, will you let me copy your math homework?","トム、数学の宿題写させてくれない？"],["Send a copy of the report to me.","レポートのコピー、送って。"]]],["corn",0,0,0,"とうもろこし、穀草、穀物",[["I have had a corn removed from my foot.","足の魚の目を取ってもらいました。"],["I have a corn on my right foot.","右脚にうおのめができています。"]]],["corner",0,0,0,"かど、すみ、町かど",[["I am going to the theater on the corner.","角の劇場に行くところです。"],["Tom went to the corner store to buy milk.","トムは牛乳を買いに、そこの角のお店に行ったよ。"]]],["correct",0,2,0,"正しい",[["If you see a mistake, then please correct it.","もし間違いを見つけたら訂正してください。"],["I don't know what the correct answer is.","正解が分かりません。"]]],["couch",0,0,0,"長いす",[["There is a TV remote control under the couch.","テレビのリモコンがソファーの下にある。"],["No problem. I can sleep on the couch.","構わないよ。ソファーで寝れるし。"]]],["could",0,9,0,"することができた、できる[ならば]、できていた[ならば]",[["I wish I could be as cool as you.","あなたみたいにカッコよくなりたいな。"],["I could swim well when I was a boy.","私は子供のときは上手に泳げました。"]]],["course",0,0,0,"進路、経過、方針",[["Of course you can take it if you want.","もちろん欲しければとってもいいよ。"],["But of course that was a long time ago.","でも、もちろん、ずっと昔のことだけど。"]]],["cousin",0,0,0,"いとこ、親類",[["My cousin is a little older than I am.","私のいとこは私より少し年上です。"],["I have no idea how many cousins Tom has.","トムに何人いとこがいるかなんて、知らないよ。"]]],["cover",0,0,0,"表紙",[["The politician tried to cover up the insider trading.","政治家が、インサイダー取引を包み隠そうとした。"],["We have a lot of ground to cover.","話し合わねばならないことがたくさんある。"]]],["cow",0,0,0,"雌牛",[["Cows give us milk and chickens give us eggs.","牛はミルクを、鶏は卵を私たちに与えてくれる。"],["I have one thousand five hundred cows.","私は1500頭の牛を飼育している。"]]],["cream",0,0,0,"クリーム、クリーム菓子、化粧クリーム",[["Please put a lot of cream in my coffee.","コーヒーにはミルクをたくさん入れて下さい。"],["She treated each of us to an ice cream.","彼女は私たち一人一人にアイスクリームをおごってくれた。"]]],["credit card",0,0,0,"クレジットカード",[["I usually use a credit card instead of cash.","普段は現金じゃなくてクレカを使うんだ。"],["I paid for it with a credit card.","クレジットカードで払いました。"]]],["cry",0,0,0,"叫び[声];(鳥・獣の)鳴き声、ほえ声、声をあげて泣くこと",[["I can't bear to see him cry like that.","彼があんな風に泣くのを見るのは堪えられない。"],["I cry every time I listen to this song.","この歌を聴くたびに私は泣いてしまう。"]]],["culture",0,0,0,"教養、文化、耕作",[["He is what we call a man of culture.","彼はいわゆる文化人である。"],["The two regions differ in religion and culture.","両地域は宗教と文化が違っている。"]]],["cup",0,0,0,"茶わん、茶わん1杯",[["I had a cup of coffee at the cafe.","私は喫茶店でコーヒーを１杯飲みました。"],["We had a chat over a cup of coffee.","私たちはコーヒーを飲みながらおしゃべりをした。"]]],["cut",0,1,0,"切る、切断する、刻む",[["Tom is not cut out to be a teacher.","トムは教師には向いていない。"],["I am not cut out to be a politician.","私には政治家の素質はありません。"]]],["cute",0,2,0,"かわいい",[["Who do "チョコありがとう。おいしかったよ。"]]],["describe",0,1,0,"描写する、描く",[["Can you describe the situation you were in?","あなたがいたときの状況を説明してくれませんか。"],["Tom described his new invention to both John and Mary.","トムは自分の新しい発明をジョンとメアリーの二人に説明した。"]]],["design",0,0,0,"図案、計画",[["The new design is much better than the old one.","その新しいデザインは古いのよりずっとよい。"],["This new design is much better than the old one.","この新しいデザイン、前のより断然いいね。"]]],["desk",0,0,0,"机",[["This desk is a bit too low for me.","この机は、私にはちょっと低すぎる。"],["You can use my desk if you want to.","使いたければ僕の机を使ってもいいよ。"]]],["dictionary",0,0,0,"辞書",[["I like to have my dictionary within easy reach.","辞書は手元に置いておきたいんだ。"],["Look up the word in the dictionary for yourself.","その単語、自分で辞書で調べてごらん。"]]],["did",0,9,0,"doの過去形",[["I did it the way he told me to.","私は彼の言う通りにした。"],["He was sick, so he did not go out.","彼は病気だった、それで外出しなかった。"]]],["difference",0,0,0,"相違点、差",[["How can we make a difference in the world?","世界を変えるためには、どうしたらいいですか。"],["Do you know the difference between silver and tin?","銀とブリキの区別がつきますか。"]]],["different",0,2,0,"個々の、種種の",[["He is different from what he used to be.","彼は昔の彼とは違うのよ。"],["My sister and I are different in every way.","姉と私は、あらゆる点で違う。"]]],["difficult",0,2,0,"難しい、気難しい",[["This is a little difficult for me to say.","ちょっと言いにくい話なんだけど。"],["I found it difficult to be kind to others.","私は他人に親切にすることは難しいとわかった。"]]],["dig",0,0,0,"掘る、掘り出す",[["Let's dig up the potatoes.","じゃが芋を掘りましょう。"]]],["dining room",0,0,0,"食堂",[["There are two pencils on the dining room table.","食卓には鉛筆が二本あります。"],["What time does the dining room open?","食堂は何時にあきますか。"]]],["dinner",0,0,0,"主要な食事、夕食",[["I went to the dinner I was invited to.","夕食をお呼ばれに行きました。"],["I feed my dog just before I eat dinner.","私は晩ご飯の直前に犬にエサをやる。"]]],["dirty",0,2,0,"汚い、不正な、下品な",[["I saw a dirty dog coming into the garden.","汚い犬が庭に入ってくるのが見えました。"],["These clothes are dirty and need to be washed.","この服汚いから洗濯しなきゃね。"]]],["discuss",0,1,0,"論ずる",[["Will you make a list of issues to discuss?","話し合う問題のリストを作って下さい。"],["I have s fast each time I see her.","彼女に会うたびに胸がどきどきする。"]]],["each other",1,6,0,"",[["They seem to be in love with each other.","あの二人はどうもできているらしい。"],["It seems those two are made for each other.","あの２人は相性がいいようだ。"]]],["ear",0,0,0,"耳、聴覚",[["If you have a better idea, I'm all ears.","もっといい考えがあるんなら、ぜひ聞かせてよ。"],["She closed her ears to what he was saying.","彼女は彼の言うことに耳を貸さなかった。"]]],["early",0,3,0,"早い、初期の、早く",[["I make it a rule to get up early.","私は早く起きることにしている。"],["I don't get up as early as you do.","私はあなたほど早起きではない。"]]],["easy",0,2,0,"容易な、心配のない",[["Sit down and take it easy for a while.","しばらく座ってのんびりして下さい。"],["It isn't easy to find a job these days.","近頃は仕事を見つけるのが簡単じゃない。"]]],["eat",0,1,0,"食べる",[["Tom used to eat a lot of junk food.","トムは以前はジャンクフードをたくさん食べていた。"],["Why don't we go grab a bite to eat?","軽く食べに行かない？"]]],["egg",0,0,0,"卵",[["There are a lot of eggs in the box.","その箱の中にはたくさんの卵があります。"],["I wanted Tom to buy some eggs for me.","トムに卵を買ってきて欲しかったんだよ。"]]],["eight",0,8,0,"(数の)8;8の記号(8、VIIIなど)、8時、8分;8歳",[["If you go around eight, you might meet him.","８時にいけば彼に会えるかもしれない。"],["Tom sits at his computer eight hours a day.","トムは一日八時間、コンピューターに向かっている。"]]],["eighteen",0,8,0,"18の",[["When I first met Tom, I was eighteen.","初めてトムに会ったのは18歳のときでした。"],["Mary joined the army when she was eighteen.","メアリーは18の時、軍隊に入隊しました。"]]],["eighty",0,8,0,"80の",[["My grandfather died of a disease at eighty.","祖父は８０歳のときに病気で亡くなりました。"],["He lived to be eighty years old.","彼は８０歳まで生きた。"]]],["either",0,3,0,"どちらかの、どちらか一方、どちらでも",[["I didn't know that you were coming here either.","私もあなたがここにいらっしゃるとは知りませんでした。"],["If Tom isn't going there, I'm not going either.","そこにトムが行かないんなら、私も行かない。"]]],["elementary",0,2,0,"初歩の",[["We used to play musical chairs in elementary school.","小学校の時、よく椅子取りゲームをして遊びました。"],["Tom and Mary have been friends since elementary school.","トムとメアリーは小学校時代からの友達なんだ。"]]],["eleven",0,8,0,"11の",[["Be at the station at eleven on the dot.","１１時カッキリに駅に来てください。"],["It is a little after a quarter to eleven.","１１時１５分前 arty.","パーティーには５０人以上の女の子がいた。"]]],["fight",0,0,0,"闘志",[["She didn't plan on having a fight with him.","彼女は彼とけんかをするつもりはなかった。"],["I had a fight with my older brother yesterday.","私は昨日、兄と喧嘩をした。"]]],["file",0,0,0,"ファイル",[["In which folder did you save the file?","どのフォルダにファイルを保存しましたか。"],["I would file a police report if I were you.","私だったら、被害届を出すけど。"]]],["fill",0,1,0,"いっぱいにする、占める、いっぱいになる",[["Please fill in the required information on this form.","この用紙に必須事項を記入してください。"],["I filled in my name on the form.","用紙に自分の名を記入した。"]]],["find",0,1,0,"見つける、見つけだす、分かる",[["At last, he found out how to make it.","ついに彼はその作り方を発見した。"],["I wish I could find one just like it.","私もそういうのが欲しいです。"]]],["fine",0,2,0,"りっぱな、元気な",[["I will go out if it is fine tomorrow.","明日天気なら外出します。"],["I'll be fine if I take a little rest.","ちょっと休めば大丈夫です。"]]],["finish",0,0,0,"最終段階",[["How long will it take to finish the work?","その作業はどれくらいで終わりますか？"],["I will go out after I finish my homework.","宿題を終えたら出かけます。"]]],["finish",0,1,0,"終える、の仕上げをする、終わる",[["It will be finished in a day or two.","それは１日か２日で仕上がる。"],["I finished the work in less than an hour.","私はその仕事を１時間足らずで終えた。"]]],["fire",0,0,0,"火、火事",[["It was so cold that we made a fire.","とても寒かったので火をたいた。"],["What should I do in case of a fire?","火事のとき、どうすればいいのでしょうか。"]]],["first",0,2,0,"第1の、1番の、最初のもの",[["She acted in a play for the first time.","彼女は初めて劇に出た。"],["He fell in love with her at first sight.","彼は彼女に一目ぼれしてしまった。"]]],["first",0,3,0,"第1の、1番の、最初に",[["I fell in love with Mary at first sight.","メアリーに一目惚れしてしまった。"],["I got up early to catch the first train.","私は始発電車に乗るために早起きした。"]]],["fish",0,0,0,"魚",[["Air is to us what water is to fish.","魚に水が必要なように、我々には空気が必要である。"],["There are a lot of fish in the sea.","魚は海にはいくらでもいる。"]]],["fishing",0,0,0,"魚取り",[["What do you say to going fishing with me?","一緒に魚釣りに行きませんか。"],["I got up early this morning to go fishing.","釣りに行くために今朝は早く起きました。"]]],["five",0,8,0,"5の",[["I want to stay at a five-star hotel.","５つ星ホテルに泊まりたい。"],["Give me five tens and the rest in ones.","１０ドル紙幣を５枚、残りは１ドル紙幣でお願いします。"]]],["flag",0,0,0,"旗",[["There was a flag at the top of the pole.","棒のてっぺんには旗が付いていた。"],["We put up the flags on national holidays.","私たちは国民の祝日に旗を立てる。"]]],["flat",0,0,0,"きっぱりと、平面",[["She got a flat tire on her way home.","彼女の車は家に帰る途中でパンクした。"],["This cola has gone flat and doesn't taste good.","このコーラ、炭酸が抜けちゃっておいしくない。"]]],["floor",0,0,0,"床、階",[["The dish fell on the floor with a crash.","皿が床に落ちてガチャンと大きな音がした。"],["She had the box carried to the first floor.","彼女はその箱を１階に運んでもらった。"]]],["flower",0,0,0,"花、草花",[["There are a lot of flowers in the garden.","庭にはたくさんの花がある。"],["Were you the one who sent me these flowers?","この花を送ってくれたのって、あなただったの？"]]],["fly",0,0,0,"ハエ",[["I can no more swim than I can fly.","私は空を飛べないのと同じく泳ぐこともできない。"],["I'm so happy, I feel like I could fly.","天にも昇るような気持ちです。"]]],["fly",0,1,0,"飛ぶ、飛行機で飛ぶ、飛ぶように動く",[["We saw a jet plane fly across the sky.","空を飛んでるジェット機が見えたよ。"],["It is dangerous to fly in this heavy fog.","濃霧のため飛ぶのは危険だ。"]]],["focus",0,1,0,"焦点を合わせる",[["It's hard to get this camera to focus.","このカメラ、ピントが合わせにくいんだ。"],["I tried to focus my attention on reading.","私は読書に集中しようとした。"]]],["foggy",0,2,0,"霧の立ちこめた、霧のかかった;(天候が)霧の多い、(像などが)霧がかかったような",[["She slowly disappeared into the foggy forest.","彼女は霧の立ち込めた森の中へゆっくりと消えていった。"],["Was it foggy yesterday?","昨日は霧が出てた？"]]],["following",0,2,0,"次の、次に述べるもの",[["Please send bug reports to the following email address.","バグ報告を下記のメールアドレスに送ってください。"],["Tell Tom to stop following me around.","私に付きまとうのをやめるように、トムに言ってください。"]]],["food",0,0,0,"食物",[["Tom used to eat a lot of junk food.","トムは以前はジャンクフードをたくさん食べていた。"],["I try not to eat too much junk food.","ジャンクフードは食べ過ぎないようにしてるよ。"]]],["football",0,0,0,"フットボール",[["I thought that you always played football on Saturday.","土曜日はいつもアメフトをしているのかと思っていました。"],["Did you get hurt in the football game?","フットボールの試合でけがをしたのかい？"]]],["for",0,4,0,"…の間、…のために、…向きの(に)",[["Is it OK if I go for a walk?","散歩に出かけてもいいですか？"],["It is time for you to go to bed.","もうお前は寝る時間だ。"]]],["foreign",0,2,0,"外国の",[["I want to go to a foreign country someday.","いつか外国へ行きたいなぁ。"],["Wherever I go, I get treated like a foreigner.","どこに行っても、外国人扱いされちゃうのよ。"]]],["foreigner",0,0,0,"外国人",[["Wherever I go, I get treated like a foreigner.","どこに行っても、外国人扱いされちゃうのよ。"],["Until now, I've never been spoken to by a foreigner.","今までさ、一度も外国人に話しかけられたことないんだ。"]]],["forget",0,1,0,"忘れる、怠る",[["I forgot the key and went back for it.","私は鍵を忘れて取りに戻った。"],["I had intended to go, but I forgot to.","行くつもりだったのに、忘れてたんだ。"]]],["form",0,0,0,"人体、外観、形態",[["Please fill in the required information on this form.","この用紙に必須事項を記入してください。"],["I filled in my name on the form.","用紙に自分の名を記入した。"]]],["forty",0,8,0,"(数の)40;40の記号(40、XLなど)、40分;40歳",[["My father died at the age of forty-nine.","父は４９歳で亡くなった。"],["They had not fought for more than forty years.","彼らは４０年以上戦闘を行わなかった。"]]],["four",0,8,0,"(数の)4;4の記号(4、IVなど)、4時、4分;4歳",[["I got a room in a four-star hotel.","4つ星ホテルの部屋をとったよ。"],["He has been ill in bed for four days.","彼は、病気で４日間ずっと寝ている。"]]],["fourteen",0,8,0,"(数の)14;14の記号(14、XIVなど)、(24時間制の)14時、14分;1",[["I'm going to be fourteen.","私はもうすぐ１４歳になります。"],["Seven times two is fourteen.","7かける2は14。"]]],["free",0,2,0,"自由な、無料の",[["What do you guys do in your free time?","暇な時は何をしていますか。"],["You are free to leave any time you wish.","いつでも好きな時に帰って構いません。"]]],["Friday",0,0,0,"金曜日(Fr.、Fri.)",[["On Fridays, I go to work in jeans.","金曜日は、ジーンズで出勤してるよ。"],["I need to know your answer by Friday.","金曜日までに回答が必要です。"]]],["friend",0,0,0,"友人、友だち、味方、支持者",[["I have a lot of friends to help me.","私には助けてくれる友達がたくさんいる。"],["A host of friends came to see me off.","たくさんの友人が見送りにやってきた。"]]],["frog",0,0,0,"カエル",[["There are a lot of frogs in this pond.","この池にはカエルがたくさんいます。"],["A frog in a well doesn't know the ocean.","井の中の蛙、大海を知らず。"]]],["from",0,4,0,"…から",[["How do I get to the beach from here?","ここからビーチまではどうやって行けばいいの？"],["How far is it from here to the park?","ここから公園までどれくらいありますか。"]]],["front",0,2,0,"正面の",[["A car drew up in front of my house.","一台の車が私の家の前で止まった。"],["A monkey ran out in front of our bus.","サルが、私たちが乗ってるバスの前に飛び出してきたのよ。"]]],["fruit",0,0,0,"果物、農作物、成果",[["I spilled some fruit juice on my new shirt.","新しいシャツにフルーツジュースを少しこぼしてしまった。"],["The tree bent under the weight of the fruit.","実の重みで木がたわんでいた。"]]],["full",0,2,0,"いっぱいの、完全な",[["We set out on our journey full of hope.","私たちは期待に胸をふくらませて旅立った。"],["It's not polite to speak with your mouth full.","口に食べ物がいっぱい入ったままで話すのは、お行儀良くないな。"]]],["fun",0,2,0,"楽しみ",[["I had a lot of fun at the party.","パーティーでは大いに楽しんだ。"],["It's a lot of fun to be with you.","あなたと一緒にいるととても楽しいわ。"]]],["fun",0,0,0,"楽しみ",[["I still have a lot of time for fun.","まだまだたっぷりと遊ぶ時間はあるぜ。"],["It's a lot of fun to listen to music.","音楽を聴くのはとても楽しい。"]]],["funny",0,2,0,"おかしい",[["Tom doesn't find this as funny as Mary does.","トムはメアリーが思っているほどこれを面白いとは思わない。"],["Tom has a funny way of laughing, doesn't he?","トムって変な笑い方するよね。"]]],["future",0,0,0,"未来",[["I want to be a pilot in the future.","将来はパイロットになりたいです。"],["I want to be a dentist in the future.","私は将来歯医者になりたい。"]]],["game",0,0,0,"遊び、競技",[["The game will be held even if it rains.","試合は雨天決行です。"],["What kind of game do you think this is?","これはどんなゲームだと思いますか。"]]],["garbage",0,0,0,"(台所から出る)生ごみ、食べかす、残飯、くだらないもの、がらくた",[["Tom rushed to the window to watch the garbage truck.","トムったら、ゴミ収集車を見ようと窓に駆けってったよ。"],["Can you take out the garbage?","ゴミを出してくれる？"]]],["garden",0,0,0,"庭、公園",[["There are a lot of rocks in this garden.","この庭にはたくさんの岩がある。"],["There are a lot of roses in this garden.","この庭にはバラの花がたくさんある。"]]],["get",0,1,0,"受け取る、手に入れる、取ってくる",[["I saw a boy get hit by a car.","少年が車にはねられるのを見たのです。"],["I got cold, so I put on my coat.","体が冷えたので、私はコートを着た。"]]],["ghost",0,0,0,"幽霊",[["What would you do if you saw a ghost?","もし幽霊を見たら、どうしますか。"],["Dr. Skeleton is known for his study on ghosts.","スケルトン博士は幽霊の研究で知られている。"]]],["gift",0,0,0,"贈り物、生まれつきの才能",[["I forgot to buy a gift for you.","プレゼント買うの忘れてた。"],["This doll is a gift from my aunt.","この人形は叔母からの贈り物です。"]]],["girl",0,0,0,"女の子、少女",[["There are a lot of girls in the room.","部屋にはたくさんの少女がいる。"],["I know a girl whose father is a lawyer.","父親が弁護士の女の子と知り合いだよ。"]]],["girlfriend",0,0,0,"女友だち、ガールフレンド、(女の)恋人",[["My girlfriend is a lot taller than I am.","僕の彼女、僕よりかなり背が高いんだ。"],["I don't want to say that to my girlfriend.","彼女にそんなことは言いたくないよ。"]]],["give",0,1,0,"与える、渡す、支払う",[["I gave up my seat to an old lady.","私は老婦人に席を譲った。"],["Do you want me to give you a hand?","お手伝いしましょうか。"]]],["glad",0,2,0,"うれしい、喜ばしい",[["I think he will be glad to see you.","あなたに会えば彼は喜ぶと思います。"],["He will be only too glad to help you.","彼は大喜びであなたを手伝ってくれるでしょう。"]]],["glass",0,0,0,"ガラス、コップ、コップ(グラス)1杯[の量]",[["I need to get a new pair of glasses.","僕は新しい眼鏡が必要だ。"],["There was broken glass on top of the wall.","塀の上には割れたガラスがありました。"]]],["glasses",0,0,0,"",[["I need to get a new pair of glasses.","僕は新しい眼鏡が必要だ。"],["As a child, I was teased for wearing glasses.","子どもの頃、メガネをかけていることでからかわれたことがあります。"]]],["go",0,1,0,"行く、立ち去る",[["Is it OK if I go for a walk?","散歩に出かけてもいいですか？"],["I go to bed at ten as a rule.","大抵１０時には寝るよ。"]]],["goal",0,0,0,"ゴール、目標",[["The crowd yelled when he scored a goal.","彼が得点を挙げると群集は大声を上げた。"],["You must not lose sight of your goal in life.","人生の目標を見失ってはいけない。"]]],["gold",0,2,0,"金の",[["The door had a big gold star on it.","ドアには大きな金色の星がついていました。"],["The price of gold varies from day to day.","金の値段は日ごとに変わる。"]]],["good",0,2,0,"よい、善良な、行儀がよい",[["I'm not sure if it was good or bad.","良かったのか、悪かったのかよく分かんないけど。"],["It is said that she is a good cook.","彼女は料理が上手だそうだ。"]]],["good afternoon",1,10,0,"こんにちは",[]],["good morning",1,10,0,"おはよう",[["\"Good morning,\" said Tom with a smile on his face.","トムは笑顔で「おはよう」と言った。"],["Good morning. It's time to get up.","おはよう。起きる時間だよ。"]]],["good night",1,10,0,"お休みなさい",[["Did you have a good night last night?","昨日はよく眠れましたか？"],["Tom didn't give me a good night kiss.","トムがおやすみのキスをしてくれなかったの。"]]],["grade",0,0,0,"学年、成績、階級",[["I need to talk to you about your grades.","あなたの成績のことで話があります。"],["My parents were satisfied with my grades this year.","両親は私の今年の成績に満足した。"]]],["grammar",0,0,0,"文法",[["You know a lot of grammar, don't you?","君ってさ、よく文法知ってるよね？"],["I have a grammar book.","文法の本ならあるよ。"]]],["grandfather",0,0,0,"祖父",[["When I see him, I think of my grandfather.","彼を見ると祖父を思い出します。"],["My grandfather goes for a walk on fine days.","ぼくのおじいさんは、天気の日には散歩に出かけます。"]]],["grandma",0,0,0,"おばあちゃん",[["Grandma is three and a half times your age.","祖母はあなたの3.5倍の歳。"],["My grandma injured her leg in a fall.","おばあちゃんが転んで、足にけがをしちゃったんです。"]]],["grandmother",0,0,0,"祖母",[["The baby was taken care of by its grandmother.","その赤ちゃんはおばあさんに世話をしてもらった。"],["My grandmother lived to be ninety-five years old.","祖母は９５歳まで生きました。"]]],["grandpa",0,0,0,"おじいちゃん",[["My grandpa was a chef a long time ago.","おじいちゃんは昔、板前さんでした。"],["Grandpa fell down the stairs and was seriously injured.","おじいちゃんが階段から落ちて大怪我をしたんだ。"]]],["grandparent",0,0,0,"祖父母;その一方",[["I live with my mother, brother and my grandparents.","母、弟、祖父母と一緒に住んでいます。"],["After their parents died, their grandparents brought them up.","両親が亡くなった後、祖父母が彼らを育てた。"]]],["grape",0,0,0,"ぶどう",[["I like grapes, but I can't eat so many.","ぶどうは好きだけど、そんなにたくさんは食べられないよ。"],["Don't eat all the grapes. Leave some for Tom.","葡萄、全部食べないで。トムに残してあげて。"]]],["grass",0,0,0,"草、草地",[["The grass is always greener on the other side.","隣の芝は青い。"],["There was a sign saying, \"Keep off the grass.\"","「芝生に入らないで下さい」という標識があった。"]]],["gray",0,2,0,"灰色の",[["I like the gray sweater more than the purple one.","紫色のセーターより灰色のセーターの方が好きです。"],["All cats are gray in the dark.","夜中の猫はどれも灰色。"]]],["gray",0,0,0,"灰色",[["Is your new coat black or gray?","新しいコートって、黒なの？それともグレー？"],["My grandmother has gray hair.","僕のおばあちゃん、白髪なんだ。"]]],["great",0,2,0,"大きい、多数の、多量の",[["His death was a great loss to our firm.","彼の死は我が社にとって大きな痛手であった。"],["It's a sunny day today and I feel great.","今日は快晴で気分がいい。"]]],["green",0,2,0,"緑の、緑色の",[["The grass is always greener on the other side.","隣の芝は青い。"],["Do you prefer green tea or black tea?","緑茶と紅茶、どっちが好き？"]]],["greet",0,1,0,"あいさつする",[["She greeted me with a big smile.","彼女はにっこり笑って僕に挨拶した。"],["He greeted me with a smile.","笑顔で迎えてくれました。"]]],["grey",0,2,0,"灰色の",[["I like the gray sweater more than the purple one.","紫色のセーターより灰色のセーターの方が好きです。"],["All cats are gray in the dark.","夜中の猫はどれも灰色。"]]],["grey",0,0,0,"灰色",[["Is your new coat black or gray?","新しいコートって、黒なの？それともグレー？"],["My grandmother has gray hair.","僕のおばあちゃん、白髪なんだ。"]]],["ground",0,0,0,"地面、土、土地",[["I'm afraid we can't make up for lost ground.","遅れを取り戻すのは無理だと思うんです。"],["The runner jumped over the hole in the ground.","その走者は地面に空いた穴を飛び越えた。"]]],["group",0,0,0,"群れ、派、団体",[["I told you never to move in a group.","かたまって行動するなと言ったんだ。"],["Do you have something to do with this group?","あなたはこのグループと何か関係があるんですか。"]]],["grow",0,1,0,"成長する、増大する、しだいになる",[["He has grown up to be a fine gentleman.","彼は成長して立派な紳士になった。"],["I want to teach history when I grow up.","おとなになったら歴史を教えたい。"]]],["guess",0,1,0,"推測する、言い当てる、思う",[["I guess it's too late to do that now.","今更そんなことしたって、遅いと思うよ。"],["My guess is that it will be fine tomorrow.","あしたはよい天気だと思います。"]]],["guest",0,0,0,"招待客",[["Among the guests were the mayor and his wife.","招待客の中には市長とその夫人がいた。"],["Is it OK if I bring a guest?","お客さん連れてきていい？"]]],["guitar",0,0,0,"ギター",[["I want you to play the guitar for me.","私にギターを弾いて聞かせてよ。"],["I want to learn how to play the guitar.","ギター弾けるようになりたい。"]]],["guy",0,0,0,"控え綱、支え綱(テント・棒などを倒れないように張る綱)、…に控え綱を張る(で締め",[["I'm not the same guy I used to be.","俺はもう昔の俺じゃないんだ。"],["I think that Tom is really a good guy.","トムは本当はいいヤツなんだと思う。"]]],["habit",0,0,0,"習慣",[["It isn't easy to get rid of bad habits.","悪癖を捨てるのは簡単ではない。"],["He was in the habit of getting up early.","早起きは彼の習慣だった。"]]],["had",0,9,0,"して[しまって]いた、したことがあった、していた、してきた",[["I wish I had a room of my own.","私専用の部屋があればいいのですが。"],["I had a puppy when I was a boy.","子供の頃、小犬を飼っていた。"]]],["hair",0,0,0,"毛、髪の毛",[["It's very windy and my hair got messed up.","風が強すぎて、髪の毛がぐしゃぐしゃになっちゃった。"],["I think you were better looking with long hair.","お前は髪長い方が似合ってたと思う ],["It's a pain but I have to do it.","めんどうくさいけどやらないとね。"]]],["have to",1,9,0,"",[["It's a pain but I have to do it.","めんどうくさいけどやらないとね。"],["I have to buy a new pair of skis.","新しいスキー板を買わなくてはいけない。"]]],["having",0,9,0,"",[["What do you say to having a coffee break?","ちょっとお茶でも飲んで休憩しませんか。"],["Having a slight cold, I went to bed early.","風邪気味だったので、早く寝たよ。"]]],["he",0,6,0,"彼は、彼が、その人、あの人、自分",[["I did it the way he told me to.","私は彼の言う通りにした。"],["I wish I were as rich as he is.","私が彼と同じくらい金持ちだったらよいのだが。"]]],["head",0,0,0,"頭、頭脳、長",[["I felt a drop of rain on my head.","頭に雨がポツリと当たった気がした。"],["I felt a touch of pain in my head.","私は頭に少し痛みを感じた。"]]],["headache",0,0,0,"頭痛",[["I woke up with a headache again this morning.","今日もまた、目が覚めると頭が痛かった。"],["Tom told us that he had a headache.","トムは頭が痛いと私たちに言った。"]]],["health",0,0,0,"健康",[["I did so for the sake of my health.","私は自分のためにそうしたんです。"],["He worked hard at the risk of his health.","彼は健康を犠牲にして懸命に働いた。"]]],["healthy",0,2,0,"健康な、健康によい",[["I'm not as healthy as I used to be.","私は昔ほど健康ではない。"],["Some of them are healthy, but others are not.","彼らの中には健康な人もいれば、そうでない人もいる。"]]],["hear",0,1,0,"聞こえる、耳を傾ける、耳にしている",[["I can hear you, but I can't see you.","声は聞こえるけど、見えないよ。"],["I had to shout in order to be heard.","聞こえるように、僕は叫ばなければいけなかった。"]]],["heart",0,0,0,"心臓、心、勇気",[["He put all his heart and soul into it.","それに全身全霊を傾けた。"],["I love you from the bottom of my heart.","心から愛してるよ。"]]],["heavy",0,2,0,"重い、激しい、厳しい",[["This box is too heavy for me to carry.","この箱は重すぎてあたしには運べない。"],["This stone was too heavy for me to lift.","この石はとても重かったので持ち上げることができなかった。"]]],["hello",0,0,0,"もしもし、こんにちは",[["I said hello to her and she smiled.","私が彼女に「ハロー」と挨拶すると彼女は微笑んだ。"],["Please say hello to your wife for me.","奥様にもよろしくお伝えください。"]]],["help",0,1,0,"手伝う、助ける",[["I am pleased to help you if I can.","私に出来る事でしたら喜んでお手伝いします。"],["I have a lot of friends to help me.","私には助けてくれる友達がたくさんいる。"]]],["her",0,7,0,"彼女の、彼女に",[["I will do anything I can do for her.","私は彼女のためなら何でもする。"],["It's true that I he hole in the ground.","その走者は地面に空いた穴を飛び越えた。"],["The rat made a hole in the wall.","ねずみが壁に穴をあけた。"]]],["holiday",0,0,0,"長い休暇",[["Our holiday plans are still up in the air.","私達の休暇の計画はまだ決まってない。"],["Can you afford to take a holiday this summer?","今年の夏は休みが取れそう？"]]],["home",0,0,0,"家、家庭、生まれ故郷",[["I want to be a stay-at-home dad.","専業主夫になりたい。"],["Is it all right if I go home now?","もう家に帰ってもいいですか？"]]],["hometown",0,0,0,"今までいちばん長く住んだ町(市);子供のとき過ごした町(市);生まれた町(市)",[["I returned to my hometown after five years' absence.","5年ぶりに故郷へ戻った。"],["Tom has written several songs about his hometown.","トムは故郷の曲をいくつか書いている。"]]],["homework",0,0,0,"宿題",[["I have a lot of homework to do today.","私には今日しなければならない宿題がたくさんある。"],["Is it OK if I leave my homework here?","僕の宿題ここに置いて行ってもいい？"]]],["hope",0,0,0,"望み、希望",[["I do hope that he will get well soon.","彼がすぐに良くなるように、心から願っています。"],["I hope to build a new house next year.","来年は新しい家を建てたい。"]]],["horse",0,0,0,"馬",[["I like to ride a horse now and then.","私は時々馬に乗るのを楽しみます。"],["A horse can run faster than a man can.","馬は人間よりも速く走れる。"]]],["hospital",0,0,0,"病院",[["I went to the hospital to see my wife.","私は妻を見舞いに病院に行った。"],["When I came to, I was in the hospital.","意識が戻ると、私は病院にいた。"]]],["hot",0,2,0,"熱い、暑い、辛い",[["It was so hot I took my coat off.","とても暑かったので上着を脱いだ。"],["It was hot, so I turned on the fan.","暑かったので扇風機をつけた。"]]],["hotel",0,0,0,"ホテル",[["I got a room in a four-star hotel.","4つ星ホテルの部屋をとったよ。"],["I want to stay at a five-star hotel.","５つ星ホテルに泊まりたい。"]]],["hour",0,0,0,"1時間、時刻",[["How many hours a day do you watch TV?","テレビは、一日何時間くらい見てる？"],["I can walk to school in half an hour.","学校までは歩いて３０分で行けます。"]]],["house",0,0,0,"家",[["I wish I had a house of my own.","自分の家があったらな。"],["A car drew up in front of my house.","一台の車が私の家の前で止まった。"]]],["how",0,3,0,"どんなふうに、どれほど、どんなふうで",[["I wish I had known how to do it.","やり方が分かっていればなあ。"],["How many times do I have to say it?","何度言わせるつもりだ。"]]],["hungry",0,2,0,"飢えた",[["I'm so hungry that I could eat a horse.","お腹と背中がくっつきそうなくらい腹ぺこだよ。" n't laugh.","トムに冗談を言ったのに、笑ってくれなかった。"],["I don't know whether to cry or to laugh.","泣いてよいのか笑ってよいのかわからない。"]]],["lazy",0,2,0,"怠惰な",[["She doesn't have a lazy bone in her body.","彼女ってまめだね。"],["As far as I know, he isn't lazy.","私の知っている限りでは、彼はなまけ者ではない。"]]],["leader",0,0,0,"指導者",[["The leader of the party is a famous scientist.","一行のリーダーは有名な科学者だ。"],["The leaders were out of touch with the people.","指導者は国民と没交渉になっていた。"]]],["leaf",0,0,0,"葉、1枚",[["He turned over a new leaf in life.","彼は心機一転やり直した。"],["A fallen leaf floated on the surface of the water.","１枚の落ち葉が水面に浮かんでいた。"]]],["learn",0,1,0,"習う、覚える",[["I want to learn how to play the guitar.","ギター弾けるようになりたい。"],["She managed to learn how to drive a car.","彼女はどうにか車の運転ができるようになった。"]]],["leave",0,1,0,"去る、やめる、ままにしておく",[["He bowed to me as he left the room.","部屋を出るときに、彼は私にお辞儀をした。"],["I have no idea where I left my keys.","どこにカギを置き忘れたのかさっぱり分からないんだ。"]]],["left",0,2,0,"左の",[["He bowed to me as he left the room.","部屋を出るときに、彼は私にお辞儀をした。"],["I have no idea where I left my keys.","どこにカギを置き忘れたのかさっぱり分からないんだ。"]]],["leg",0,0,0,"脚",[["I was bitten in the leg by that dog.","あの犬に足をかまれたんだ。"],["She was wounded by a shot in the leg.","彼女は足を撃たれて負傷した。"]]],["lesson",0,0,0,"授業、課、教訓",[["Tom is doing well in his lessons at school.","トムは学校の勉強をよくやっている。"],["Did you have a piano lesson that day?","その日はピアノのレッスンはあったの？"]]],["let",0,1,0,"させる、しよう、貸す",[["I may go out if the rain lets up.","雨がやんだら外出するかもしれない。"],["Let me know as soon as he gets back.","彼が帰ってきたらすぐに私に知らせてくれ。"]]],["letter",0,0,0,"文字、手紙",[["I got a letter from a very good friend.","すごい仲のいい友達から手紙がきた。"],["I wrote a letter to my parents at home.","私は故郷の両親に手紙を書いた。"]]],["library",0,0,0,"図書館、蔵書",[["I go to the library from time to time.","私は時々図書館に出かける。"],["How far is it to the library from here?","ここから図書館までどれくらいありますか。"]]],["life",0,0,0,"生命、生物、一生",[["No one says it that way in real life.","実生活でそんな言い方する人はいません。"],["I'll love you for the rest of my life.","死ぬまであなたを愛してる。"]]],["light",0,2,0,"明るい、薄い、軽い",[["Is it OK if I uge spider in the living room.","リビングに大きなクモがいたんだ。"],["Tom is in the living room watching the news.","トムならリビングでニュースを見てるよ。"]]],["lonely",0,2,0,"ひとりの、寂しい",[["Since Tom has left, I've been very lonely.","トムが去ってからというもの、とても寂しくてね。"],["She thinks about him when she's feeling lonely.","彼女は寂しくなると彼のことを考える。"]]],["long",0,2,0,"長い、長々しい",[["I want to stay as long as I can.","出来るだけ長く滞在したい。"],["He is no longer the shy boy he was.","彼はもう以前の恥ずかしがり屋の少年ではない。"]]],["look",0,0,0,"じっと見る、見ること、顔つき",[["I want Tom to take a look at that.","私はトムにそれを見てほしい。"],["It looks as if it is going to rain.","雨になるようです。"]]],["look",0,1,0,"見える",[["My father is not as old as he looks.","父は見かけより若いんですよ。"],["Tom is looking for a job as a baker.","トムはパン職人としての仕事を探している。"]]],["lot",0,3,0,"くじ、運命",[["I had a lot of fun at the party.","パーティーでは大いに楽しんだ。"],["I still have a lot of work to do.","やらなければいけない仕事がまだたくさんあるんだ。"]]],["lot",0,6,0,"くじ、運命",[["I wish that I had a lot of money.","うんとお金があればいいのに。"],["It's a lot of fun to be with you.","あなたと一緒にいるととても楽しいわ。"]]],["love",0,0,0,"愛、強い好み",[["I love the sound of rain on the roof.","私は屋根に当たる雨の音が好きだ。"],["I know that Tom would love to see you.","トムが君と会いたがっているって知ってるよ。"]]],["love",0,1,0,"大好きである、恋する",[["I'll love you for the rest of my days.","死ぬまであなたを愛してる。"],["I love you from the bottom of my heart.","心から愛してるよ。"]]],["lovely",0,2,0,"美しい、すばらしい",[["It turned out to be a lovely day.","良い天気になりました。"],["We had a lovely time at the dance.","ダンスパーティー、すごくすてきだったわ。"]]],["luck",0,0,0,"運、幸運",[["Sooner or later, he will run out of luck.","遅かれ早かれ彼の運は尽きるだろう。"],["He thinks that his success is due to luck.","彼は自分の成功を幸運のおかげだと考えている。"]]],["lucky",0,2,0,"幸運の",[["I was lucky enough to get a good seat.","運よくいい席がとれたんだ。"],["It was lucky for you that you found it.","それが見つかったとは運がよかったね。"]]],["lunch",0,0,0,"昼食、昼ごはん(= midday meal)",[["Do you know a good place to have lunch?","お昼ご飯を食べるのにいい場所知ってる？"],["I am hungry because I did not eat lunch.","昼食を取らなかったので、お腹がすいています。"]]],["'m",0,9,0,"amの短縮形",[]],["machine",0,0,0,"機械",[["Th en the man in this photo?","この写真の男性を見たことがありますか。"],["You look just like your father in this photo.","この写真のお父さんに、そっくりね。"]]],["piano",0,0,0,"ピアノ",[["Tom is better at the piano than I am.","トムは私よりピアノが上手い。"],["He can play the piano better than I can.","彼は私よりピアノがうまい。"]]],["pick",0,1,0,"選ぶ、摘む",[["I picked out a new hat at the store.","私は店で新しい帽子を選んだ。"],["I asked her to pick me up around four.","私は彼女に４時ごろ迎えに来てくれるように頼みました。"]]],["picnic",0,0,0,"ピクニック",[["It's too cold to go on a picnic today.","ピクニックに行くには今日は寒すぎるな。"],["A warm, sunny day is ideal for a picnic.","暖かくて晴れた日はピクニックにもってこいだよ。"]]],["picture",0,0,0,"絵、絵画、写真",[["I took a lot of pictures on my trip.","旅行でたくさん写真を撮りました。"],["I had my sister take a picture of me.","僕は妹に写真を撮ってもらった。"]]],["piece",0,0,0,"部分、断片、個",[["He threw a piece of meat to a dog.","彼は一切れの肉を犬に投げ与えた。"],["I wrote my name on a piece of paper.","紙に名前を書きました。"]]],["pig",0,0,0,"豚",[["Tom began to sweat like a pig.","トムは大汗をかき始めた。"],["Pigs are adorable. I want one.","ブタって、かわいい。一匹欲しいな。"]]],["pink",0,2,0,"桃色、ピンク",[["Who is the girl in the pink dress?","ピンクの服を着ている少女は誰ですか。"],["Could you lend me your pink pen, please?","ピンクのペンを貸してもらえませんか？"]]],["pizza",0,0,0,"ピッツァ、ピザ(チーズ・トマトなどをパイ皮にのせて焼いた料理)",[["I used to eat pizza, but now I don't.","前はピザを食べていましたけど、今は全くですね。"],["Hey, do you guys want to order a pizza?","おい、おまえらピザ頼みたい？"]]],["place",0,0,0,"場所、位置、地域",[["Can I stay at your place for a while?","しばらくの間、家に泊めてもらってもいいかな？"],["I don't know how to get to your place.","お前ん家の行き方を知らないんだ。"]]],["plan",0,0,0,"計画、案、設計図",[["Even if it rains, we plan to go hiking.","たとえ雨が降っても、ハイキングに行くつもりだよ。"],["Do you plan to eat all of that yourself?","それ全部一人で食べるつもり？"]]],["plane",0,0,0,"平面、水準、飛行機",[["I had no choice but to take the plane.","僕には飛行機に乗る以外の選択肢がなかった。"],["We saw a jet plane fly across the sky.","空を飛んでるジェット機が見えたよ。"]]],["play",0,0,0,"演劇、戯曲、遊び",[["Is it OK if I go outside and play?","外に遊びに行ってもいい？"],["I told Tom not to play in the road.","道で遊ばないように、トムには言ったよ。"]]],["play",0,1,0,"遊ぶ、競技(試合)をする、演ずる",[["Do you want to play hide-and-go-seek?","かくれんぼしようか？"],["I don't know how to play golf at all.","私はゴルフのやり方はさっぱりわからない。"]]],["player",0,0,0,"競技者、選手、俳優",[["I want to be a good player like you.","あなたのように上手になりたいです。"],["Tom pulled an MP3 player out of his bag.","トムは鞄からMP3プレイヤーを取り出した。"]]],["please",0,3,0,"喜ばせる、どうぞ",[["Please tell me how to get to the bank.","銀行へ行く道を教えて下さい。"],["Please put a lot of cream in my coffee.","コーヒーにはミルクをたくさん入れて下さい。"]]],["pleasure",0,0,0,"喜び、楽しみ、こと",[["It's a pleasure to have you with us again.","またご一緒できて光栄です。"],["Some people write books for money, others for pleasure.","お金のために本を書く人もいれば、楽しみで書く人もいる。"]]],["pm",0,3,0,"promethiumの化学記号",[]],["pocket",0,0,0,"ポケット",[["I'm glad it's not coming out of my pocket.","私が払うのでなくてよかったよ。"],["I didn't take it. You can check my pockets.","盗ってません。ポケット調べれば。"]]],["poem",0,0,0,"詩",[["The teacher compared my poem with one of his.","先生は私の詩と自分のを比べた。"],["Tom loved writing poems when he was a teenager.","トムはね、１０代の頃詩を書くのが好きだったんだよ。"]]],["point",0,0,0,"とがった先、地点、点",[["I make a point of getting up before six.","６時前には起きるようにしてるんだ。"],["The poor girl was on the point of death.","かわいそうにその少女は死にかかっていた。"]]],["pollution",0,0,0,"汚すこと、汚されていること",[["Air pollution is a serious problem in this country.","大気汚染はこの国の深刻な問題だ。"],["The pollution of our coasts is very serious.","我が国の海岸汚染はとても深刻なものである。"]]],["pool",0,0,0,"水たまり、水泳プール",[["It was hot, so we swam in the pool.","暑かったので、プールで泳ぎました。"],["I asked Tom to help me clean the pool.","トムにプール掃除を手伝ってくれないか聞いた。"]]],["poor",0,2,0,"貧乏な、貧しい、貧相な",[["I'm not as poor as you think I am.","お前が思ってるほど、貧乏じゃないって。"],["The crop was poor due to lack of water.","水不足のため不作だった。"]]],["pop",0,0,0,"ポン(パチン、パン)という音",[["Tom is too old to make it as a pop singer.","トムがポップ歌手として成功するには、もう年齢的に無理があるんだよ。"],["This is the reason that she succeeded as a pop singer.","これが彼女がポップス歌手として成功した理由です。"]]],["post",0,0,0,"柱、支柱、部署",[["I want you to go to the post office.","君に郵便局へ行ってもらいたい。"],["This is a post office and that's a bank.","これが郵便局で、あれが銀行です。"]]],["poster",0 料を調達するため店に入った。"],["Do you need me to give you some money?","君にお金をあげるから俺が必要なのか。"]]],["someone",0,6,0,"だれか",[["I'm glad it was someone else who got it.","対岸の火事で良かった。"],["If you need someone to talk to, call me.","話し相手が必要なら、電話してね。"]]],["something",0,6,0,"何か",[["I have something I want to say to you.","お話ししたいことがあります。"],["I have something I want to give to you.","君に渡したい物があるんだ。"]]],["son",0,0,0,"息子",[["My son is now as tall as I am.","息子はもう私と同じ身長だ。"],["I must buy a new suit for my son.","息子に新しい背広を買ってやらなければならない。"]]],["song",0,0,0,"歌、歌曲、歌うような声",[["I can't get that song out of my head.","あの歌が頭から離れないんだ。"],["When I hear this song, I think of her.","この曲を聞くと、僕はあの子を思い出すんだ。"]]],["soon",0,3,0,"間もなく、早く、速やかに",[["He ran away as soon as he saw me.","彼は私を見るとすぐ逃げ去った。"],["I spend money as soon as I get it.","お金が入ると、すぐ使っちゃうんだよ。"]]],["sorry",0,2,0,"悲しいと思う",[["I am sorry that my friend is not here.","私の友人がここにいないのは残念だ。"],["I'm sorry. I don't have a lot of time.","ごめんなさい。時間があまりないんです。"]]],["soup",0,0,0,"スープ",[["I think the soup needs a bit of salt.","このスープ、ちょっと塩味が足りないかな。"],["The soup in the cup looks very hot.","カップの中のスープは、見たところとても熱そうだ。"]]],["speak",0,1,0,"話す、話をする、演説する",[["I don't like the way he speaks to me.","私に対する彼の話し方が気に入らないな。"],["I did speak, but no one listened to me.","私はたしかに話したのだが、誰も私の話に耳を傾けなかった。"]]],["special",0,2,0,"特別な、特殊な、独特の",[["May I ask a very special favor of you?","折り入ってお願いしたいことがあるのですが。"],["Is there any place special you want to go?","特別に行きたい場所はありますか？"]]],["speech",0,0,0,"話すこと、言葉・演説、スピーチ・(人の)話し方・(役者の)セリフ・話法",[["I had to make a speech on short notice.","私は急にスピーチをしなければならなくなった。"],["He made a speech in front of many people.","彼はたくさんの人々の前で演説した。"]]],["spell",0,0,0,"呪文、ひと続き、ひとしきり",[["Will you tell me how to spell the word?","その単語のつづりを教えてくれませんか。"],["I don't know how to spell the word.","私はその単語のつづりがわかりません。"]]],["spend",0,1,0,"使う、過ごす",[["I spend money as soon as I get it.","お金が入ると、すぐ使っちゃうんだよ。"],["He spent all of his money on a car.","彼は全財産を車に費やした。"]]],["sport",0,0,0,"スポーツ、気晴らし",[["You have to give up sports for a while.","スポーツはしばらく控えてください。"],["I love sports. I get that from my father.","スポーツが好きなのは、父親譲りなんだ。"]]],["spot",0,0,0,"斑点、しみ、場所",[["He was run over and killed on the spot.","彼は車に轢かれて即死した。"],["I have spots coming out all over my face.","顔中にぶつぶつができた。"]]],["spring",0,0,0,"春、跳ぶこと、ばね",[["There are many new programs to watch this spring.","今年の春は見るべき新番組がたくさんあります。"],["Some flowers bloom in spring and others in autumn.","春に咲く花もあれば、秋に咲く花もある。"]]],["spy",0,0,0,"スパイ、探偵",[["He believes that there is a spy among us.","私たちの中にスパイがいると彼は信じている。"],["Do you really think Tom is a spy?","本当にトムがスパイだと思ってるの？"]]],["stage",0,0,0,"舞台、段階",[["There are those who compare life to a stage.","人生を舞台にたとえる人もいる。"],["Who is the girl singing on the stage?","ステージで歌ってる女の子は誰？"]]],["stand",0,0,0,"立つこと;立ち止まること、台、屋台店",[["I can see the tower from where I stand.","私の立っている場所からその塔が見える。"],["A castle stands a little way up the hill.","丘の上の方に城があります。"]]],["star",0,0,0,"星、スター",[["I got a room in a four-star hotel.","4つ星ホテルの部屋をとったよ。"],["The door had a big gold star on it.","ドアには大きな金色の星がついていました。"]]],["start",0,0,0,"出発、開始",[["I'm going to start a new job next week.","私は来週、新しい仕事を始めます。"],["I think I'll start with a bottle of beer.","まずビールからはじめよう。"]]],["start",0,1,0,"出発する、始まる、活動し始める",[["School has started and I like it so far.","学校が始まりましたが、今のところいやなことはありません。"],["It is necessary for you to start at once.","あなたはすぐに始めなければなりません。"]]],["station",0,0,0,"駅、署",[["I have to go to the station at once.","すぐ駅に行かないといけないんだよ。"],["I got a taxi in front of the station.","駅前でタクシーを拾った。"]]],["stay",0,1,0,"とどまる、滞在する、じっとしている",[["Is it OK if I stay in the car?","車の中にいてもいい？"],["I want to be a stay-at-home dad.","専業主夫になりたい。"]]],["step",0,1,0,"歩む",[["Watch your step when you get on the train.","電車に乗るときは足元に気をつけなさい。"],["Watch your step, or you will slip and fall.","足元よく見ないと、すってんころりするよ。"]]],["still",0,2,0,"静かな",[["I still have a lot of work to do.","やらなければいけない仕事がまだたくさんあるんだ。"],["I still have a lot of time for fun.","まだまだたっぷりと遊ぶ時間はあるぜ。"]]],["stone",0,0,0,"石、小石",[["This stone was too heavy for me to lift.","この石はとても重かったので持ち上げることができなかった。"],["The boy threw a stone at the frog.","その少年はカエルめがけて石ころを投げた。"]]],["stop",0,0,0,"止まること",[["I held up my hand to stop a taxi.","私はタクシーを止めるために手を上げた。"],["I have to get off at the next stop.","次で降りなきゃ。"]]],["stop",0,1,0,"止める、やめる、止まる",[["We got off the bus at the last stop.","終点でバスを降りました。"],["Could you drop me off at the bus stop?","バス停で私を降ろしてもらえますか。"]]],["store",0,0,0,"店、蓄え",[["I picked out a new hat at the store.","私は店で新しい帽子を選んだ。"],["Buy eggs at the store on your way home.","帰りにスーパーで卵買ってきて。"]]],["storey",0,0,0,"話、物語、階",[]],["story",0,0,0,"話、物語、階",[["To cut a long story short, he was fired.","早い話が彼は首になったのだ。"],["To make a long story short, I was fired.","要するに私は首になったのだ。"]]],["straight",0,3,0,"まっすぐな、直立した、整理した",[["I thought you were going to come straight home.","あなたはまっすぐ家に帰るつもりなのだと思っていたんだけど。"],["He drew a straight line with his pencil.","彼は鉛筆で真っ直ぐな線を描いた。"]]],["strange",0,2,0,"奇妙な、見た(聞いた)ことのない",[["A stranger asked me the way to the school.","知らない人が、学校へ行く道を聞いてきたの。"],["A stranger spoke to me on the crowded bus.","見知らぬ人が混み合ったバスの中で私に話しかけた。"]]],["street",0,0,0,"街路",[["No one was to be seen in the street.","通りには誰一人見えなかった。"],["No one was to be seen on the street.","通りに人の姿はなかった。"]]],["strict",0,2,0,"厳しい",[["Both of my parents are strict with me.","俺の親二人とも俺に厳しいんだ。"],["My mother is strict, but my father isn't.","私のお母さんは厳しいけど、お父さんはそんなことないよ。"]]],["strong",0,2,0,"力の強い、じょうぶな、がんじょうな",[["Tom isn't as strong as he used to be.","トムは前ほど強くないよ。"],["Tom isn't as strong as you think he is.","トムはあなたが思っているほど強くはないの。"]]],["student",0,0,0,"研究者",[["It is the role of a student to study.","勉強するのが学生の本分だ。"],["I want to rent this room to a student.","この部屋を学生に賃貸したいです。"]]],["study",0,1,0,"勉強する、よく注意して見る、調査する",[["I'm going to my room, so I can study.","勉強できるように自分の部屋に行くよ。"],["It is the role of a student to study.","勉強するのが学生の本分だ。"]]],["subject",0,0,0,"主題、科目、主語",[["His remark has nothing to do with the subject.","彼の発言はそのテーマとは何の関係もない。"],["What subject do you think he is interested in?","君は彼がどの学科に興味を持っていると思いますか。"]]],["subway",0,0,0,"地下鉄",[["Is it dangerous to take a subway alone?","一人で地下鉄に乗るのは危ないですか。"],["Which is quicker, a taxi or the subway?","タクシーと地下鉄、どっちで行くほうが早いかな？"]]],["successful",0,2,0,"成功した",[["Love alone isn't enough for a successful international marriage.","国際結婚は愛だけで成せるほど簡単ではない。"],["I don't think that Tom will be successful.","トムが成功するとは思えないね。"]]],["sugar",0,0,0,"砂糖、(1個・さじ1杯の)砂糖",[["She put a lot of sugar in the coffee.","彼女はコーヒーにたくさん砂糖を入れた。"],["She advised him not to use too much sugar.","彼女は彼に砂糖を使いすぎないように忠告した。"]]],["suggestion",0,0,0,"提案、提案されたもの(こと)、少しばかり",[["There was a suggestion of anger in his voice.","彼の声に多少怒りの響きがあった。"],["He turned up his nose at my suggestion.","彼は私の提案を鼻であしらった。"]]],["sum",0,0,0,"合計、額",[["I've never had such a large sum of money.","こんな大金は手にしたことがない。"],["Five thousand dollars is a large sum of money.","５千ドルというのは、多額なお金だ。"]]],["summer",0,0,0,"夏",[["We had a good deal of rain last summer.","去年の夏は雨が多かった。"],["I want to know what you did this summer.","あなたが今年の夏何をしたか知りたい。"]]],["sun",0,0,0,"太陽、日光",[["Since the sun had set, we all headed home.","日が沈んだので私たちはみんな家へ向かった。"],["I'm sitting in the sun, but I'm still cold.","日なたに座ってるけど、まだ寒いなぁ。"]]],["Sunday",0,0,0,"日曜日",[["I worked on Sunday, so I had Monday off.","日曜日に出社したので月曜日が代休だった。"],["I will teach you how to fish next Sunday.","来週の日曜日に釣りを教えてあげよう。"]]],["sunny",0,2,0,"日のよくさす(当たる)",[["Since it was sunny, we went on a hike.","晴れてたから、ハイキングに行ったのよ。"],["A warm, sunny day is ideal for a picnic.","暖かくて晴れた日はピクニックにもってこいだよ。"]]],["sunshine",0,0,0,"日光、明るさ",[["This room gets a lot of sunshine.","この部屋は日当たりがいいですよ。"],["The room was bathed in sunshine.","その部屋には日光がさんさんと注いでいた。"]]],["super",0,2,0,"(アパートなどの)管理人、長官、所長、監督(superintendent)、(映",[["I decided to wait in line to buy some super cheap eggs.","激安の玉子を買うために行列に並ぶことにした。"],["The transfer student in the other class is a super good-looking guy.","隣のクラスの転校生、超イケメンだって。"]]],["supermarket",
